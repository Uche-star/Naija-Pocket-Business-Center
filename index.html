<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Pocket Business Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:Arial,sans-serif}
.flyer{max-width:440px;margin:0 auto;background:#fff;min-height:100vh}
.header{background:#111;padding:12px;text-align:center;border:2px solid #D4AF37}
.header h1{color:#fff;font-size:26px;font-weight:900;line-height:1.1}
.header h1 span{color:#E8C96A}
.lady-img{width:100%;display:block;max-height:340px;object-fit:cover;object-position:top}
.instruction{padding:12px 10px;text-align:center;font-weight:900;font-size:13px;line-height:1.3;text-transform:uppercase;background:#fff;border-top:1px solid #D4AF37;border-bottom:1px solid #D4AF37}
.services-wrap{padding:6px;background:#fff}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.service-button{width:100%;padding:11px 3px;background:#111;color:#F4E8BE;border:1px solid #D4AF37;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer}
.service-button:hover{background:#D4AF37;color:#000}
.footer{padding:10px;background:#111;color:#F4E8BE;text-align:center;font-size:10px}
</style>
</head>
<body>
<div class="flyer">
<div class="header"><h1>NAIJA POCKET<br><span>BUSINESS CENTER</span></h1></div>
<img class="lady-img" src="lady_small.jpg" alt="Naija Pocket Business Center">
<div class="instruction">TAP ANY SERVICE YOU NEED AND GET YOUR DOCUMENTS DONE IN MINUTES</div>
<div class="services-wrap">
<div class="services">
<button class="service-button" data-service="Document Typing">Document Typing</button>
<button class="service-button" data-service="Document Formatting">Document Formatting</button>
<button class="service-button" data-service="Document Editing">Document Editing</button>
<button class="service-button" data-service="Grammar Correction">Grammar Correction</button>
<button class="service-button" data-service="Assignments">Assignments</button>
<button class="service-button" data-service="Projects">Projects</button>
<button class="service-button" data-service="Research Assistance">Research Assistance</button>
<button class="service-button" data-service="Seminar Papers">Seminar Papers</button>
<button class="service-button" data-service="CVs & Résumés">CVs & Résumés</button>
<button class="service-button" data-service="Cover Letters">Cover Letters</button>
<button class="service-button" data-service="Business Proposals">Business Proposals</button>
<button class="service-button" data-service="Company Profiles">Company Profiles</button>
<button class="service-button" data-service="Invoices">Invoices</button>
<button class="service-button" data-service="Quotations">Quotations</button>
<button class="service-button" data-service="Meeting Minutes">Meeting Minutes</button>
<button class="service-button" data-service="AI Writing Assistance">AI Writing Assistance</button>
<button class="service-button" data-service="Document Rewriting">Document Rewriting</button>
<button class="service-button" data-service="Translation">Translation</button>
<button class="service-button" data-service="PDF Conversion">PDF Conversion</button>
<button class="service-button" data-service="Topic Explanations">Topic Explanations</button>
<button class="service-button" data-service="Printing Preparation">Printing Preparation</button>
<button class="service-button" data-service="Excel Spreadsheets">Excel Spreadsheets</button>
<button class="service-button" data-service="Data Entry">Data Entry</button>
<button class="service-button" data-service="Data Analysis">Data Analysis</button>
<button class="service-button" data-service="Presentations">Presentations</button>
<button class="service-button" data-service="Document Summarization">Document Summarization</button>
<button class="service-button" data-service="Business Letters & Letterhead">Business Letters & Letterhead</button>
</div>
</div>
<div class="footer">PROFESSIONAL • FAST • RELIABLE • OPEN 24/7</div>
</div>
<script>
const btns=document.querySelectorAll(".service-button");
function openWorkspace(s){
 let c=localStorage.getItem("npbc_customer_id");
 if(!c){c="customer_"+Date.now();localStorage.setItem("npbc_customer_id",c)}
 localStorage.setItem("selectedService",s);
 location.href="/workspace?service="+encodeURIComponent(s)+"&customer_id="+encodeURIComponent(c);
}
btns.forEach(b=>b.addEventListener("click",()=>openWorkspace(b.getAttribute("data-service"))));
</script>
</body>
</html>
