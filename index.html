<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naija Pocket Business Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020202;color:#fff;font-family:Arial,Helvetica,sans-serif}
.page{width:100%;height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:4px;padding:4px;background:radial-gradient(circle at 50% -10%,rgba(212,175,55,.08),transparent 30%),linear-gradient(145deg,#010101 0%,#070707 43%,#020202 100%)}
.header{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(ellipse at 50% 35%,#202020 0%,#0e0e0e 42%,#050505 78%,#000 100%);border:1px solid rgba(212,175,55,.34);border-bottom:2px solid rgba(212,175,55,.82);border-radius:10px;padding:10px 8px}
.brand-name{margin:0;color:#fff;font-family:Georgia,serif;font-size:32px;line-height:1.12;font-weight:700;text-transform:uppercase}
.brand-name .green{color:#39B87F} .brand-name .gold{color:#E8C96A}
.gold-divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,#D4AF37 25%,#F4D878 50%,#D4AF37 75%,transparent);margin:6px 0}
.value{color:#f4f1e8;font-size:14px;font-weight:600;letter-spacing:1px}
.value.luxury-value{width:calc(100% - 8px);padding:10px 12px;background:#fffefb;border:1px solid #d4af37;border-radius:8px;color:#111;font-family:Georgia,serif;text-transform:uppercase;text-align:center;font-size:13px}
.lady-wrap{width:100%;display:flex;justify-content:center;background:#fff;border-radius:8px;overflow:hidden;border:1px solid rgba(212,175,55,.4)}
.lady-img{width:100%;max-width:380px;height:160px;object-fit:cover;object-position:top}
.service-instruction{text-align:center;color:#FFFDF5;font-family:Georgia,serif;font-size:13px;font-weight:700;text-transform:uppercase;line-height:1.2;padding:7px;border-top:1px solid rgba(212,175,106,.7);border-bottom:1px solid rgba(212,175,106,.45)}
.services{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));gap:4px;overflow:hidden}
.service-button{width:100%;height:100%;min-width:0;min-height:0;padding:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.065);border-radius:5px;font-family:Arial,sans-serif;font-size:11px;line-height:1.15;font-weight:700;cursor:pointer;color:#FFF;text-align:center;display:flex;align-items:center;justify-content:center}
.service-button:active{background:rgba(212,175,55,.15);border-color:#D4AF37}
.footer{text-align:center;font-size:9px;letter-spacing:1px;color:#aaa;padding:4px}
</style>
</head>
<body>
<div class="page">
<section class="header">
<h1 class="brand-name"><span class="green">NAIJA POCKET</span><br>BUSINESS <span class="gold">CENTER</span></h1>
<div class="gold-divider"></div>
<div class="value">FAST • CONVENIENT • OPEN 24/7</div>
<div class="value luxury-value">TAP ANY SERVICE YOU NEED AND GET YOUR DOCUMENTS DONE IN MINUTES</div>
</section>

<div class="lady-wrap">
<img class="lady-img" src="https://i.postimg.cc/8cJp6Q3X/naija-lady.jpg" alt="Naija Pocket Business Center - Smiling lady wearing T-shirt">
</div>

<section style="display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden">
<div class="service-instruction">TAP ANY SERVICE YOU NEED</div>
<div class="services">
<button class="service-button" data-service="Document Typing">Document Typing</button>
<button class="service-button" data-service="Document Formatting">Document Formatting</button>
<button class="service-button" data-service="Document Editing">Document Editing</button>
<button class="service-button" data-service="Grammar Correction">Grammar Correction</button>
<button class="service-button" data-service="Assignments">Assignments</button>
<button class="service-button" data-service="Projects">Projects</button>
<button class="service-button" data-service="Research Assistance">Research Assistance</button>
<button class="service-button" data-service="Seminar Papers">Seminar Papers</button>
<button class="service-button" data-service="CVs & Résumés">CVs & Résumés</button>
<button class="service-button" data-service="Cover Letters">Cover Letters</button>
<button class="service-button" data-service="Business Proposals">Business Proposals</button>
<button class="service-button" data-service="Company Profiles">Company Profiles</button>
<button class="service-button" data-service="Invoices">Invoices</button>
<button class="service-button" data-service="Quotations">Quotations</button>
<button class="service-button" data-service="Meeting Minutes">Meeting Minutes</button>
<button class="service-button" data-service="AI Writing Assistance">AI Writing Assistance</button>
<button class="service-button" data-service="Document Rewriting">Document Rewriting</button>
<button class="service-button" data-service="Translation">Translation</button>
<button class="service-button" data-service="PDF Conversion">PDF Conversion</button>
<button class="service-button" data-service="Topic Explanations">Topic Explanations</button>
<button class="service-button" data-service="Printing Preparation">Printing Preparation</button>
<button class="service-button" data-service="Excel Spreadsheets">Excel Spreadsheets</button>
<button class="service-button" data-service="Data Entry">Data Entry</button>
<button class="service-button" data-service="Data Analysis">Data Analysis</button>
<button class="service-button" data-service="Presentations">Presentations</button>
<button class="service-button" data-service="Document Summarization">Document Summarization</button>
<button class="service-button" data-service="Business Letters & Letterhead">Business Letters & Letterhead</button>
</div>
</section>
<div class="footer">PROFESSIONAL • FAST • RELIABLE</div>
</div>

<script>
const serviceButtons=document.querySelectorAll(".service-button");
function openWorkspace(service){
 let customerId=localStorage.getItem("npbc_customer_id");
 if(!customerId){customerId="customer_"+Date.now();localStorage.setItem("npbc_customer_id",customerId)}
 localStorage.setItem("selectedService",service);
 location.href="workspace.html?service="+encodeURIComponent(service)+"&customer_id="+encodeURIComponent(customerId);
}
serviceButtons.forEach(b=>b.addEventListener("click",()=>openWorkspace(b.getAttribute("data-service"))));
</script>
</body>
</html>
