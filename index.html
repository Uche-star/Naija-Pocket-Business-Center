<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Naija Pocket Business Center</title><style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020202;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding: 4px;
    display: grid;
    grid-template-rows: minmax(0, 38%) minmax(0, 1fr);
    gap: 4px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% -10%, rgba(212,175,55,.085), transparent 30%),
        linear-gradient(145deg, #010101 0%, #070707 43%, #020202 100%);
}

/* PROMOTIONAL IMAGE */

.welcome-half {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1px solid rgba(212,175,55,.75);
    border-radius: 8px;
}

.welcome-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    background: #fff;
}

/* SERVICES SECTION */

.services-half {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    overflow: hidden;
    padding-top: 2px;
}

.service-instruction {
    text-align: center;
    color: #FFFFFF;
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.2;
    padding: 7px 4px;
    border-top: 1px solid rgba(212,175,106,.7);
    border-bottom: 1px solid rgba(212,175,106,.45);
    margin-bottom: 5px;
    flex-shrink: 0;
}

.services {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    gap: 4px;
    overflow: hidden;
}

.service-button {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    padding: 4px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(212,175,55,.3);
    border-radius: 5px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    line-height: 1.15;
    font-weight: 700;
    cursor: pointer;
    color: #FFFFFF;
    text-align: center;
    overflow-wrap: anywhere;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}

.service-button:active {
    background: rgba(212,175,55,.2);
    border-color: #D4AF37;
}

/* SHORT SCREENS */

@media (max-height: 750px) {
    .page {
        padding: 3px;
        gap: 3px;
        grid-template-rows: minmax(0, 35%) minmax(0, 1fr);
    }

    .service-instruction {
        padding: 5px 4px;
        margin-bottom: 3px;
        font-size: 12px;
    }

    .services {
        gap: 3px;
    }
}

/* SMALL ANDROID PHONES */

@media (max-width: 360px) {
    .service-instruction {
        font-size: 11px;
        padding: 5px 3px;
    }

    .services {
        gap: 2px;
    }

    .service-button {
        padding: 3px 2px;
        font-size: 10px;
    }
}

/* VERY SHORT SCREENS */

@media (max-height: 620px) {
    .page {
        grid-template-rows: minmax(0, 30%) minmax(0, 1fr);
    }

    .service-instruction {
        padding: 3px;
        font-size: 10px;
        line-height: 1.1;
    }

    .services {
        gap: 2px;
    }

    .service-button {
        padding: 2px;
        font-size: 9px;
        line-height: 1.05;
    }
}

/* EXTRA SMALL SCREENS */

@media (max-width: 320px) {
    .service-button {
        font-size: 8px;
        padding: 2px 1px;
    }

    .service-instruction {
        font-size: 9px;
    }
}
</style></head><body><div class="page"><!-- NPBC PROMOTIONAL IMAGE -->
<section class="welcome-half">
    <img
        class="welcome-image"
        src="npbc-welcome-image.png"
        alt="Naija Pocket Business Center: Tap any service you need and get your documents prepared in minutes using your phone"
    >
</section>

<!-- EXISTING NPBC SERVICES -->
<section class="services-half">

    <div class="service-instruction">
        TAP ANY SERVICE YOU NEED AND GET YOUR DOCUMENTS PROCESSED IN MINUTES
    </div>

    <div class="services">

        <button class="service-button" data-service="Document Typing">Document Typing</button>
        <button class="service-button" data-service="Document Formatting">Document Formatting</button>
        <button class="service-button" data-service="Document Editing">Document Editing</button>

        <button class="service-button" data-service="Grammar Correction">Grammar Correction</button>
        <button class="service-button" data-service="Assignments">Assignments</button>
        <button class="service-button" data-service="Projects">Projects</button>

        <button class="service-button" data-service="Research Assistance">Research Assistance</button>
        <button class="service-button" data-service="Seminar Papers">Seminar Papers</button>
        <button class="service-button" data-service="CVs & Résumés">CVs &amp; Résumés</button>

        <button class="service-button" data-service="Cover Letters">Cover Letters</button>
        <button class="service-button" data-service="Business Proposals">Business Proposals</button>
        <button class="service-button" data-service="Company Profiles">Company Profiles</button>

        <button class="service-button" data-service="Invoices">Invoices</button>
        <button class="service-button" data-service="Quotations">Quotations</button>
        <button class="service-button" data-service="Meeting Minutes">Meeting Minutes</button>

        <button class="service-button" data-service="AI Writing Assistance">AI Writing Assistance</button>
        <button class="service-button" data-service="Document Rewriting">Document Rewriting</button>
        <button class="service-button" data-service="Translation">Translation</button>

        <button class="service-button" data-service="PDF Conversion">PDF Conversion</button>
        <button class="service-button" data-service="Topic Explanations">Topic Explanations</button>
        <button class="service-button" data-service="Printing Preparation">Printing Preparation</button>

        <button class="service-button" data-service="Excel Spreadsheets">Excel Spreadsheets</button>
        <button class="service-button" data-service="Data Entry">Data Entry</button>
        <button class="service-button" data-service="Data Analysis">Data Analysis</button>

        <button class="service-button" data-service="Presentations">Presentations</button>
        <button class="service-button" data-service="Document Summarization">Document Summarization</button>
        <button class="service-button" data-service="Business Letters & Letterhead">Business Letters &amp; Letterhead</button>

    </div>

</section>

</div><script>
const serviceButtons = document.querySelectorAll(".service-button");

function openWorkspace(service) {
    let customerId = localStorage.getItem("npbc_customer_id");

    if (!customerId) {
        customerId = "customer_" + Date.now();
        localStorage.setItem("npbc_customer_id", customerId);
    }

    localStorage.setItem("selectedService", service);

    location.href =
        "workspace.html?service=" +
        encodeURIComponent(service) +
        "&customer_id=" +
        encodeURIComponent(customerId);
}

serviceButtons.forEach(button => {
    button.addEventListener("click", () => {
        openWorkspace(button.getAttribute("data-service"));
    });
});
</script></body>
</html>
