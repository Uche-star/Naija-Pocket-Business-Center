<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naija Pocket Business Center</title><style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #0B0B0B;
        color: white;
        font-family: Arial, sans-serif;
    }

    .page {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 12px 35px 0;
    }

    .instruction {
        flex-shrink: 0;
        background: #171717;
        color: white;
        padding: 14px 15px;
        margin-bottom: 10px;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
    }

    .services {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 8px;
        padding: 2px 0 12px;
    }

    .service-button {
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: 7px 5px;
        background: white;
        color: #1E90FF;
        border: 1px solid #d0d0d0;
        border-radius: 2px;
        font-family: Arial, sans-serif;
        font-size: 10px;
        font-weight: bold;
        line-height: 1.15;
        overflow-wrap: break-word;
        cursor: pointer;
    }

    .service-button:hover {
        background: #f2f2f2;
    }

    .back-area {
        flex-shrink: 0;
        width: 100%;
        background: #0B0B0B;
        padding: 8px 0 12px;
    }

    .back-button {
        width: 100%;
        min-height: 48px;
        background: #B00020;
        color: white;
        border: none;
        border-radius: 2px;
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
    }

    .back-button:hover {
        filter: brightness(0.92);
    }

    @media (max-width: 480px) {
        .page {
            padding: 8px 12px 0;
        }

        .instruction {
            padding: 10px 8px;
            margin-bottom: 7px;
            font-size: 11px;
            line-height: 1.35;
        }

        .services {
            gap: 6px;
            padding-bottom: 8px;
        }

        .service-button {
            min-height: 42px;
            padding: 6px 3px;
            font-size: 9px;
        }

        .back-area {
            padding: 6px 0 9px;
        }

        .back-button {
            min-height: 44px;
            font-size: 10px;
        }
    }

    @media (max-width: 360px) {
        .page {
            padding-left: 8px;
            padding-right: 8px;
        }

        .instruction {
            font-size: 10px;
        }

        .services {
            gap: 5px;
        }

        .service-button {
            min-height: 40px;
            padding: 5px 2px;
            font-size: 8px;
        }

        .back-button {
            min-height: 42px;
            font-size: 9px;
        }
    }
</style>

</head><body><div class="page"><div class="instruction">
    There are 28 services available. Please scroll through the list, find the service you need, and tap on it. Your request will be attended to immediately.
</div>

<div class="services">

    <button class="service-button">Document Typing</button>
    <button class="service-button">Document Formatting</button>

    <button class="service-button">Document Editing</button>
    <button class="service-button">Grammar Correction</button>

    <button class="service-button">Assignments</button>
    <button class="service-button">Projects</button>

    <button class="service-button">Research Assistance</button>
    <button class="service-button">Seminar Papers</button>

    <button class="service-button">CVs &amp; Résumés</button>
    <button class="service-button">Cover Letters</button>

    <button class="service-button">Business Proposals</button>
    <button class="service-button">Company Profiles</button>

    <button class="service-button">Business Letters &amp; Letterhead</button>
    <button class="service-button">Invoices</button>

    <button class="service-button">Quotations</button>
    <button class="service-button">Meeting Minutes</button>

    <button class="service-button">AI Writing Assistance</button>
    <button class="service-button">Document Rewriting</button>

    <button class="service-button">Translation</button>
    <button class="service-button">Document Summarization</button>

    <button class="service-button">PDF Conversion</button>
    <button class="service-button">Voice To Text</button>

    <button class="service-button">Topic Explanations</button>
    <button class="service-button">Printing Preparation</button>

    <button class="service-button">Excel Spreadsheets</button>
    <button class="service-button">Data Entry</button>

    <button class="service-button">Data Analysis</button>
    <button class="service-button">Presentations</button>

</div>

<div class="back-area">
    <button class="back-button" onclick="window.location.href='index.html'">
        ⬅ Back To Welcome Page
    </button>
</div>

</div></body>
</html>
