<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: Inter, Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            padding:
                max(8px, env(safe-area-inset-top))
                10px
                max(8px, env(safe-area-inset-bottom))
                10px;

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =====================================================
           HEADER / INSTRUCTION
           ===================================================== */

        .header {
            width: 100%;
            flex-shrink: 0;

            background: #171717;
            border: 1px solid #292929;
            border-bottom: 2px solid #D4AF37;
            border-radius: 6px;

            padding: 10px 8px;
            margin-bottom: 7px;

            text-align: center;
        }

        .brand {
            font-family: Montserrat, Arial, sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #D4AF37;
            line-height: 1.2;
        }

        .instruction {
            margin-top: 5px;

            color: #ffffff;
            font-size: 12px;
            line-height: 1.3;
            font-weight: 700;
        }

        /* =====================================================
           SERVICE BUTTONS
           ===================================================== */

        .services {
            width: 100%;

            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 5px;

            flex: 1;
            min-height: 0;

            overflow: hidden;
        }

        .service-button {
            width: 100%;
            min-width: 0;
            height: 32px;

            padding: 2px 5px;

            background: #202020;
            color: #ffffff;

            border: 1px solid #303030;
            border-radius: 5px;

            font-family: Inter, Arial, sans-serif;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .service-button:hover {
            background: #2b2b2b;
            border-color: #D4AF37;
            color: #D4AF37;
        }

        .service-button:active {
            background: #D4AF37;
            border-color: #D4AF37;
            color: #000000;
            transform: scale(0.98);
        }

        .service-button.working {
            background: #D4AF37;
            color: #000000;
            border-color: #D4AF37;
        }

        .service-button:disabled {
            cursor: wait;
            opacity: 0.45;
        }

        /* =====================================================
           BOTTOM MESSAGE
           ===================================================== */

        .bottom-message {
            width: 100%;
            flex-shrink: 0;

            margin-top: 7px;
            padding: 7px 6px;

            background: #171717;
            border-top: 1px solid #292929;
            border-radius: 5px;

            color: #CCCCCC;

            text-align: center;
            font-size: 11px;
            line-height: 1.3;
            font-weight: 700;
        }

        /* =====================================================
           LARGER PHONES
           ===================================================== */

        @media (min-width: 481px) {

            .page {
                padding-left: 20px;
                padding-right: 20px;
            }

            .header {
                padding: 12px 10px;
            }

            .brand {
                font-size: 20px;
            }

            .instruction {
                font-size: 13px;
            }

            .service-button {
                height: 35px;
                font-size: 11px;
            }

            .bottom-message {
                font-size: 12px;
            }
        }

        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 7px;
                padding-right: 7px;
            }

                padding: 8px 5px;

            }

            }

                margin-top: 4px;
            }

            }

                padding: 2px;
                font-size: 9px;
            }

            .bottom-message {
                margin-top: 5px;
                padding: 6px 3px;
                font-size: 10px;
            }
        }
    </style>
</head>

        class="bottom-message"

        Tap the service you need and your request will be attended to immediately.

<script>

"use strict";


const serviceButtons =
    document.querySelectorAll(
        ".service-button"
    );

let requestInProgress = false;


/* ============================================================
   OPEN WORKSPACE
============================================================ */

function openWorkspace(
    service,
    button
) {

    if (requestInProgress) {
        return;
    }

    if (!service) {
        return;
    }

    requestInProgress = true;

    button.classList.add(
        "working"
    );


    serviceButtons.forEach(
        function(otherButton) {

            if (
                otherButton !== button
            ) {
                otherButton.disabled =
                    true;
            }
        }
    );


    localStorage.setItem(
        "selectedService",
        service
    );


    document.getElementById(
        "bottomMessage"
    ).innerText =
        "Opening your workspace for " +
        service +
        "...";


    const workspaceUrl =
        "workspace.html?service=" +
        encodeURIComponent(
            service
        );


    window.location.assign(
        workspaceUrl
    );
}


/* ============================================================
   ATTACH CLICK EVENTS
============================================================ */

serviceButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const service =
                    button.getAttribute(
                        "data-service"
                    );

                if (!service) {
                    return;
                }

                openWorkspace(
                    service,
                    button
                );
            }
        );
    }
);

</script>
