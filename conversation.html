<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            padding:
                max(8px, env(safe-area-inset-top))
                10px
                max(8px, env(safe-area-inset-bottom))
                10px;

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =====================================================
           TOP MESSAGE
        ===================================================== */

        .instruction {
            width: 100%;
            color: white;
            padding: 7px 6px;
            margin-bottom: 7px;
            text-align: center;
            font-size: 12px;
            line-height: 1.25;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* =====================================================
           28 SERVICE BUTTONS
        ===================================================== */

        .services {
            width: 100%;

            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 4px;

            flex: 1;
            min-height: 0;

            overflow: hidden;
        }

        .service-button {
            width: 100%;
            min-width: 0;
            height: 31px;

            padding: 2px 3px;

            background: #000000;
            color: white;

            border: 1px solid white;
            border-radius: 2px;

            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            line-height: 1;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .service-button:hover {
            background: white;
            color: black;
        }

        .service-button:active {
            background: white;
            color: black;
            transform: scale(0.98);
        }

        .service-button.working {
            background: white;
            color: black;
            border-color: white;
        }

        .service-button:disabled {
            cursor: wait;
            opacity: 0.55;
        }

        /* =====================================================
           BOTTOM MESSAGE
        ===================================================== */

        .bottom-message {
            width: 100%;
            color: white;
            text-align: center;

            font-size: 11px;
            line-height: 1.25;
            font-weight: bold;

            padding: 7px 4px 2px;

            flex-shrink: 0;
        }

        /* =====================================================
           LARGER PHONES
        ===================================================== */

        @media (min-width: 481px) {

            .page {
                padding-left: 20px;
                padding-right: 20px;
            }

            .instruction {
                font-size: 13px;
            }

            .service-button {
                height: 34px;
                font-size: 11px;
            }

            .bottom-message {
                font-size: 12px;
            }
        }

        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 7px;
                padding-right: 7px;
            }

            .instruction {
                font-size: 10px;
                padding: 6px 3px;
                margin-bottom: 5px;
            }

            .services {
                gap: 3px;
            }

            .service-button {
                height: 29px;
                padding: 2px;
                font-size: 9px;
            }

            .bottom-message {
                font-size: 10px;
                padding-top: 6px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="instruction">
        Choose the service you need and we’ll take it from there.
    </div>


    <div class="services">

        <button type="button" class="service-button" data-service="Document Typing">
            Document Typing
        </button>

        <button type="button" class="service-button" data-service="Document Formatting">
            Document Formatting
        </button>

        <button type="button" class="service-button" data-service="Document Editing">
            Document Editing
        </button>

        <button type="button" class="service-button" data-service="Grammar Correction">
            Grammar Correction
        </button>

        <button type="button" class="service-button" data-service="Assignments">
            Assignments
        </button>

        <button type="button" class="service-button" data-service="Projects">
            Projects
        </button>

        <button type="button" class="service-button" data-service="Research Assistance">
            Research Assistance
        </button>

        <button type="button" class="service-button" data-service="Seminar Papers">
            Seminar Papers
        </button>

        <button type="button" class="service-button" data-service="CVs & Résumés">
            CVs &amp; Résumés
        </button>

        <button type="button" class="service-button" data-service="Cover Letters">
            Cover Letters
        </button>

        <button type="button" class="service-button" data-service="Business Proposals">
            Business Proposals
        </button>

        <button type="button" class="service-button" data-service="Company Profiles">
            Company Profiles
        </button>

        <button type="button" class="service-button" data-service="Business Letters & Letterhead">
            Business Letters &amp; Letterhead
        </button>

        <button type="button" class="service-button" data-service="Invoices">
            Invoices
        </button>

        <button type="button" class="service-button" data-service="Quotations">
            Quotations
        </button>

        <button type="button" class="service-button" data-service="Meeting Minutes">
            Meeting Minutes
        </button>

        <button type="button" class="service-button" data-service="AI Writing Assistance">
            AI Writing Assistance
        </button>

        <button type="button" class="service-button" data-service="Document Rewriting">
            Document Rewriting
        </button>

        <button type="button" class="service-button" data-service="Translation">
            Translation
        </button>

        <button type="button" class="service-button" data-service="Document Summarization">
            Document Summarization
        </button>

        <button type="button" class="service-button" data-service="PDF Conversion">
            PDF Conversion
        </button>

        <button type="button" class="service-button" data-service="Voice To Text">
            Voice To Text
        </button>

        <button type="button" class="service-button" data-service="Topic Explanations">
            Topic Explanations
        </button>

        <button type="button" class="service-button" data-service="Printing Preparation">
            Printing Preparation
        </button>

        <button type="button" class="service-button" data-service="Excel Spreadsheets">
            Excel Spreadsheets
        </button>

        <button type="button" class="service-button" data-service="Data Entry">
            Data Entry
        </button>

        <button type="button" class="service-button" data-service="Data Analysis">
            Data Analysis
        </button>

        <button type="button" class="service-button" data-service="Presentations">
            Presentations
        </button>

    </div>


    <div
        id="bottomMessage"
        class="bottom-message"
    >
        Tap the service you need and your request will be attended to immediately.
    </div>

</div>


<script>

const serviceButtons =
    document.querySelectorAll(
        ".service-button"
    );

let requestInProgress = false;


/* ============================================================
   OPEN WORKSPACE
============================================================ */

function openWorkspace(
    service,
    button
) {

    if (requestInProgress) {
        return;
    }

    if (!service) {
        return;
    }

    requestInProgress = true;

    button.classList.add(
        "working"
    );


    serviceButtons.forEach(
        function(otherButton) {

            if (
                otherButton !== button
            ) {
                otherButton.disabled =
                    true;
            }
        }
    );


    localStorage.setItem(
        "selectedService",
        service
    );


    document.getElementById(
        "bottomMessage"
    ).innerText =
        "Opening your workspace for " +
        service +
        "...";


    const workspaceUrl =
        "workspace.html?service=" +
        encodeURIComponent(
            service
        );


    window.location.assign(
        workspaceUrl
    );
}


/* ============================================================
   ATTACH CLICK EVENTS
============================================================ */

serviceButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const service =
                    button.getAttribute(
                        "data-service"
                    );

                if (!service) {
                    return;
                }

                openWorkspace(
                    service,
                    button
                );
            }
        );
    }
);

</script>

</body>
</html>
