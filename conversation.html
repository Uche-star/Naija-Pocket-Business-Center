<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
        }

        /*
        =====================================================
        TOP AREA
        REMAINS DARK / UNCHANGED
        =====================================================
        */

        .instruction {
            width: 100%;
            background: #171717;
            color: white;
            padding: 9px 8px;
            margin-bottom: 8px;
            text-align: center;
            font-size: 11px;
            line-height: 1.3;
        }

        /*
        =====================================================
        SERVICE AREA
        =====================================================
        */

        .services {
            width: 100%;
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 5px;
            align-content: start;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 12px;
        }

        .service-button {
            width: 100%;
            min-width: 0;
            height: 36px;
            padding: 3px 2px;

            /*
            GREY BUTTONS
            WHITE LETTERS
            */

            background: #3A3A3A;
            color: white;

            border: 1px solid #555555;
            border-radius: 2px;

            font-family: Arial, sans-serif;
            font-size: 8.5px;
            font-weight: bold;
            line-height: 1.1;

            overflow-wrap: break-word;
            word-break: normal;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .service-button:hover {
            background: #464646;
        }

        .service-button:active {
            background: #555555;
            transform: scale(0.98);
        }

        /*
        =====================================================
        BUTTON WORKING STATE
        =====================================================
        */

        .service-button.working {
            background: #1E90FF;
            color: white;
            border-color: #1E90FF;
        }

        .service-button:disabled {
            cursor: wait;
        }

        /*
        =====================================================
        BLUE AREA AFTER THE SERVICES
        =====================================================
        */

        .bottom-blue {
            width: 100%;
            flex: 1;
            min-height: 180px;
            background: #1E90FF;
            margin-left: -12px;
            margin-right: -12px;
            width: calc(100% + 24px);
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 18px;
        }

        .bottom-message {
            max-width: 600px;
            color: white;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            font-weight: bold;
        }

        /*
        =====================================================
        SLIGHTLY LARGER PHONES
        =====================================================
        */

        @media (min-width: 481px) {

            .page {
                padding: 12px 20px 0;
            }

            .instruction {
                font-size: 12px;
                padding: 10px;
            }

            .services {
                gap: 6px;
            }

            .service-button {
                height: 40px;
                font-size: 9px;
            }

            .bottom-blue {
                margin-left: -20px;
                margin-right: -20px;
                width: calc(100% + 40px);
            }
        }

        /*
        =====================================================
        VERY SMALL PHONES
        =====================================================
        */

        @media (max-width: 360px) {

            .page {
                padding: 8px 8px 0;
            }

            .instruction {
                font-size: 10px;
                padding: 8px 5px;
            }

            .services {
                gap: 4px;
            }

            .service-button {
                height: 34px;
                padding: 2px;
                font-size: 7.5px;
            }

            .bottom-blue {
                margin-left: -8px;
                margin-right: -8px;
                width: calc(100% + 16px);
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- =================================================
         INSTRUCTION
    ================================================== -->

    <div class="instruction">
        There are 28 services available.
        Please scroll through the list,
        find the service you need,
        and tap on it.
        Your request will be attended to immediately.
    </div>


    <!-- =================================================
         28 ADA SERVICE / ACTION BUTTONS
    ================================================== -->

    <div class="services">

        <button class="service-button" data-service="Document Typing">
            Document Typing
        </button>

        <button class="service-button" data-service="Document Formatting">
            Document Formatting
        </button>

        <button class="service-button" data-service="Document Editing">
            Document Editing
        </button>

        <button class="service-button" data-service="Grammar Correction">
            Grammar Correction
        </button>

        <button class="service-button" data-service="Assignments">
            Assignments
        </button>

        <button class="service-button" data-service="Projects">
            Projects
        </button>

        <button class="service-button" data-service="Research Assistance">
            Research Assistance
        </button>

        <button class="service-button" data-service="Seminar Papers">
            Seminar Papers
        </button>

        <button class="service-button" data-service="CVs & Résumés">
            CVs &amp; Résumés
        </button>

        <button class="service-button" data-service="Cover Letters">
            Cover Letters
        </button>

        <button class="service-button" data-service="Business Proposals">
            Business Proposals
        </button>

        <button class="service-button" data-service="Company Profiles">
            Company Profiles
        </button>

        <button class="service-button" data-service="Business Letters & Letterhead">
            Business Letters &amp; Letterhead
        </button>

        <button class="service-button" data-service="Invoices">
            Invoices
        </button>

        <button class="service-button" data-service="Quotations">
            Quotations
        </button>

        <button class="service-button" data-service="Meeting Minutes">
            Meeting Minutes
        </button>

        <button class="service-button" data-service="AI Writing Assistance">
            AI Writing Assistance
        </button>

        <button class="service-button" data-service="Document Rewriting">
            Document Rewriting
        </button>

        <button class="service-button" data-service="Translation">
            Translation
        </button>

        <button class="service-button" data-service="Document Summarization">
            Document Summarization
        </button>

        <button class="service-button" data-service="PDF Conversion">
            PDF Conversion
        </button>

        <button class="service-button" data-service="Voice To Text">
            Voice To Text
        </button>

        <button class="service-button" data-service="Topic Explanations">
            Topic Explanations
        </button>

        <button class="service-button" data-service="Printing Preparation">
            Printing Preparation
        </button>

        <button class="service-button" data-service="Excel Spreadsheets">
            Excel Spreadsheets
        </button>

        <button class="service-button" data-service="Data Entry">
            Data Entry
        </button>

        <button class="service-button" data-service="Data Analysis">
            Data Analysis
        </button>

        <button class="service-button" data-service="Presentations">
            Presentations
        </button>

    </div>


    <!-- =================================================
         BLUE AREA AFTER THE LAST BUTTON
    ================================================== -->

    <div class="bottom-blue">

        <div
            id="bottomMessage"
            class="bottom-message"
        >
            Tap the service you need.
            Ada and her intelligence will begin working
            on your request immediately.
        </div>

    </div>

</div>


<script>

/*
============================================================
ADA SERVICE TRIGGER
============================================================

IMPORTANT:

A service button is NOT merely a navigation button.

Each button is an ACTION BUTTON for Ada.

When pressed:

    SERVICE BUTTON
          ↓
       /api/chat
          ↓
     AdaController
          ↓
    AdaAIEngine V8
          ↓
         Groq
          ↓
    Ada starts working

The selected service is sent separately as
the authoritative service context.
============================================================
*/


const serviceButtons =
    document.querySelectorAll(
        ".service-button"
    );


let requestInProgress = false;


/*
============================================================
CALL ADA IMMEDIATELY
============================================================
*/

async function callAdaForService(
    service,
    button
) {

    if (
        requestInProgress
    ) {
        return;
    }

    requestInProgress = true;


    /*
    --------------------------------------------------------
    MARK THE PRESSED BUTTON
    --------------------------------------------------------
    */

    button.classList.add(
        "working"
    );

    serviceButtons.forEach(
        function(otherButton) {

            if (
                otherButton !== button
            ) {
                otherButton.disabled = true;
            }

        }
    );


    /*
    --------------------------------------------------------
    SAVE SERVICE
    --------------------------------------------------------
    */

    localStorage.setItem(
        "selectedService",
        service
    );


    document.getElementById(
        "bottomMessage"
    ).innerText =
        "Ada is starting work on " +
        service +
        "...";


    /*
    --------------------------------------------------------
    SEND DIRECTLY TO ADA
    --------------------------------------------------------

    The service is NOT hidden inside the message.

    It is sent as the separate "service" field.

    This is important because AdaController receives:

        message
        service

    and passes the service directly to
    AdaAIEngine V8.
    --------------------------------------------------------
    */

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            service:
                                service,

                            message:
                                "I have selected this service. Please begin working on my request and guide me on what you need from me."

                        })
                }
            );


        let result = null;


        try {

            result =
                await response.json();

        } catch (
            jsonError
        ) {

            result = {
                success: false,
                error:
                    "Ada returned an invalid response."
            };

        }


        /*
        ----------------------------------------------------
        ADA HAS STARTED
        ----------------------------------------------------
        */

        if (
            response.ok &&
            result &&
            result.success
        ) {

            /*
            Save Ada's first response so
            workspace.html can display it.
            */

            localStorage.setItem(
                "adaInitialResponse",
                result.response || ""
            );

            localStorage.setItem(
                "selectedService",
                service
            );


            /*
            ------------------------------------------------
            OPEN THE WORKSPACE
            ------------------------------------------------

            The important difference is that Ada has
            already been called BEFORE this navigation.

            The workspace is now the place where the
            customer continues the conversation.
            ------------------------------------------------
            */

            window.location.href =
                "workspace.html?service=" +
                encodeURIComponent(
                    service
                );

            return;

        }


        /*
        ----------------------------------------------------
        ADA ERROR
        ----------------------------------------------------
        */

        throw new Error(
            (
                result &&
                result.error
            ) ||
            "Ada could not start the request."
        );


    } catch (
        error
    ) {

        console.error(
            "ADA SERVICE START ERROR:",
            error
        );


        document.getElementById(
            "bottomMessage"
        ).innerText =
            "Ada could not start this request right now. Please try again.";


        /*
        Restore buttons.
        */

        serviceButtons.forEach(
            function(otherButton) {

                otherButton.disabled =
                    false;

            }
        );


        button.classList.remove(
            "working"
        );


        requestInProgress =
            false;
    }
}


/*
============================================================
BUTTON EVENTS
============================================================
*/

serviceButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const service =
                    button.dataset.service;


                if (
                    !service
                ) {
                    return;
                }


                callAdaForService(
                    service,
                    button
                );

            }
        );

    }
);

</script>

</body>
</html>
