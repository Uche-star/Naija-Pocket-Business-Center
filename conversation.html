<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 10px 12px 12px;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           TOP AREA
        ===================================================== */

        .instruction {
            width: 100%;
            background: #171717;
            color: white;
            padding: 9px 8px;
            margin-bottom: 8px;
            text-align: center;
            font-size: 11px;
            line-height: 1.3;
        }

        /* =====================================================
           SERVICE AREA
        ===================================================== */

        .services {
            width: 100%;
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 5px;
            align-content: start;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 12px;
        }

        .service-button {
            width: 100%;
            min-width: 0;
            height: 36px;
            padding: 3px 2px;

            background: #3A3A3A;
            color: white;

            border: 1px solid #555555;
            border-radius: 2px;

            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            line-height: 1.1;

            overflow-wrap: break-word;
            word-break: normal;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .service-button:hover {
            background: #464646;
        }

        .service-button:active {
            background: #555555;
            transform: scale(0.98);
        }

        /* =====================================================
           BUTTON WORKING STATE
        ===================================================== */

        .service-button.working {
            background: #CC0000;
            color: white;
            border-color: #CC0000;
        }

        .service-button:disabled {
            cursor: wait;
        }

        /* =====================================================
           RED AREA AFTER SERVICES
        ===================================================== */

        .bottom-red {
            width: calc(100% + 24px);

            flex: 1;
            min-height: 180px;

            background: #CC0000;

            margin-left: -12px;
            margin-right: -12px;
            margin-top: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 18px;
        }

        .bottom-message {
            max-width: 600px;

            color: white;
            text-align: center;

            font-size: 13px;
            line-height: 1.5;
            font-weight: bold;
        }

        /* =====================================================
           SLIGHTLY LARGER PHONES
        ===================================================== */

        @media (min-width: 481px) {

            .page {
                padding: 12px 20px 0;
            }

            .instruction {
                font-size: 12px;
                padding: 10px;
            }

            .services {
                gap: 6px;
            }

            .service-button {
                height: 40px;
                font-size: 10px;
            }

            .bottom-red {
                margin-left: -20px;
                margin-right: -20px;
                width: calc(100% + 40px);
            }
        }

        /* =====================================================
           VERY SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding: 8px 8px 0;
            }

            .instruction {
                font-size: 10px;
                padding: 8px 5px;
            }

            .services {
                gap: 4px;
            }

            .service-button {
                height: 34px;
                padding: 2px;
                font-size: 9px;
            }

            .bottom-red {
                margin-left: -8px;
                margin-right: -8px;
                width: calc(100% + 16px);
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- =================================================
         INSTRUCTION
    ================================================== -->

    <div class="instruction">
        There are 28 services available.
        Please scroll through the list,
        find the service you need,
        and tap on it.
        Your request will be attended to immediately.
    </div>


    <!-- =================================================
         28 ADA SERVICE BUTTONS
    ================================================== -->

    <div class="services">

        <button
            type="button"
            class="service-button"
            data-service="Document Typing"
        >
            Document Typing
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Document Formatting"
        >
            Document Formatting
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Document Editing"
        >
            Document Editing
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Grammar Correction"
        >
            Grammar Correction
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Assignments"
        >
            Assignments
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Projects"
        >
            Projects
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Research Assistance"
        >
            Research Assistance
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Seminar Papers"
        >
            Seminar Papers
        </button>

        <button
            type="button"
            class="service-button"
            data-service="CVs & Résumés"
        >
            CVs &amp; Résumés
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Cover Letters"
        >
            Cover Letters
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Business Proposals"
        >
            Business Proposals
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Company Profiles"
        >
            Company Profiles
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Business Letters & Letterhead"
        >
            Business Letters &amp; Letterhead
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Invoices"
        >
            Invoices
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Quotations"
        >
            Quotations
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Meeting Minutes"
        >
            Meeting Minutes
        </button>

        <button
            type="button"
            class="service-button"
            data-service="AI Writing Assistance"
        >
            AI Writing Assistance
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Document Rewriting"
        >
            Document Rewriting
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Translation"
        >
            Translation
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Document Summarization"
        >
            Document Summarization
        </button>

        <button
            type="button"
            class="service-button"
            data-service="PDF Conversion"
        >
            PDF Conversion
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Voice To Text"
        >
            Voice To Text
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Topic Explanations"
        >
            Topic Explanations
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Printing Preparation"
        >
            Printing Preparation
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Excel Spreadsheets"
        >
            Excel Spreadsheets
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Data Entry"
        >
            Data Entry
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Data Analysis"
        >
            Data Analysis
        </button>

        <button
            type="button"
            class="service-button"
            data-service="Presentations"
        >
            Presentations
        </button>

    </div>


    <!-- =================================================
         RED AREA AFTER LAST BUTTON
    ================================================== -->

    <div class="bottom-red">

        <div
            id="bottomMessage"
            class="bottom-message"
        >
            Tap the service you need.
            Ada and her intelligence will begin working
            on your request immediately.
        </div>

    </div>

</div>


<script>

/* ============================================================
   ADA SERVICE SELECTION

   SERVICE BUTTON
        ↓
   SAVE SERVICE
        ↓
   OPEN WORKSPACE
        ↓
   workspace.html?service=...
        ↓
   WORKSPACE ACTIVATES ADA INTELLIGENCE

   THIS PAGE DOES NOT ASK THE CUSTOMER TO TYPE.
============================================================ */

const serviceButtons =
    document.querySelectorAll(
        ".service-button"
    );

let requestInProgress = false;


/* ============================================================
   OPEN CUSTOMER WORKSPACE
============================================================ */

function openWorkspace(
    service,
    button
) {

    if (requestInProgress) {
        return;
    }

    requestInProgress = true;


    /* --------------------------------------------------------
       MARK SELECTED BUTTON
    -------------------------------------------------------- */

    button.classList.add(
        "working"
    );


    /* --------------------------------------------------------
       DISABLE OTHER BUTTONS
    -------------------------------------------------------- */

    serviceButtons.forEach(
        function(otherButton) {

            if (
                otherButton !== button
            ) {

                otherButton.disabled =
                    true;
            }
        }
    );


    /* --------------------------------------------------------
       SAVE SELECTED SERVICE
    -------------------------------------------------------- */

    localStorage.setItem(
        "selectedService",
        service
    );


    /* --------------------------------------------------------
       UPDATE RED AREA
    -------------------------------------------------------- */

    document.getElementById(
        "bottomMessage"
    ).innerText =
        "Opening your workspace for " +
        service +
        "...";


    /* --------------------------------------------------------
       OPEN WORKSPACE

       The selected service is passed directly
       to workspace.html.
    -------------------------------------------------------- */

    window.location.href =
        "workspace.html?service=" +
        encodeURIComponent(
            service
        );
}


/* ============================================================
   BUTTON EVENTS
============================================================ */

serviceButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const service =
                    button.dataset.service;

                if (!service) {
                    return;
                }

                openWorkspace(
                    service,
                    button
                );
            }
        );

    }
);

</script>

</body>
</html>
