<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
    Review — Naija Pocket Business Center
</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#000;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

button,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#000;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    flex:0 0 auto;
    min-height:64px;
    padding:9px 12px;
    background:#050505;
    border-bottom:1px solid rgba(0,128,0,.45);
    z-index:30;
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    color:#008000;
    font-size:clamp(18px,4vw,24px);
    font-weight:900;
    line-height:1.15;
}

.review-title{
    margin-top:4px;
    color:#fff;
    font-size:13px;
    font-weight:800;
}

.service{
    max-width:45%;
    padding:6px 9px;
    background:#111;
    border:1px solid rgba(0,128,0,.5);
    border-radius:20px;
    color:#69c28e;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   DOCUMENT AREA
========================================================= */

.document-region{
    flex:1 1 0;
    min-height:0;
    padding:7px;
    overflow:hidden;
}

.document-shell{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#fff;
    border-radius:10px;
}

/*
    Fixed toolbar.
*/

.document-toolbar{
    flex:0 0 auto;
    min-height:35px;
    padding:0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:#e8e8e8;
    border-bottom:1px solid #ccc;
    color:#555;
    font-size:9px;
    font-weight:900;
}

/*
    ONLY THIS ELEMENT SCROLLS.

    Therefore:
      header stays visible
      review controls stay visible
      payment stays usable
      complete document can be read
*/

.document{
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;

    padding:24px 18px 60px;

    background:#fff;
    color:#111;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:14px;
    line-height:1.8;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;

    user-select:text;
    -webkit-user-select:text;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
}

.document:focus{
    outline:none;
}

.empty{
    padding:70px 15px;
    color:#777;
    text-align:center;
    font-family:Inter,Arial,sans-serif;
    font-size:13px;
    line-height:1.6;
}

/* =========================================================
   REVIEW PANEL
========================================================= */

.controls{
    flex:0 0 auto;
    max-height:42%;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#080808;
    border-top:1px solid rgba(0,128,0,.4);
}

.heading{
    margin:0 0 3px;
    color:#fff;
    font-size:13px;
    font-weight:900;
}

.help{
    margin:0 0 7px;
    color:#999;
    font-size:9px;
    line-height:1.45;
}

.correction{
    width:100%;
    min-height:60px;
    max-height:120px;
    padding:9px;
    resize:vertical;
    background:#181818;
    color:#fff;
    border:1px solid rgba(255,255,255,.14);
    border-radius:8px;
    outline:none;
    font-size:11px;
}

.correction:focus{
    border-color:rgba(0,128,0,.7);
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:6px;
}

.action{
    min-height:41px;
    border-radius:8px;
    font-size:10px;
    font-weight:900;
}

.correct{
    background:#242424;
    color:#fff;
    border:1px solid rgba(255,255,255,.13);
}

.approve{
    background:#008000;
    color:#fff;
    border:0;
}

/* =========================================================
   PAYMENT
========================================================= */

.payment{
    display:none;
    margin-top:7px;
    padding:10px;
    background:#121212;
    border:1px solid rgba(0,128,0,.45);
    border-radius:9px;
}

.payment.show{
    display:block;
}

.payment-title{
    color:#69c28e;
    font-size:12px;
    font-weight:900;
}

.payment-text{
    margin-top:4px;
    color:#ddd;
    font-size:10px;
    line-height:1.55;
    white-space:pre-wrap;
}

.payment-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:7px;
}

.payment-button{
    min-height:38px;
    border-radius:8px;
    font-size:10px;
    font-weight:900;
}

.report{
    border:0;
    background:#008000;
    color:#fff;
}

.check{
    border:1px solid rgba(255,255,255,.13);
    background:#242424;
    color:#fff;
}

/* =========================================================
   DOWNLOAD
========================================================= */

.download{
    width:100%;
    min-height:42px;
    margin-top:7px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    background:#242424;
    color:#777;
    font-size:10px;
    font-weight:900;
}

.download.ready{
    background:#008000;
    border-color:#008000;
    color:#fff;
}

.download:disabled{
    cursor:not-allowed;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    min-height:14px;
    margin-top:4px;
    color:#777;
    font-size:9px;
    text-align:center;
}

.status.error{
    color:#ff7777;
}

.status.success{
    color:#69c28e;
}

@media(max-height:700px){

    .header{
        min-height:55px;
    }

    .review-title{
        display:none;
    }

    .document{
        padding:16px 12px 45px;
        font-size:13px;
    }

    .controls{
        max-height:39%;
    }

    .action,
    .payment-button,
    .download{
        min-height:36px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="header-row">

        <div>

            <div class="brand">
                Naija Pocket Business Center
            </div>

            <div class="review-title">
                Review Your Work
            </div>

        </div>

        <div
            id="service"
            class="service"
        >
            Service
        </div>

    </div>

</header>

<main class="document-region">

    <section class="document-shell">

        <div class="document-toolbar">

            <span>
                YOUR COMPLETE DOCUMENT
            </span>

            <span>
                SCROLL TO READ ALL
            </span>

        </div>

        <article
            id="document"
            class="document"
            tabindex="0"
        >
            <div class="empty">
                Your completed work will appear here.
            </div>
        </article>

    </section>

</main>

<section class="controls">

    <h2 class="heading">
        Review Your Document
    </h2>

    <p class="help">
        Read the complete document above. If something needs to change, describe the correction below.
    </p>

    <textarea
        id="correction"
        class="correction"
        placeholder="Describe the correction you want..."
    ></textarea>

    <div class="actions">

        <button
            id="correctButton"
            class="action correct"
            type="button"
        >
            APPLY CORRECTION
        </button>

        <button
            id="approveButton"
            class="action approve"
            type="button"
        >
            APPROVE DOCUMENT
        </button>

    </div>

    <div
        id="payment"
        class="payment"
    >

        <div class="payment-title">
            PAYMENT
        </div>

        <div
            id="paymentText"
            class="payment-text"
        ></div>

        <div class="payment-actions">

            <button
                id="reportButton"
                class="payment-button report"
                type="button"
            >
                I HAVE MADE PAYMENT
            </button>

            <button
                id="checkButton"
                class="payment-button check"
                type="button"
            >
                CHECK PAYMENT
            </button>

        </div>

    </div>

    <button
        id="downloadButton"
        class="download"
        type="button"
        disabled
    >
        🔒 DOWNLOAD DOCUMENT
    </button>

    <div
        id="status"
        class="status"
    ></div>

</section>

</div>

<script>
"use strict";

/*
============================================================
REVIEW PAGE
============================================================

This page is responsible for:

    COMPLETE DOCUMENT
          ↓
       REVIEW
          ↓
     CORRECTION
          ↓
       APPROVE
          ↓
       PAYMENT
          ↓
      DOWNLOAD

It does NOT contain:
- Groq
- prompts
- keyword matching
- AI reasoning
- duplicated intelligence

Only correction requests go back to /api/chat.
The complete document is NEVER resent merely for display.
============================================================
*/

const params =
    new URLSearchParams(
        location.search
    );

const service =
    (
        params.get("service") ||
        "Business Center Service"
    ).trim();

const customerId =
    params.get("customer_id") ||
    localStorage.getItem(
        "npbc_customer_id"
    ) ||
    "";

let jobId =
    params.get("job_id") ||
    localStorage.getItem(
        "npbc_job_id"
    ) ||
    "";

const clientRequestId =
    params.get("client_request_id") ||
    localStorage.getItem(
        "npbc_client_request_id"
    ) ||
    "";

const serviceElement =
    document.getElementById(
        "service"
    );

const documentElement =
    document.getElementById(
        "document"
    );

const correction =
    document.getElementById(
        "correction"
    );

const correctButton =
    document.getElementById(
        "correctButton"
    );

const approveButton =
    document.getElementById(
        "approveButton"
    );

const payment =
    document.getElementById(
        "payment"
    );

const paymentText =
    document.getElementById(
        "paymentText"
    );

const reportButton =
    document.getElementById(
        "reportButton"
    );

const checkButton =
    document.getElementById(
        "checkButton"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const status =
    document.getElementById(
        "status"
    );

let currentWork =
    "";

let approved =
    false;

let busy =
    false;

let paymentConfirmed =
    false;

/*
============================================================
DISPLAY
============================================================
*/

serviceElement.textContent =
    service;

function setStatus(
    text,
    type=""
){

    status.textContent =
        text || "";

    status.className =
        "status " +
        type;
}

function setBusy(
    value
){

    busy =
        value;

    correctButton.disabled =
        value;

    approveButton.disabled =
        value;

    reportButton.disabled =
        value;

    checkButton.disabled =
        value;

    if(
        !paymentConfirmed
    ){

        downloadButton.disabled =
            true;
    }
}

/*
============================================================
DOCUMENT STORAGE
============================================================
*/

function storageKey(){

    return (
        "npbc_review_" +
        (
            jobId ||
            clientRequestId
        )
    );
}

function readDocument(){

    let packet =
        null;

    try{

        const raw =
            localStorage.getItem(
                storageKey()
            );

        if(raw){

            packet =
                JSON.parse(
                    raw
                );
        }

    }catch(error){

        packet =
            null;
    }

    if(!packet){

        try{

            const fallback =
                sessionStorage.getItem(
                    "npbc_review_fallback"
                );

            if(fallback){

                packet =
                    JSON.parse(
                        fallback
                    );
            }

        }catch(error){

            packet =
                null;
        }
    }

    return packet;
}

function saveDocument(
    work
){

    currentWork =
        String(
            work || ""
        );

    const packet = {

        service,

        customer_id:
            customerId,

        job_id:
            jobId,

        client_request_id:
            clientRequestId,

        work:
            currentWork,

        saved_at:
            Date.now()
    };

    try{

        localStorage.setItem(
            storageKey(),
            JSON.stringify(
                packet
            )
        );

    }catch(error){

        try{

            sessionStorage.setItem(
                "npbc_review_fallback",
                JSON.stringify(
                    packet
                )
            );

        }catch(storageError){}
    }
}

function showDocument(
    work
){

    currentWork =
        String(
            work || ""
        );

    if(!currentWork){

        documentElement.innerHTML =
            '<div class="empty">' +
            'No completed document was received.' +
            '</div>';

        return;
    }

    /*
        textContent is intentional.

        The generated document is displayed as document
        content, not interpreted as executable HTML.
    */

    documentElement.textContent =
        currentWork;

    documentElement.scrollTop =
        0;
}

/*
============================================================
EXISTING API
============================================================

Only the correction itself is sent.

The current complete document remains inside the existing
AdaResponse conversation/session on the backend.
============================================================
*/

async function sendCorrection(
    correctionText
){

    const payload = {

        message:
            correctionText,

        service,

        event:
            "review_correction",

        customer_id:
            customerId,

        job_id:
            jobId || null,

        client_request_id:
            clientRequestId,

        activate_intelligence:
            true,

        context:
            null
    };

    const response =
        await fetch(
            "/api/chat",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );

    if(!response.ok){

        throw new Error(
            data.error_message ||
            data.message ||
            data.error ||
            "The correction could not be processed."
        );
    }

    if(data.job_id){

        jobId =
            data.job_id;

        localStorage.setItem(
            "npbc_job_id",
            jobId
        );
    }

    return data;
}

/*
============================================================
CORRECTION
============================================================
*/

correctButton.addEventListener(
    "click",
    async () => {

        const request =
            correction.value.trim();

        if(
            !request ||
            busy
        ){

            if(!request){

                setStatus(
                    "Write the correction you want first.",
                    "error"
                );
            }

            return;
        }

        setBusy(true);

        setStatus(
            "Applying your correction..."
        );

        try{

            const data =
                await sendCorrection(
                    request
                );

            if(!data.reply){

                throw new Error(
                    "No revised document was returned."
                );
            }

            showDocument(
                data.reply
            );

            saveDocument(
                data.reply
            );

            correction.value =
                "";

            approved =
                false;

            paymentConfirmed =
                false;

            payment.classList.remove(
                "show"
            );

            downloadButton.disabled =
                true;

            downloadButton.classList.remove(
                "ready"
            );

            downloadButton.textContent =
                "🔒 DOWNLOAD DOCUMENT";

            setStatus(
                "Correction applied. Please review the updated document.",
                "success"
            );

        }catch(error){

            setStatus(
                error.message,
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);

/*
============================================================
APPROVAL
============================================================

Approval is sent through the same existing /api/chat route.
No new intelligence endpoint is invented.
============================================================
*/

approveButton.addEventListener(
    "click",
    async () => {

        if(
            busy ||
            !currentWork
        ){
            return;
        }

        setBusy(true);

        setStatus(
            "Recording your approval..."
        );

        try{

            /*
                Only the approval event is sent.
                The complete document is NOT sent again.
            */

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    "The customer has approved the completed document and wants to proceed to payment.",

                                service,

                                event:
                                    "review_approved",

                                customer_id:
                                    customerId,

                                job_id:
                                    jobId || null,

                                client_request_id:
                                    clientRequestId,

                                activate_intelligence:
                                    true,

                                context:
                                    null
                            })
                    }
                );

            const data =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );

            if(!response.ok){

                throw new Error(
                    data.error_message ||
                    data.message ||
                    data.error ||
                    "Approval could not be recorded."
                );
            }

            approved =
                true;

            payment.classList.add(
                "show"
            );

            /*
                If the existing application returns billing data,
                display it. Otherwise retain the service price
                already established in the workspace.
            */

            let amount =
                data.amount ||
                data.price ||
                "";

            if(amount){

                paymentText.textContent =
                    "Service: " +
                    service +
                    "\nAmount: ₦" +
                    Number(
                        amount
                    ).toLocaleString(
                        "en-NG"
                    );

            }else{

                paymentText.textContent =
                    "Your document has been approved.\n\n" +
                    "Proceed to payment to make the document available for delivery.";
            }

            setStatus(
                "Your document has been approved.",
                "success"
            );

        }catch(error){

            setStatus(
                error.message,
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);

/*
============================================================
PAYMENT
============================================================

The repository already contains a payment page/workflow.
The review page therefore does not create a second payment
system.

If the existing payment endpoint is available, use it.
Otherwise the customer is taken to the existing payment page.
============================================================
*/

reportButton.addEventListener(
    "click",
    () => {

        if(
            !approved ||
            busy
        ){
            return;
        }

        const query =
            new URLSearchParams({

                service,

                customer_id:
                    customerId,

                job_id:
                    jobId || "",

                order:
                    jobId || ""
            });

        location.href =
            "payment.html?" +
            query.toString();
    }
);

/*
============================================================
CHECK PAYMENT
============================================================
*/

checkButton.addEventListener(
    "click",
    async () => {

        if(
            busy ||
            !jobId
        ){

            if(!jobId){

                setStatus(
                    "Your job information is not available yet.",
                    "error"
                );
            }

            return;
        }

        setBusy(true);

        setStatus(
            "Checking payment..."
        );

        try{

            const query =
                new URLSearchParams({

                    job_id:
                        jobId
                });

            const response =
                await fetch(
                    "/api/payment/status?" +
                    query.toString(),
                    {
                        method:"GET",
                        headers:{
                            "Accept":
                                "application/json"
                        }
                    }
                );

            const data =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );

            if(
                response.ok &&
                data &&
                String(
                    data.status ||
                    ""
                ).toLowerCase() ===
                "paid"
            ){

                paymentConfirmed =
                    true;

                downloadButton.disabled =
                    false;

                downloadButton.classList.add(
                    "ready"
                );

                downloadButton.textContent =
                    "⬇ DOWNLOAD DOCUMENT";

                setStatus(
                    "Payment confirmed. Your document is ready for download.",
                    "success"
                );

            }else{

                setStatus(
                    "Payment is still pending."
                );
            }

        }catch(error){

            setStatus(
                "Payment status could not be checked yet.",
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);

/*
============================================================
DOWNLOAD
============================================================
*/

downloadButton.addEventListener(
    "click",
    () => {

        if(
            !paymentConfirmed ||
            !jobId
        ){
            return;
        }

        const query =
            new URLSearchParams({

                job_id:
                    jobId,

                customer_id:
                    customerId
            });

        location.href =
            "/api/download?" +
            query.toString();
    }
);

/*
============================================================
INITIALISE
============================================================
*/

const packet =
    readDocument();

if(packet){

    if(packet.job_id){

        jobId =
            packet.job_id;

        localStorage.setItem(
            "npbc_job_id",
            jobId
        );
    }

    showDocument(
        packet.work
    );

}else{

    setStatus(
        "The completed document could not be loaded. Please return to the workspace and submit the request again.",
        "error"
    );
}

</script>

</body>
</html>
