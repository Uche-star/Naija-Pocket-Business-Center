<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Review Your Complete Service — Naija Pocket Business Center</title>

<style>
:root{
  --black:#050505;
  --black2:#080808;
  --panel:#101010;
  --panel2:#151515;
  --panel3:#1b1b1b;
  --gold:#d4af37;
  --gold2:#f0cf62;
  --gold3:#a8861f;
  --white:#f7f7f7;
  --muted:#aaa;
  --green:#36c878;
  --red:#e05b5b;
  --line:rgba(212,175,55,.25);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

body{
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-rows:50% 50%;
  background:
    radial-gradient(circle at 50% 0%,rgba(212,175,55,.07),transparent 35%),
    var(--black);
}

/* =========================================================
   DOCUMENT AREA
   ========================================================= */

.document-zone{
  min-height:0;
  display:flex;
  flex-direction:column;
  border-bottom:1px solid var(--line);
  background:#070707;
}

.document-top{
  height:54px;
  min-height:54px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg,#111,#080808);
}

.document-brand{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.document-label{
  color:var(--gold2);
  font-size:11px;
  font-weight:700;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.document-title-top{
  max-width:65vw;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#eee;
  font-size:12px;
}

.page-count{
  flex-shrink:0;
  color:var(--gold);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
}

.document-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:12px;
  -webkit-overflow-scrolling:touch;
}

.document-page{
  width:min(900px,100%);
  min-height:100%;
  margin:0 auto;
  padding:28px 25px;
  background:#fff;
  color:#111;
  box-shadow:
    0 0 0 1px rgba(212,175,55,.25),
    0 12px 45px rgba(0,0,0,.45);
}

.document-page.empty{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  font-size:14px;
}

.page-content{
  width:100%;
  font-size:14px;
  line-height:1.7;
  overflow-wrap:anywhere;
  word-break:normal;
}

.page-content h1,
.page-content h2,
.page-content h3,
.page-content h4{
  color:#111;
  margin:0 0 15px;
  line-height:1.35;
}

.page-content p{
  margin:0 0 13px;
}

.page-content ul,
.page-content ol{
  margin:0 0 15px 24px;
}

.page-content li{
  margin-bottom:7px;
}

.page-content table{
  width:100%;
  border-collapse:collapse;
  margin:15px 0;
}

.page-content th,
.page-content td{
  border:1px solid #bbb;
  padding:7px;
  text-align:left;
}

.document-footer{
  height:44px;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border-top:1px solid rgba(255,255,255,.07);
  background:#090909;
}

.nav-button{
  height:32px;
  min-width:88px;
  padding:0 13px;
  border:1px solid var(--gold3);
  border-radius:5px;
  background:#0d0d0d;
  color:var(--gold2);
  font-size:11px;
  font-weight:700;
  letter-spacing:.7px;
}

.nav-button:active{
  transform:scale(.98);
}

.nav-button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.page-indicator{
  min-width:90px;
  text-align:center;
  color:#ddd;
  font-size:11px;
}

.go-wrap{
  display:flex;
  align-items:center;
  gap:5px;
}

.go-input{
  width:48px;
  height:32px;
  border:1px solid #444;
  border-radius:4px;
  background:#101010;
  color:#fff;
  text-align:center;
  outline:none;
}

.go-input:focus{
  border-color:var(--gold);
}

.go-button{
  height:32px;
  min-width:42px;
  border:1px solid var(--gold);
  border-radius:4px;
  background:var(--gold);
  color:#050505;
  font-size:10px;
  font-weight:800;
}

/* =========================================================
   REVIEW AREA
   ========================================================= */

.review-zone{
  min-height:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 80% 10%,rgba(212,175,55,.06),transparent 35%),
    var(--black);
}

.review-heading{
  padding:13px 15px 9px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.review-heading h1{
  margin:0;
  color:var(--gold2);
  font-size:18px;
  line-height:1.2;
  letter-spacing:.2px;
}

.review-heading p{
  margin:5px 0 0;
  color:#999;
  font-size:11px;
  line-height:1.4;
}

.review-body{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:10px 15px 14px;
  -webkit-overflow-scrolling:touch;
}

.service-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:9px;
}

.tag{
  max-width:100%;
  padding:6px 9px;
  border:1px solid rgba(212,175,55,.35);
  border-radius:4px;
  background:rgba(212,175,55,.06);
  color:var(--gold2);
  font-size:10px;
  font-weight:700;
  letter-spacing:.5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.review-box{
  border:1px solid rgba(212,175,55,.2);
  background:linear-gradient(180deg,#111,#0b0b0b);
  border-radius:7px;
  padding:10px;
  margin-bottom:9px;
}

.review-box-label{
  margin-bottom:5px;
  color:#999;
  font-size:9px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.review-document-title{
  color:#f5f5f5;
  font-size:14px;
  line-height:1.4;
  font-weight:700;
  overflow-wrap:anywhere;
}

.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#bbb;
  font-size:10px;
  font-weight:700;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#777;
}

.status.ready{
  color:var(--green);
}

.status.ready .status-dot{
  background:var(--green);
  box-shadow:0 0 8px rgba(54,200,120,.55);
}

.status.error{
  color:var(--red);
}

.status.error .status-dot{
  background:var(--red);
}

.amount{
  color:var(--gold2);
  font-size:15px;
  font-weight:800;
}

.progress{
  height:3px;
  width:100%;
  margin-bottom:9px;
  overflow:hidden;
  border-radius:10px;
  background:#1d1d1d;
}

.progress-bar{
  width:0%;
  height:100%;
  background:var(--gold);
  transition:width .25s ease;
}

.message{
  display:none;
  margin-bottom:9px;
  padding:9px 10px;
  border:1px solid rgba(212,175,55,.25);
  border-radius:5px;
  background:#101010;
  color:#ddd;
  font-size:11px;
  line-height:1.45;
}

.message.show{
  display:block;
}

.message.error{
  border-color:rgba(224,91,91,.4);
  color:#ffb1b1;
}

.message.success{
  border-color:rgba(54,200,120,.35);
  color:#a9f0c8;
}

.actions{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.make-payment{
  width:100%;
  min-height:44px;
  border:1px solid var(--gold);
  border-radius:5px;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  color:#050505;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
}

.make-payment:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.correction-box{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

.correction-input{
  width:100%;
  min-height:42px;
  resize:none;
  border:1px solid #333;
  border-radius:5px;
  background:#101010;
  color:#eee;
  padding:10px;
  outline:none;
  font-size:11px;
}

.correction-input:focus{
  border-color:var(--gold3);
}

.correction-button{
  min-width:118px;
  min-height:42px;
  border:1px solid #555;
  border-radius:5px;
  background:#171717;
  color:var(--gold2);
  font-size:10px;
  font-weight:800;
  letter-spacing:.6px;
}

.correction-button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:600px){

  #app{
    grid-template-rows:50% 50%;
  }

  .document-page{
    padding:20px 17px;
  }

  .page-content{
    font-size:13px;
    line-height:1.65;
  }

  .document-title-top{
    max-width:52vw;
  }

  .review-heading h1{
    font-size:16px;
  }

  .review-body{
    padding-left:11px;
    padding-right:11px;
  }

  .correction-box{
    grid-template-columns:1fr;
  }

  .correction-button{
    width:100%;
  }
}

@media(max-height:700px){

  .document-top{
    height:47px;
    min-height:47px;
  }

  .document-footer{
    height:39px;
    min-height:39px;
  }

  .review-heading{
    padding-top:8px;
    padding-bottom:7px;
  }

  .review-heading p{
    display:none;
  }

  .review-body{
    padding-top:7px;
  }

  .review-box{
    padding:8px;
    margin-bottom:7px;
  }

  .make-payment{
    min-height:40px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       DOCUMENT VIEWER
       ===================================================== -->

  <section class="document-zone">

    <div class="document-top">

      <div class="document-brand">
        <div class="document-label">Your Complete Document</div>
        <div class="document-title-top" id="documentTitleTop">
          Preparing document...
        </div>
      </div>

      <div class="page-count" id="pageCount">
        0 PAGES
      </div>

    </div>

    <div class="document-scroll" id="documentScroll">

      <div class="document-page empty" id="documentPage">
        <div id="emptyDocumentMessage">
          Preparing your completed document...
        </div>
      </div>

    </div>

    <div class="document-footer">

      <button
        class="nav-button"
        id="previousButton"
        type="button"
        disabled
      >
        PREVIOUS
      </button>

      <div class="page-indicator" id="pageIndicator">
        PAGE 0 OF 0
      </div>

        class="nav-button"
        id="nextButton"
        type="button"

      >
        NEXT
      </button>

      <div class="go-wrap">

        <input

          id="goInput"
          type="number"
          min="1"
          inputmode="numeric"

        <button
          class="go-button"
          id="goButton"
          type="button"
        >
          GO
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       REVIEW / ACTION AREA
       ===================================================== -->

  <section class="review-zone">

    <div class="review-heading">
      <h1>Review Your Complete Service</h1>
      <p>
        Carefully review the completed document before payment and delivery.
      </p>
    </div>

    <div class="review-body">

      <div class="service-row">

        <div class="tag" id="serviceTag">
          SERVICE
        </div>

        <div class="tag" id="titleTag">
          DOCUMENT
        </div>

      </div>

      <div class="review-box">

        <div class="review-box-label">
          Document Title
        </div>

        <div
          class="review-document-title"
          id="reviewDocumentTitle"
        >
          Preparing document...
        </div>

      </div>

      <div class="status-row">

        <div
          class="status"
          id="status"
        >
          <span class="status-dot"></span>
          <span id="statusText">PREPARING</span>
        </div>

          class="amount"
          id="amount"
        >
          ₦0
        </div>

      <div class="progress">

      <div

        id="message"
      ></div>

          class="make-payment"
          id="makePaymentButton"
          type="button"

        >
          MAKE PAYMENT
        </button>

        <div class="correction-box">

          <textarea
            class="correction-input"
            id="correctionInput"
            rows="2"
            placeholder="Tell us what you want corrected..."
          ></textarea>

          <button
            class="correction-button"
            id="correctionButton"
            type="button"
            disabled
          >
            APPLY CORRECTION
          </button>

        </div>

      </div>

    </div>

  </section>

</div>


<script>
(function(){

"use strict";

/* =========================================================
   CORE CONFIGURATION

   IMPORTANT:
   This Review page does NOT use job_id.

   DOCUMENT IDENTITY:
       service + document title

   The completed document itself is the source material.
   ========================================================= */

const REVIEW_API_BASE = "";
const PAYMENT_API_BASE = "https://naija-pocket-payment-api.onrender.com";

const params = new URLSearchParams(window.location.search);

const service =
  clean(
    params.get("service") ||
    params.get("service_name") ||
    "Business Center Service"
  );

const suppliedTitle =
  clean(
    params.get("document_title") ||
    params.get("title") ||
    ""
  );

const suppliedAmount =
  clean(
    params.get("amount") ||
    ""
  );


/* =========================================================
   STATE
   ========================================================= */

let pages = [];
let currentPage = 0;

let currentDocument = null;

let documentTitle = suppliedTitle;
let currentService = service;

let amountToPay = suppliedAmount;

let reviewReady = false;
let loading = false;
let correcting = false;
let paymentPreparing = false;

let pollTimer = null;


/* =========================================================
   DOM
   ========================================================= */

const documentPage =
  document.getElementById("documentPage");

const documentScroll =
  document.getElementById("documentScroll");

const emptyDocumentMessage =
  document.getElementById("emptyDocumentMessage");

const documentTitleTop =
  document.getElementById("documentTitleTop");

const pageCount =
  document.getElementById("pageCount");

const pageIndicator =
  document.getElementById("pageIndicator");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const goInput =
  document.getElementById("goInput");

const goButton =
  document.getElementById("goButton");

const serviceTag =
  document.getElementById("serviceTag");

const titleTag =
  document.getElementById("titleTag");

const reviewDocumentTitle =
  document.getElementById("reviewDocumentTitle");

const status =
  document.getElementById("status");

const statusText =
  document.getElementById("statusText");

const amount =
  document.getElementById("amount");

const progressBar =
  document.getElementById("progressBar");

const message =
  document.getElementById("message");

const makePaymentButton =
  document.getElementById("makePaymentButton");

const correctionInput =
  document.getElementById("correctionInput");

const correctionButton =
  document.getElementById("correctionButton");


/* =========================================================
   GENERAL HELPERS
   ========================================================= */

function clean(value){
  return String(value == null ? "" : value)
    .replace(/\u0000/g,"")
    .trim();
}


function escapeHtml(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatAmount(value){

  const n = Number(
    String(value || "")
      .replace(/[₦,\s]/g,"")
  );

  if(!Number.isFinite(n) || n <= 0){
    return "₦0";
  }

  return "₦" + n.toLocaleString("en-NG");
}


function showMessage(text,type){

  message.textContent = clean(text);

  message.className =
    "message show" +
    (type ? " " + type : "");
}


function hideMessage(){

  message.textContent = "";

  message.className = "message";
}


function setStatus(text,type){

  statusText.textContent =
    clean(text).toUpperCase();

  status.className =
    "status" +
    (type ? " " + type : "");
}


function setProgress(value){

  let n = Number(value);

  if(!Number.isFinite(n)){
    n = 0;
  }

  n = Math.max(0,Math.min(100,n));

  progressBar.style.width = n + "%";
}


/* =========================================================
   MARKDOWN / DOCUMENT CLEANING
   ========================================================= */

function cleanMarkdownText(value){

  let text = String(value == null ? "" : value);

  text = text
    .replace(/\r\n/g,"\n")
    .replace(/\r/g,"\n");

  text = text.replace(/```[\s\S]*?```/g,function(match){

    return match
      .replace(/^```[a-zA-Z0-9_-]*\s*/,"")
      .replace(/```\s*$/,"");
  });

  text = text
    .replace(/^#{1,6}\s+/gm,"")
    .replace(/^\s*[-*+]\s+/gm,"")
    .replace(/^\s*\d+\.\s+/gm,"")
    .replace(/\*\*(.*?)\*\*/g,"$1")
    .replace(/__(.*?)__/g,"$1")
    .replace(/\*(.*?)\*/g,"$1")
    .replace(/_(.*?)_/g,"$1")
    .replace(/`([^`]+)`/g,"$1")
    .replace(/^\s*>\s?/gm,"")
    .replace(/^\s*---+\s*$/gm,"")
    .replace(/^\s*\*\*\*\s*$/gm,"");

  return text.trim();
}


function sanitizeHtml(html){

  const template =
    document.createElement("template");

  template.innerHTML =
    String(html == null ? "" : html);

  const allowedTags = new Set([
    "P",
    "BR",
    "H1",
    "H2",
    "H3",
    "H4",
    "H5",
    "H6",
    "STRONG",
    "B",
    "EM",
    "I",
    "U",
    "UL",
    "OL",
    "LI",
    "TABLE",
    "THEAD",
    "TBODY",
    "TR",
    "TH",
    "TD"
  ]);

  const walker =
    document.createTreeWalker(
      template.content,
      NodeFilter.SHOW_ELEMENT
    );

  const nodes = [];

  while(walker.nextNode()){
    nodes.push(walker.currentNode);
  }

  nodes.forEach(function(node){

    if(!allowedTags.has(node.tagName)){

      const parent =
        node.parentNode;

      if(parent){

        while(node.firstChild){
          parent.insertBefore(
            node.firstChild,
            node
          );
        }

        parent.removeChild(node);
      }

      return;
    }

    Array.from(node.attributes)
      .forEach(function(attribute){

        node.removeAttribute(
          attribute.name
        );

      });

  });

  return template.innerHTML;
}


/* =========================================================
   TEXT TO DISPLAYABLE HTML
   ========================================================= */

function textToHtml(text){

  const cleaned =
    cleanMarkdownText(text);

  if(!cleaned){
    return "";
  }

  const paragraphs =
    cleaned
      .split(/\n{2,}/)
      .map(function(block){

        const lines =
          block
            .split("\n")
            .map(function(line){
              return line.trim();
            })
            .filter(Boolean);

        if(!lines.length){
          return "";
        }

        return "<p>" +
          lines
            .map(escapeHtml)
            .join("<br>") +
          "</p>";
      })
      .filter(Boolean);

  return paragraphs.join("");
}


/* =========================================================
   PAGE NORMALIZATION
   ========================================================= */

function normalizePages(value){

  if(value == null){
    return [];
  }

  if(Array.isArray(value)){

    return value
      .map(function(item){

        if(item == null){
          return "";
        }

        if(typeof item === "string"){
          return item;
        }

        if(typeof item === "object"){

          return (
            item.content ??
            item.text ??
            item.html ??
            item.body ??
            item.page ??
            item.document ??
            ""
          );
        }

        return String(item);
      })
      .map(function(item){

        const raw =
          String(item == null ? "" : item);

        const looksHtml =
          /<[a-z][\s\S]*>/i.test(raw);

        if(looksHtml){
          return sanitizeHtml(raw);
        }

        return textToHtml(raw);

      })
      .filter(function(item){
        return clean(item).length > 0;
      });
  }

  if(typeof value === "object"){

    if(Array.isArray(value.pages)){
      return normalizePages(value.pages);
    }

    if(Array.isArray(value.document_pages)){
      return normalizePages(value.document_pages);
    }

    if(Array.isArray(value.review_pages)){
      return normalizePages(value.review_pages);
    }

    if(value.content != null){
      return normalizePages([value.content]);
    }

    if(value.text != null){
      return normalizePages([value.text]);
    }

    if(value.html != null){
      return normalizePages([value.html]);
    }
  }

  const raw =
    String(value);

  if(!raw.trim()){
    return [];
  }

  return normalizePages([raw]);
}


/* =========================================================
   EXTRACT DOCUMENT PAGES FROM FLEXIBLE RESPONSE SHAPES
   ========================================================= */

function extractPages(data){

  if(!data || typeof data !== "object"){
    return [];
  }

  const candidates = [

    data.pages,

    data.review_pages,

    data.document_pages,

    data.documentPages,

    data.page_content,

    data.document_content,

    data.content,

    data.document,

    data.output,

    data.result,

    data.data

  ];

  for(const candidate of candidates){

    const found =
      normalizePages(candidate);

    if(found.length){
      return found;
    }
  }

  return [];
}


/* =========================================================
   DOCUMENT TITLE
   ========================================================= */

function extractDocumentTitle(data){

  if(data && typeof data === "object"){

    const candidates = [

      data.document_title,

      data.documentTitle,

      data.title,

      data.document_name,

      data.name,

      data.product_title,

      data.productTitle

    ];

    for(const candidate of candidates){

      const value =
        clean(candidate);

      if(value){
        return value;
      }
    }
  }

  if(documentTitle){
    return documentTitle;
  }

  const firstPage =
    cleanMarkdownText(
      pages[0] || ""
    );

  if(!firstPage){
    return "Completed Document";
  }

  const plain =
    firstPage
      .replace(/<[^>]+>/g," ")
      .replace(/\s+/g," ")
      .trim();

  const introductionIndex =
    plain.search(/\bIntroduction\b/i);

  if(introductionIndex > 0){

    const before =
      plain
        .slice(0,introductionIndex)
        .trim();

    if(
      before.length >= 3 &&
      before.length <= 250
    ){
      return before;
    }
  }

  return plain.length > 120
    ? plain.slice(0,120).trim()
    : plain;
}


/* =========================================================
   SERVICE + TITLE IDENTITY
   ========================================================= */

function getProductIdentity(){

  return {
    service:
      clean(currentService),

    document_title:
      clean(documentTitle),

    title:
      clean(documentTitle)
  };
}


/* =========================================================
   RESPONSE UNWRAPPING
   ========================================================= */

function unwrapResponse(raw){

  if(!raw || typeof raw !== "object"){
    return {};
  }

  const candidates = [

    raw,

    raw.data,

    raw.review,

    raw.document,

    raw.result,

    raw.output,

    raw.job

  ];

  for(const item of candidates){

    if(!item || typeof item !== "object"){
      continue;
    }

    const hasDocument =
      extractPages(item).length > 0;

    const hasIdentity =
      clean(
        item.document_title ||
        item.title ||
        item.service
      ).length > 0;

    const hasStatus =
      clean(item.status).length > 0 ||
      item.review_finished != null ||
      item.review_ready != null;

    if(
      hasDocument ||
      hasIdentity ||
      hasStatus
    ){
      return item;
    }
  }

  return raw;
}


/* =========================================================
   REVIEW READINESS
   ========================================================= */

function isReviewReady(data){

  if(!data || typeof data !== "object"){
    return false;
  }

  if(
    data.review_finished === true ||
    data.reviewFinished === true ||
    data.review_ready === true ||
    data.reviewReady === true ||
    data.complete === true ||
    data.completed === true
  ){
    return true;
  }

  const state =
    clean(
      data.status ||
      data.state ||
      data.review_status
    )
      .toLowerCase()
      .replace(/[\s-]+/g,"_");

  return [
    "ready",
    "review_ready",
    "review_complete",
    "review_completed",
    "completed",
    "complete",
    "finished",
    "done"
  ].includes(state);
}


/* =========================================================
   APPLY DOCUMENT DATA
   ========================================================= */

function applyDocument(data){

  const d =
    unwrapResponse(data);

  currentDocument =
    d;

  const foundPages =
    extractPages(d);

  if(foundPages.length){
    pages =
      foundPages;
  }

  const foundService =
    clean(
      d.service ||
      d.service_name ||
      d.serviceName ||
      currentService
    );

  if(foundService){
    currentService =
      foundService;
  }

  const foundTitle =
    extractDocumentTitle(d);

  if(foundTitle){
    documentTitle =
      foundTitle;
  }

  const foundAmount =
    d.amount ??
    d.total_amount ??
    d.price ??
    d.total ??
    amountToPay;

  if(
    foundAmount !== undefined &&
    foundAmount !== null &&
    clean(foundAmount)
  ){
    amountToPay =
      clean(foundAmount);
  }

  reviewReady =
    isReviewReady(d) ||
    pages.length > 0;

  updateIdentityUI();

  if(pages.length){

    if(currentPage >= pages.length){
      currentPage =
        pages.length - 1;
    }

    if(currentPage < 0){
      currentPage = 0;
    }

    renderPage();

  }else{

    showEmptyDocument(
      "Your completed document is being prepared..."
    );

  }

  updateStatusUI();

  saveReviewLocally(d);
}


/* =========================================================
   UI IDENTITY
   ========================================================= */

function updateIdentityUI(){

  serviceTag.textContent =
    currentService || "SERVICE";

  titleTag.textContent =
    documentTitle || "DOCUMENT";

  reviewDocumentTitle.textContent =
    documentTitle ||
    "Completed Document";

  documentTitleTop.textContent =
    documentTitle ||
    "Completed Document";

  amount.textContent =
    formatAmount(amountToPay);
}


/* =========================================================
   STATUS UI
   ========================================================= */

function updateStatusUI(){

  const ready =
    reviewReady &&
    pages.length > 0;

  if(ready){

    setStatus("READY","ready");

    setProgress(100);

    makePaymentButton.disabled =
      false;

    correctionButton.disabled =
      false;

  }else{

    setStatus(
      loading ? "PREPARING" : "WAITING"
    );

    setProgress(
      pages.length ? 75 : 20
    );

    makePaymentButton.disabled =
      true;

    correctionButton.disabled =
      true;
  }
}


/* =========================================================
   DOCUMENT PAGE RENDER
   ========================================================= */

function renderPage(){

  const total =
    pages.length;

  pageCount.textContent =
    total === 1
      ? "1 PAGE"
      : total + " PAGES";

  if(!total){

    showEmptyDocument(
      "No completed document is available yet."
    );

    updateNavigation();

    return;
  }

  const html =
    pages[currentPage] || "";

  documentPage.classList.remove("empty");

  documentPage.innerHTML =
    '<div class="page-content">' +
      html +
    '</div>';

  pageIndicator.textContent =
    "PAGE " +
    (currentPage + 1) +
    " OF " +
    total;

  updateNavigation();

  documentScroll.scrollTop = 0;
}


function showEmptyDocument(text){

  documentPage.classList.add("empty");

  documentPage.innerHTML =
    '<div id="emptyDocumentMessage">' +
      escapeHtml(text) +
    '</div>';

  pageCount.textContent =
    pages.length
      ? pages.length + " PAGES"
      : "0 PAGES";

  pageIndicator.textContent =
    pages.length
      ? "PAGE " + (currentPage + 1) +
        " OF " + pages.length
      : "PAGE 0 OF 0";

  updateNavigation();
}


function updateNavigation(){

  const total =
    pages.length;

  previousButton.disabled =
    total === 0 ||
    currentPage <= 0;

  nextButton.disabled =
    total === 0 ||
    currentPage >= total - 1;
}


/* =========================================================
   PAGE NAVIGATION
   ========================================================= */

function goToPage(index){

  if(!pages.length){
    return;
  }

  const n =
    Number(index);

  if(!Number.isFinite(n)){
    return;
  }

  currentPage =
    Math.max(
      0,
      Math.min(
        pages.length - 1,
        Math.floor(n)
      )
    );

  renderPage();
}


previousButton.addEventListener(
  "click",
  function(){
    goToPage(currentPage - 1);
  }
);


nextButton.addEventListener(
  "click",
  function(){
    goToPage(currentPage + 1);
  }
);


goButton.addEventListener(
  "click",
  function(){

    const requested =
      Number(goInput.value);

    if(!Number.isFinite(requested)){
      return;
    }

    goToPage(requested - 1);

    goInput.value = "";
  }
);


goInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      event.preventDefault();
      goButton.click();
    }

  }
);


/* =========================================================
   LOCAL REVIEW STORAGE
   ========================================================= */

const LOCAL_REVIEW_KEYS = [

  "npbc_review_data",
  "npbc_current_review",
  "npbc_review",
  "review_data",
  "review_document",
  "npbc_last_review_data"

];


function saveReviewLocally(data){

  if(!data || typeof data !== "object"){
    return;
  }

  try{

    const payload =
      JSON.stringify(data);

    sessionStorage.setItem(
      "npbc_last_review_data",
      payload
    );

  }catch(error){
    /* Local storage is only a fallback. */
  }
}


function readStoredReview(){

  const stores = [

    window.sessionStorage,
    window.localStorage

  ];

  for(const store of stores){

    for(const key of LOCAL_REVIEW_KEYS){

      try{

        const raw =
          store.getItem(key);

        if(!raw){
          continue;
        }

        const parsed =
          JSON.parse(raw);

        if(
          parsed &&
          typeof parsed === "object"
        ){

          const d =
            unwrapResponse(parsed);

          if(
            extractPages(d).length ||
            clean(
              d.document_title ||
              d.title
            )
          ){
            return d;
          }
        }

      }catch(error){
        /* Ignore invalid stored entries. */
      }

    }

  }

  return null;
}


/* =========================================================
   OPTIONAL DIRECT REVIEW DATA
   ========================================================= */

function readUrlReviewData(){

  const candidates = [

    params.get("review_data"),
    params.get("document_data"),
    params.get("data")

  ];

  for(const raw of candidates){

    if(!raw){
      continue;
    }

    try{

      const parsed =
        JSON.parse(
          decodeURIComponent(raw)
        );

      if(
        parsed &&
        typeof parsed === "object"
      ){
        return parsed;
      }

    }catch(error){

      try{

        const parsed =
          JSON.parse(raw);

        if(
          parsed &&
          typeof parsed === "object"
        ){
          return parsed;
        }

      }catch(ignore){}

    }

  }

  return null;
}


/* =========================================================
   API HELPERS
   ========================================================= */

async function apiGet(path){

  const url =
    REVIEW_API_BASE + path;

  const response =
    await fetch(
      url,
      {
        method:"GET",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Accept":"application/json"
        }
      }
    );

  const text =
    await response.text();

  let data = null;

  try{
    data =
      text
        ? JSON.parse(text)
        : {};
  }catch(error){

    throw new Error(
      "The Review service returned an invalid response."
    );

  }

  if(!response.ok){

    throw new Error(
      clean(
        data.message ||
        data.error ||
        data.detail ||
        "The Review service could not provide the document."
      )
    );

  }

  return data;
}


async function apiPost(path,payload){

  const url =
    REVIEW_API_BASE + path;

  const response =
    await fetch(
      url,
      {
        method:"POST",
        credentials:"include",
        cache:"no-store",
        headers:{
          "Content-Type":"application/json",
          "Accept":"application/json"
        },
        body:JSON.stringify(payload)
      }
    );

  const text =
    await response.text();

  let data = {};

  try{
    data =
      text
        ? JSON.parse(text)
        : {};
  }catch(error){

    throw new Error(
      "The Review service returned an invalid response."
    );

  }

  if(!response.ok){

    throw new Error(
      clean(
        data.message ||
        data.error ||
        data.detail ||
        "The correction could not be applied."
      )
    );

  }

  return data;
}


async function paymentPost(path,payload){

  const response =
    await fetch(
      PAYMENT_API_BASE + path,
      {
        method:"POST",
        credentials:"omit",
        cache:"no-store",
        headers:{
          "Content-Type":"application/json",
          "Accept":"application/json"
        },
        body:JSON.stringify(payload)
      }
    );

  const text =
    await response.text();

  let data = {};

  try{
    data =
      text
        ? JSON.parse(text)
        : {};
  }catch(error){

    throw new Error(
      "The payment service returned an invalid response."
    );

  }

  if(!response.ok){

    throw new Error(
      clean(
        data.message ||
        data.error ||
        data.detail ||
        "The payment service could not prepare payment."
      )
    );

  }

  return data;
}


/* =========================================================
   LOAD REVIEW DATA
   ========================================================= */

async function loadReview(){

  if(loading){
    return;
  }

  loading = true;

  updateStatusUI();

  hideMessage();

  try{

    /*
      PRIMARY SOURCE

      The Review page now asks the existing Review API for
      the completed document using SERVICE + DOCUMENT TITLE.

      No job_id is used.
    */

    if(
      currentService &&
      documentTitle
    ){

      const query =
        "?service=" +
        encodeURIComponent(currentService) +
        "&document_title=" +
        encodeURIComponent(documentTitle);

      const data =
        await apiGet(
          "/api/review" + query
        );

      const unwrapped =
        unwrapResponse(data);

      applyDocument(unwrapped);

      if(
        pages.length &&
        reviewReady
      ){

        loading = false;
        updateStatusUI();
        stopPolling();
        return;
      }
    }

    /*
      SECOND SOURCE

      Direct review data passed into the page.
    */

    const urlData =
      readUrlReviewData();

    if(urlData){

      applyDocument(urlData);

      if(
        pages.length &&
        reviewReady
      ){

        loading = false;
        updateStatusUI();
        stopPolling();
        return;
      }
    }

    /*
      THIRD SOURCE

      Existing session/local review state.
    */

    const stored =
      readStoredReview();

    if(stored){

      applyDocument(stored);

      if(
        pages.length &&
        reviewReady
      ){

        loading = false;
        updateStatusUI();
        stopPolling();
        return;
      }
    }

    if(!pages.length){

      setStatus("WAITING");

      showMessage(
        "Your completed document is not available yet. Please wait while it is prepared.",
        ""
      );

    }

  }catch(error){

    /*
      If the API cannot be reached, do not destroy an already
      available document. Try the locally available document.
    */

    const stored =
      readStoredReview();

    if(stored){

      applyDocument(stored);

      if(pages.length){

        showMessage(
          "Your document is being displayed from the current review session.",
          "success"
        );

      }else{

        showMessage(
          error.message ||
          "The completed document could not be loaded.",
          "error"
        );

      }

    }else{

      setStatus("REVIEW ERROR","error");

      showMessage(
        error.message ||
        "The completed document could not be loaded.",
        "error"
      );

    }

  }finally{

    loading = false;

    updateStatusUI();

  }
}


/* =========================================================
   POLLING
   ========================================================= */

function startPolling(){

  stopPolling();

  pollTimer =
    setInterval(
      async function(){

        if(
          reviewReady &&
          pages.length
        ){
          stopPolling();
          return;
        }

        await loadReview();

      },
      2500
    );
}


function stopPolling(){

  if(pollTimer){

    clearInterval(
      pollTimer
    );

    pollTimer = null;
  }
}


/* =========================================================
   CORRECTION
   ========================================================= */

correctionButton.addEventListener(
  "click",
  async function(){

    if(
      correcting ||
      !pages.length
    ){
      return;
    }

    const instruction =
      clean(
        correctionInput.value
      );

    if(!instruction){

      showMessage(
        "Please enter the correction you want applied.",
        "error"
      );

      correctionInput.focus();

      return;
    }

    if(
      !currentService ||
      !documentTitle
    ){

      showMessage(
        "The service and document title are required to apply a correction.",
        "error"
      );

      return;
    }

    correcting = true;

    correctionButton.disabled = true;

    makePaymentButton.disabled = true;

    setStatus("APPLYING CORRECTION");

    setProgress(55);

    hideMessage();

    try{

      /*
        IMPORTANT:

        Correction is identified by SERVICE + DOCUMENT TITLE.
        The existing document is supplied as the exact source.
      */

      const payload = {

        service:
          currentService,

        document_title:
          documentTitle,

        title:
          documentTitle,

        instruction:
          instruction,

        correction:
          instruction,

        document:
          currentDocument,

        pages:
          pages

      };

      const data =
        await apiPost(
          "/api/correct",
          payload
        );

      applyDocument(
        unwrapResponse(data)
      );

      correctionInput.value = "";

      if(pages.length){

        reviewReady = true;

        setStatus(
          "READY",
          "ready"
        );

        setProgress(100);

        makePaymentButton.disabled =
          false;

        correctionButton.disabled =
          false;

        showMessage(
          "Correction applied. Please review the updated document.",
          "success"
        );

      }else{

        reviewReady = false;

        showMessage(
          "The correction was submitted and the document is being prepared again.",
          ""
        );

        startPolling();
      }

    }catch(error){

      setStatus(
        reviewReady ? "READY" : "REVIEW ERROR",
        reviewReady ? "ready" : "error"
      );

      showMessage(
        error.message ||
        "The correction could not be applied.",
        "error"
      );

      updateStatusUI();

    }finally{

      correcting = false;

      updateStatusUI();

    }

  }
);


/* =========================================================
   MAKE PAYMENT
   ========================================================= */

makePaymentButton.addEventListener(
  "click",
  async function(){

    if(
      paymentPreparing ||
      !pages.length ||
      !reviewReady
    ){
      return;
    }

    if(
      !currentService ||
      !documentTitle
    ){

      showMessage(
        "The service and document title are required before payment can be prepared.",
        "error"
      );

      return;
    }

    paymentPreparing = true;

    makePaymentButton.disabled =
      true;

    correctionButton.disabled =
      true;

    setStatus(
      "PREPARING PAYMENT"
    );

    setProgress(80);

    hideMessage();

    try{

      /*
        PRODUCT IDENTITY:

            service + document_title

        The exact reviewed document is included.

        No job ID is sent.
        No payment ID is used.
        No transaction ID is used.
        No version ID is used.
      */

      const identity =
        getProductIdentity();

      const payload = {

        service:
          identity.service,

        document_title:
          identity.document_title,

        title:
          identity.document_title,

        amount:
          amountToPay,

        currency:
          "NGN",

        document_payload:{

          service:
            identity.service,

          document_title:
            identity.document_title,

          pages:
            pages,

          document:
            currentDocument

        },

        pages:
          pages

      };

      const result =
        await paymentPost(
          "/api/payment/create",
          payload
        );

      setProgress(100);

      setStatus(
        "PAYMENT READY",
        "ready"
      );

      /*
        Preserve the payment page handoff, but use only
        SERVICE + DOCUMENT TITLE for document identity.
      */

      const paymentUrl =
        "payment.html" +
        "?service=" +
        encodeURIComponent(
          identity.service
        ) +
        "&document_title=" +
        encodeURIComponent(
          identity.document_title
        ) +
        (
          amountToPay
            ? "&amount=" +
              encodeURIComponent(
                amountToPay
              )
            : ""
        );

      showMessage(
        clean(
          result.message ||
          "Your document has been prepared for payment."
        ),
        "success"
      );

      setTimeout(
        function(){
          window.location.href =
            paymentUrl;
        },
        350
      );

    }catch(error){

      setStatus(
        "PAYMENT ERROR",
        "error"
      );

      setProgress(
        reviewReady ? 100 : 75
      );

      showMessage(
        error.message ||
        "Payment preparation could not connect to the payment service. Please try again.",
        "error"
      );

      makePaymentButton.disabled =
        false;

      correctionButton.disabled =
        false;

    }finally{

      paymentPreparing = false;

    }

  }
);


/* =========================================================
   INITIALIZATION
   ========================================================= */

function initialize(){

  updateIdentityUI();

  setStatus(
    "PREPARING"
  );

  setProgress(10);

  /*
    First attempt:

    If direct document data or an existing review session is
    already available, show it immediately instead of waiting
    for an unnecessary API round trip.
  */

  const directData =
    readUrlReviewData();

  if(directData){

    applyDocument(
      directData
    );

    if(
      pages.length &&
      reviewReady
    ){

      stopPolling();

      return;
    }
  }

  const stored =
    readStoredReview();

  if(stored){

    applyDocument(
      stored
    );

    if(
      pages.length &&
      reviewReady
    ){

      stopPolling();

      return;
    }
  }

  /*
    Then load from the existing Review service using:

        service + document_title
  */

  loadReview();

  startPolling();

}


initialize();


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function(){
    stopPolling();
  }
);

})();
</script>
