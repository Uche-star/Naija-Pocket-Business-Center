*{

html,

:root{

.job-dot{

.main{

}

.hero{

    font-size:27px;

}

.hero h1 span{

}

.hero p{
    max-width:650px;
    margin:9px auto 0;
    color:#999;
    font-size:13px;

}

.magic{
    position:relative;
    min-height:390px;
    overflow:hidden;
    border:1px solid #282828;
    border-radius:24px;
    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(224,189,85,.10),
            transparent 34%
        ),
        radial-gradient(
            circle at 15% 20%,
            rgba(70,130,255,.07),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(190,70,255,.06),
            transparent 28%
        ),
        #080808;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.magic::before{
    content:"";
    position:absolute;
    width:55%;
    height:200%;
    top:-50%;
    left:-30%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.025),
        transparent
    );
    transform:rotate(18deg);
    animation:lightSweep 6s linear infinite;
    pointer-events:none;
}

@keyframes lightSweep{
    from{
        left:-45%;
    }
    to{
        left:110%;
    }
}

.magic-head{
    position:relative;
    z-index:10;
    padding:17px 17px 12px;
    text-align:center;
}

.magic-title{
    margin:0;
    color:var(--gold-light);
    font-family:Montserrat,Arial,sans-serif;
    font-size:16px;
    font-weight:800;
    letter-spacing:.4px;
}

.magic-message{
    margin:6px 0 0;
    color:#999;
    font-size:11px;
}

.flight-area{
    position:relative;
    height:245px;

}

.assembly-core{
    position:absolute;
    left:50%;
    top:50%;
    width:116px;
    height:116px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(224,189,85,.35);
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(224,189,85,.13),
            rgba(0,0,0,.15) 65%
        );
    box-shadow:
        0 0 35px rgba(224,189,85,.08),
        inset 0 0 30px rgba(224,189,85,.05);
    display:flex;
    align-items:center;

    z-index:4;
}

.core-ring{
    position:absolute;
    inset:9px;
    border:1px dashed rgba(224,189,85,.3);
    border-radius:50%;
    animation:spin 8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.core-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.core-icon{
    font-size:27px;
}

.core-label{
    margin-top:3px;
    color:#c7c7c7;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.3px;
}

.fly{
    position:absolute;
    left:-150px;
    width:135px;
    min-height:52px;
    padding:9px 11px;
    display:flex;
    align-items:center;
    gap:9px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );
    box-shadow:0 9px 28px rgba(0,0,0,.35);
    opacity:0;
    z-index:7;
    pointer-events:none;
}

.fly.visible{
    opacity:1;
}

.fly-icon{
    width:31px;
    height:35px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:7px;
    background:rgba(255,255,255,.08);
    font-size:16px;
}

.fly-text{
    min-width:0;
}

.fly-title{
    overflow:hidden;
    color:#fff;
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.fly-status{
    margin-top:3px;
    color:#929292;
    font-size:8px;
}

.fly.left{
    animation:flyLeft 2.5s cubic-bezier(.18,.7,.22,1) forwards;
}

.fly.right{
    left:auto;
    right:-150px;
    animation:flyRight 2.5s cubic-bezier(.18,.7,.22,1) forwards;
}

@keyframes flyLeft{
    0%{
        left:-150px;
        top:var(--top);
        transform:scale(.72) rotate(-4deg);
        opacity:0;
    }
    12%{
        opacity:1;
    }
    50%{
        transform:scale(1) rotate(1deg);
    }
    88%{
        opacity:1;
    }
    100%{
        left:calc(50% - 67px);
        top:calc(50% - 26px);
        transform:scale(.72) rotate(0deg);
        opacity:0;
    }
}

@keyframes flyRight{
    0%{
        right:-150px;
        top:var(--top);
        transform:scale(.72) rotate(4deg);
        opacity:0;
    }
    12%{
        opacity:1;
    }
    50%{
        transform:scale(1) rotate(-1deg);
    }
    88%{
        opacity:1;
    }
    100%{
        right:calc(50% - 67px);
        top:calc(50% - 26px);
        transform:scale(.72) rotate(0deg);
        opacity:0;
    }
}

.progress-area{

</style></head><body><div class="app"><header class="header">
    <div>
        <div class="brand-title">

        </div>    <div class="brand-subtitle">

"use strict";

/*
============================================================
 REVIEW / WORKSPACE CONTRACT
============================================================

The Workspace creates a job and must send the customer to:

    review.html?job_id=<JOB_ID>

This page NEVER invents a job ID.

It accepts the job ID from:
    1. job_id
    2. id
    3. stored job_id

The review endpoint is then always queried with that same ID.

The response may contain the sections/document directly,
inside "job", or inside "version".

The UI normalizes those possible response shapes so the
Workspace and Review page do not have to use identical
internal JSON structures.
============================================================
*/


/* ============================================================
   STATE
============================================================ */

const params =
    new URLSearchParams(window.location.search);

let jobId =
    cleanId(params.get("job_id")) ||
    cleanId(params.get("id")) ||
    cleanId(localStorage.getItem("job_id"));

let latestData = null;

let polling = false;
let pollTimer = null;

let animationCounter = 0;

let knownDoneIds = new Set();

let lastRenderedDocument = "";

let consecutiveErrors = 0;


/* ============================================================
   DOM
============================================================ */

const flightArea =
    document.getElementById("flightArea");

const sectionList =
    document.getElementById("sectionList");

const documentBox =
    document.getElementById("document");

const progressBar =
    document.getElementById("progressBar");

const progressNumber =
    document.getElementById("progressNumber");

const progressLabel =
    document.getElementById("progressLabel");

const sectionCount =
    document.getElementById("sectionCount");

const documentStatus =
    document.getElementById("documentStatus");

const jobState =
    document.getElementById("jobState");

const magicTitle =
    document.getElementById("magicTitle");

const magicMessage =
    document.getElementById("magicMessage");

const heroMessage =
    document.getElementById("heroMessage");

const correctionText =
    document.getElementById("correctionText");

const correctionButton =
    document.getElementById("correctionButton");

const approveButton =
    document.getElementById("approveButton");

const paymentButton =
    document.getElementById("paymentButton");

const downloadButton =
    document.getElementById("downloadButton");

const notice =
    document.getElementById("notice");


/* ============================================================
   INITIALIZATION
============================================================ */

if(!jobId){

    jobState.textContent = "NO JOB";

    showNotice(
        "No document job was supplied. Please return to your workspace and start the service again.",
        "error"
    );

}else{

    /*
        Store the exact job ID created by the Workspace.

        This is important because the Review page must follow
        the same job throughout the complete workflow.
    */
    try{
        localStorage.setItem(
            "job_id",
            jobId
        );
    }catch(error){
        console.warn(
            "Could not save job_id locally.",
            error
        );
    }

    startPolling();
}


/* ============================================================
   ID NORMALIZATION
============================================================ */

function cleanId(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    const result =
        String(value).trim();

    if(!result){
        return "";
    }

    /*
        Do not accept values such as:
        null
        undefined
        false
        [object Object]
    */

    if(
        result === "null" ||
        result === "undefined" ||
        result === "false" ||
        result === "[object Object]"
    ){
        return "";
    }

    return result;
}


/* ============================================================
   POLLING
============================================================ */

function startPolling(){

    if(!jobId){
        return;
    }

    clearTimeout(pollTimer);

    polling = true;

    fetchReview();
}


async function fetchReview(){

    if(!jobId){
        return;
    }

    try{

        const response =
            await fetch(
                "/api/review?job_id=" +
                encodeURIComponent(jobId),
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Review request failed: " +
                response.status
            );
        }

        const data =
            await response.json();

        consecutiveErrors = 0;

        latestData =
            normalizeResponse(data);

        renderReview(
            latestData
        );

    }catch(error){

        console.error(
            "Review polling error:",
            error
        );

        consecutiveErrors++;

        /*
            Do not destroy the existing document when one
            request temporarily fails.
        */

        if(consecutiveErrors >= 2){

            showNotice(
                "We are reconnecting to your document. Your work remains safe.",
                "error"
            );
        }

    }

    clearTimeout(pollTimer);

    if(
        !isFinished(
            latestData
        )
    ){

        polling = true;

        pollTimer =
            setTimeout(
                fetchReview,
                1800
            );

    }else{

        polling = false;
    }
}


/* ============================================================
   RESPONSE NORMALIZATION
============================================================ */

function normalizeResponse(data){

    if(!data){
        return {};
    }

    /*
        Some backends return:

            {
                job_id: "...",
                sections: [...]
            }

        Others return:

            {
                job: {
                    id: "...",
                    sections: [...]
                }
            }

        Others return:

            {
                version: {
                    sections: [...]
                }
            }

        The Review page accepts all three.
    */

    if(
        typeof data !== "object"
    ){
        return {};
    }

    return data;
}


/* ============================================================
   SECTION EXTRACTION
============================================================ */

function getSections(data){

    if(!data){
        return [];
    }

    const candidates = [

        data.sections,

        data.creation_sections,

        data.document_sections,

        data.version &&
            data.version.sections,

        data.job &&
            data.job.sections,

        data.job &&
            data.job.creation_sections,

        data.job &&
            data.job.document_sections,

        data.result &&
            data.result.sections,

        data.result &&
            data.result.document_sections

    ];

    for(
        const candidate of candidates
    ){

        if(
            Array.isArray(candidate)
        ){

            return candidate;
        }
    }

    return [];
}


/* ============================================================
   DOCUMENT EXTRACTION
============================================================ */

function getDocumentHTML(data){

    if(!data){
        return "";
    }

    const candidates = [

        data.document_html,

        data.html,

        data.document,

        data.content_html,

        data.version &&
            data.version.document_html,

        data.version &&
            data.version.html,

        data.version &&
            data.version.document,

        data.job &&
            data.job.document_html,

        data.job &&
            data.job.html,

        data.job &&
            data.job.document,

        data.result &&
            data.result.document_html,

        data.result &&
            data.result.html,

        data.result &&
            data.result.document

    ];

    for(
        const candidate of candidates
    ){

        if(
            typeof candidate ===
            "string" &&
            candidate.trim()
        ){

            return candidate;
        }
    }

    return "";
}


/* ============================================================
   STATUS EXTRACTION
============================================================ */

function getStatus(data){

    if(!data){
        return "";
    }

    const value =

        data.status ||

        data.job_status ||

        data.state ||

        (
            data.job &&
            (
                data.job.status ||
                data.job.state
            )
        ) ||

        (
            data.version &&
            (
                data.version.status ||
                data.version.state
            )
        ) ||

        "";

    return String(
        value
    ).toLowerCase().trim();
}


/* ============================================================
   VERSION ID
============================================================ */

function getVersionId(data){

    if(!data){
        return "";
    }

    const candidates = [

        data.version_id,

        data.current_version_id,

        data.current_version,

        data.version &&
            data.version.version_id,

        data.version &&
            data.version.id,

        data.job &&
            data.job.version_id,

        data.job &&
            data.job.current_version_id,

        data.job &&
            data.job.current_version,

        data.job &&
            data.job.version &&
            data.job.version.version_id,

        data.result &&
            data.result.version_id

    ];

    for(
        const candidate of candidates
    ){

        const value =
            cleanId(candidate);

        if(value){
            return value;
        }
    }

    return "";
}


/* ============================================================
   JOB ID FROM RESPONSE
============================================================ */

function getResponseJobId(data){

    if(!data){
        return "";
    }

    const candidates = [

        data.job_id,

        data.id,

        data.job &&
            data.job.job_id,

        data.job &&
            data.job.id,

        data.result &&
            data.result.job_id,

        data.result &&
            data.result.id

    ];

    for(
        const candidate of candidates
    ){

        const value =
            cleanId(candidate);

        if(value){
            return value;
        }
    }

    return "";
}


/* ============================================================
   COMPLETION
============================================================ */

function getCompletedCount(
    data,
    sections
){

    if(
        data &&
        data.progress &&
        Number.isFinite(
            Number(
                data.progress.completed
            )
        )
    ){

        return Math.max(
            0,
            Number(
                data.progress.completed
            )
        );
    }

    if(
        data &&
        Number.isFinite(
            Number(
                data.completed
            )
        )
    ){

        return Math.max(
            0,
            Number(
                data.completed
            )
        );
    }

    return sections.filter(
        section =>
            isDoneStatus(
                section &&
                section.status
            )
    ).length;
}


/* ============================================================
   TOTAL
============================================================ */

function getTotalCount(
    data,
    sections
){

    if(
        data &&
        data.progress &&
        Number.isFinite(
            Number(
                data.progress.total
            )
        )
    ){

        return Math.max(
            0,
            Number(
                data.progress.total
            )
        );
    }

    if(
        data &&
        Number.isFinite(
            Number(
                data.total
            )
        )
    ){

        return Math.max(
            0,
            Number(
                data.total
            )
        );
    }

    return sections.length;
}


/* ============================================================
   STATUS HELPERS
============================================================ */

function isDoneStatus(status){

    const value =
        String(
            status || ""
        ).toLowerCase().trim();

    return [

        "done",
        "complete",
        "completed",
        "ready",
        "assembled",
        "approved",
        "finished",
        "success",
        "successful"

    ].includes(value);
}


function isActiveStatus(status){

    const value =
        String(
            status || ""
        ).toLowerCase().trim();

    return [

        "generating",
        "processing",
        "active",
        "running",
        "in_progress",
        "in-progress",
        "queued",
        "pending",
        "creating",
        "writing",
        "working"

    ].includes(value);
}


function isFailedStatus(status){

    const value =
        String(
            status || ""
        ).toLowerCase().trim();

    return [

        "failed",
        "failure",
        "error",
        "cancelled",
        "canceled"

    ].includes(value);
}


/* ============================================================
   FINISHED
============================================================ */

function isFinished(data){

    if(!data){
        return false;
    }

    const status =
        getStatus(data);

    if([

        "complete",
        "completed",
        "ready",
        "assembled",
        "approved",
        "finished",
        "success",
        "successful"

    ].includes(status)){

        return true;
    }

    const sections =
        getSections(data);

    const total =
        getTotalCount(
            data,
            sections
        );

    const completed =
        getCompletedCount(
            data,
            sections
        );

    const html =
        getDocumentHTML(data);

    return (

        total > 0 &&

        completed >= total &&

        Boolean(
            html
        )

    );
}


/* ============================================================
   MAIN RENDER
============================================================ */

function renderReview(data){

    const sections =
        getSections(data);

    const completed =
        getCompletedCount(
            data,
            sections
        );

    const total =
        getTotalCount(
            data,
            sections
        );

    renderProgress(
        completed,
        total,
        data
    );

    renderSections(
        sections
    );

    renderDocument(
        data
    );

    updateMagic(
        completed,
        total,
        data
    );

    updateActions(
        data
    );

    animateNewlyCompletedSections(
        sections
    );
}


/* ============================================================
   PROGRESS
============================================================ */

function renderProgress(
    completed,
    total,
    data
){

    let percent = 0;

    if(total > 0){

        percent =
            Math.round(
                (
                    completed /
                    total
                ) * 100
            );
    }

    if(
        isFinished(data)
    ){

        percent = 100;
    }

    percent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );

    progressBar.style.width =
        percent + "%";

    progressNumber.textContent =
        percent + "%";

    if(
        isFinished(data)
    ){

        sectionCount.textContent =
            "Creation complete";

        progressLabel.textContent =
            "Your document is complete.";

    }else if(
        completed > 0
    ){

        sectionCount.textContent =
            "Creating your service";

        progressLabel.textContent =
            "Creating your document...";

    }else{

        sectionCount.textContent =
            "Getting started";

        progressLabel.textContent =
            "Preparing your document...";
    }
}


/* ============================================================
   SECTION ORDER
============================================================ */

function sectionOrder(
    section,
    fallback
){

    if(!section){
        return fallback;
    }

    const candidates = [

        section.section_order,
        section.order,
        section.position,
        section.index

    ];

    for(
        const value of candidates
    ){

        const number =
            Number(value);

        if(
            Number.isFinite(number)
        ){

            return number;
        }
    }

    return fallback;
}


/* ============================================================
   SECTION TITLE
============================================================ */

function getSectionTitle(
    section,
    number
){

    if(!section){
        return "Document Section " + number;
    }

    const candidates = [

        section.title,
        section.name,
        section.heading,
        section.section_title,
        section.label

    ];

    for(
        const value of candidates
    ){

        if(
            typeof value === "string" &&
            value.trim()
        ){

            return value.trim();
        }
    }

    return "Document Section " + number;
}


/* ============================================================
   SECTION LIST
============================================================ */

function renderSections(
    sections
){

    sectionList.innerHTML = "";

    if(!sections.length){

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "section-row active";

        row.innerHTML = `

            <div class="section-number">
                •
            </div>

            <div class="section-info">

                <div class="section-title">
                    Preparing the creation plan...
                </div>

                <div class="section-state">
                    Your service is being organized.
                </div>

            </div>

            <div class="section-mark">
                ✦
            </div>
        `;

        sectionList.appendChild(row);

        return;
    }

    const sorted =
        [...sections].sort(
            (a,b) =>
                sectionOrder(a,0) -
                sectionOrder(b,0)
        );

    sorted.forEach(
        (
            section,
            index
        ) => {

            const status =
                String(
                    section &&
                    section.status ||
                    ""
                ).toLowerCase();

            const done =
                isDoneStatus(status);

            const active =
                isActiveStatus(status);

            const failed =
                isFailedStatus(status);

            const number =
                sectionOrder(
                    section,
                    index + 1
                );

            const title =
                escapeHTML(
                    getSectionTitle(
                        section,
                        number
                    )
                );

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "section-row" +
                (
                    done
                    ? " done"
                    : active
                    ? " active"
                    : ""
                );

            let stateText =
                "Waiting";

            let mark =
                "•";

            if(done){

                stateText =
                    "Completed ✓";

                mark =
                    "✓";

            }else if(active){

                stateText =
                    "Creating now...";

                mark =
                    "✦";

            }else if(failed){

                stateText =
                    "Needs attention";

                mark =
                    "!";
            }

            row.innerHTML = `

                <div class="section-number">
                    ${escapeHTML(number)}
                </div>

                <div class="section-info">

                    <div class="section-title">
                        ${title}
                    </div>

                    <div class="section-state">
                        ${stateText}
                    </div>

                </div>

                <div class="section-mark">
                    ${mark}
                </div>
            `;

            sectionList.appendChild(
                row
            );
        }
    );
}


/* ============================================================
   DOCUMENT
============================================================ */

function renderDocument(data){

    const html =
        getDocumentHTML(data);

    if(
        html &&
        html !== lastRenderedDocument
    ){

        documentBox.innerHTML =
            html;

        lastRenderedDocument =
            html;
    }

    const ready =
        isFinished(data);

    if(ready){

        documentStatus.textContent =
            "READY FOR REVIEW";

        documentStatus.classList.add(
            "ready"
        );

    }else{

        documentStatus.textContent =
            "BUILDING";

        documentStatus.classList.remove(
            "ready"
        );
    }
}


/* ============================================================
   MAGIC STATUS
============================================================ */

function updateMagic(
    completed,
    total,
    data
){

    if(
        isFinished(data)
    ){

        magicTitle.textContent =
            "✨ Your Service Has Come to Life ✨";

        magicMessage.textContent =
            "Every section has been created and assembled into your document.";

        heroMessage.textContent =
            "The creation is complete. Your finished service is now ready for you to review.";

        jobState.textContent =
            "READY";

        return;
    }

    const status =
        getStatus(data);

    if(
        isFailedStatus(status)
    ){

        magicTitle.textContent =
            "Your Service Needs Attention";

        magicMessage.textContent =
            "We are checking the document so the work can continue safely.";

        heroMessage.textContent =
            "Something interrupted the creation process. We are checking your document.";

        jobState.textContent =
            "CHECKING";

        return;
    }

    magicTitle.textContent =
        "✨ The Magic of Creation ✨";

    if(total > 0){

        magicMessage.textContent =
            "We are creating your service one carefully prepared section at a time.";

        heroMessage.textContent =
            "Watch as each part of your service is created and brought together.";

        jobState.textContent =
            "CREATING";

    }else{

        magicMessage.textContent =
            "Your service is being prepared...";

        heroMessage.textContent =
            "We are getting everything ready before the creation begins.";

        jobState.textContent =
            "PREPARING";
    }
}


/* ============================================================
   SECTION IDENTIFIER
============================================================ */

function getSectionId(
    section,
    index
){

    if(!section){
        return String(index + 1);
    }

    const candidates = [

        section.section_id,
        section.id,
        section.uuid,
        section.key,
        section.section_order,
        section.order

    ];

    for(
        const candidate of candidates
    ){

        const value =
            cleanId(candidate);

        if(value){
            return value;
        }
    }

    return String(
        index + 1
    );
}


/* ============================================================
   FLYING FILES
============================================================ */

function animateNewlyCompletedSections(
    sections
){

    sections.forEach(
        (
            section,
            index
        ) => {

            const id =
                getSectionId(
                    section,
                    index
                );

            if(
                isDoneStatus(
                    section &&
                    section.status
                ) &&
                !knownDoneIds.has(id)
            ){

                knownDoneIds.add(id);

                createFlyingFile(
                    section,
                    index
                );
            }
        }
    );
}


function createFlyingFile(
    section,
    index
){

    const card =
        document.createElement(
            "div"
        );

    const direction =
        animationCounter % 2 === 0
        ? "left"
        : "right";

    animationCounter++;

    card.className =
        "fly " +
        direction +
        " visible";

    const title =
        escapeHTML(
            getSectionTitle(
                section,
                index + 1
            )
        );

    const icons = [

        "📄",
        "📑",
        "📝",
        "📋",
        "✨",
        "📚"

    ];

    const icon =
        icons[
            index %
            icons.length
        ];

    card.innerHTML = `

        <div class="fly-icon">
            ${icon}
        </div>

        <div class="fly-text">

            <div class="fly-title">
                ${title}
            </div>

            <div class="fly-status">
                Created • assembling
            </div>

        </div>
    `;

    const positions = [

        "15%",
        "28%",
        "42%",
        "56%",
        "68%",
        "31%"

    ];

    card.style.setProperty(
        "--top",
        positions[
            index %
            positions.length
        ]
    );

    flightArea.appendChild(
        card
    );

    setTimeout(
        () => {

            if(card.parentNode){
                card.remove();
            }

        },
        2800
    );
}


/* ============================================================
   ACTION STATE
============================================================ */

function updateActions(
    data
){

    const ready =
        isFinished(data);

    correctionButton.disabled =
        !ready;

    approveButton.disabled =
        !ready;

    const approved =
        Boolean(
            data &&
            (
                data.approved === true ||
                data.is_approved === true ||
                data.approval_status === "approved" ||
                (
                    data.version &&
                    (
                        data.version.approved === true ||
                        data.version.is_approved === true ||
                        data.version.approval_status === "approved"
                    )
                ) ||
                (
                    data.job &&
                    (
                        data.job.approved === true ||
                        data.job.is_approved === true ||
                        data.job.approval_status === "approved"
                    )
                )
            )
        );

    const paid =
        Boolean(
            data &&
            (
                data.paid === true ||
                data.payment_status === "paid" ||
                (
                    data.payment &&
                    data.payment.status === "paid"
                ) ||
                (
                    data.job &&
                    data.job.payment_status === "paid"
                )
            )
        );

    paymentButton.disabled =
        !ready ||
        !approved;

    downloadButton.disabled =
        !ready ||
        !approved ||
        !paid;
}


/* ============================================================
   CORRECTION
============================================================ */

async function requestCorrection(){

    const instruction =
        correctionText.value.trim();

    if(!instruction){

        showNotice(
            "Please tell us what you would like changed.",
            "error"
        );

        correctionText.focus();

        return;
    }

    if(!jobId){

        showNotice(
            "This document job could not be identified.",
            "error"
        );

        return;
    }

    correctionButton.disabled =
        true;

    showNotice(
        "Your correction is being prepared. Only the affected part of the document will be regenerated.",
        "success"
    );

    try{

        const response =
            await fetch(
                "/api/correct",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        job_id:
                            jobId,

                        instruction:
                            instruction
                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "Correction request failed: " +
                response.status
            );
        }

        correctionText.value =
            "";

        /*
            Reset only the local visual completion memory.

            This allows a regenerated section to enter the
            creation animation again.
        */
        knownDoneIds.clear();

        lastRenderedDocument =
            "";

        showNotice(
            "Correction submitted. Watch the affected section return to the creation flow.",
            "success"
        );

        startPolling();

    }catch(error){

        console.error(
            error
        );

        showNotice(
            "We could not submit that correction right now. Your current document has not been changed.",
            "error"
        );

        correctionButton.disabled =
            false;
    }
}


/* ============================================================
   APPROVAL
============================================================ */

async function approveDocument(){

    if(!latestData){
        return;
    }

    if(!jobId){

        showNotice(
            "This document job could not be identified.",
            "error"
        );

        return;
    }

    const versionId =
        getVersionId(
            latestData
        );

    if(!versionId){

        showNotice(
            "The document version could not be identified. Please wait a moment and try again.",
            "error"
        );

        return;
    }

    approveButton.disabled =
        true;

    try{

        const response =
            await fetch(
                "/api/approve",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        job_id:
                            jobId,

                        version_id:
                            versionId
                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "Approval failed: " +
                response.status
            );
        }

        showNotice(
            "Your document has been approved successfully.",
            "success"
        );

        await fetchReview();

    }catch(error){

        console.error(
            error
        );

        showNotice(
            "Approval could not be completed. Your document remains unchanged.",
            "error"
        );

        approveButton.disabled =
            false;
    }
}


/* ============================================================
   PAYMENT
============================================================ */

function continueToPayment(){

    if(!jobId){
        return;
    }

    window.location.href =
        "payment.html?job_id=" +
        encodeURIComponent(
            jobId
        );
}


/* ============================================================
   DOWNLOAD
============================================================ */

function downloadDocument(){

    if(!jobId){
        return;
    }

    const versionId =
        getVersionId(
            latestData
        );

    if(!versionId){

        showNotice(
            "The approved document version is not available yet.",
            "error"
        );

        return;
    }

    window.location.href =
        "/api/download?job_id=" +
        encodeURIComponent(
            jobId
        ) +
        "&version_id=" +
        encodeURIComponent(
            versionId
        );
}


/* ============================================================
   BACK
============================================================ */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        history.back();

        return;
    }

    window.location.href =
        "workspace.html";
}


/* ============================================================
   NOTICE
============================================================ */

function showNotice(
    message,
    type
){

    notice.textContent =
        message;

    notice.className =
        "notice show " +
        (
            type ||
            ""
        );
}


/* ============================================================
   HTML ESCAPING
============================================================ */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        clearTimeout(
            pollTimer
        );
    }
);
