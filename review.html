<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Review Your Complete Service — Naija Pocket Business Center</title>
<style>
:root{--black:#050505;--panel:#111;--line:rgba(255,255,255,.12);--gold:#d4af37;--gold2:#f0d878;--green:#16a34a;--red:#ef4444;--white:#f7f7f7;--muted:#aaa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--black);color:var(--white);font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.header{display:none!important}
.main{flex:1;min-height:0;display:grid!important;grid-template-rows:50% 50%!important;overflow:hidden}
.document-panel,.action-panel{min-height:0;overflow:hidden}
.document-panel{background:#080808;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.action-panel{background:#0d0d0d;overflow-y:auto;padding:14px}
.section-title{font-size:16px;font-weight:800;color:var(--gold2);text-align:center;letter-spacing:.4px;margin:0 0 8px}
.page-count{text-align:center;font-size:11px;color:#aaa;margin-bottom:6px}
.viewer{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 8px}
.page-shell{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.page-content{background:#fff;color:#111;width:min(100%,760px);height:100%;overflow:auto;padding:22px;line-height:1.5;font-size:14px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.viewer-controls{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 0}
.viewer-controls button,.go-wrap button{border:1px solid var(--line);background:#151515;color:#fff;border-radius:7px;padding:7px 10px;font-weight:700}
.go-wrap{display:flex;align-items:center;gap:4px}
.go-wrap input{width:50px;background:#090909;color:#fff;border:1px solid var(--line);border-radius:6px;padding:7px;text-align:center}
.review-card{max-width:900px;margin:0 auto}
.status-box{border:1px solid var(--line);background:#121212;border-radius:10px;padding:10px;margin-bottom:10px}
.status-title{font-weight:800;color:var(--gold2);margin-bottom:5px}
.status-text{font-size:12px;color:#bbb;line-height:1.45}
.progress{height:5px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;width:0;background:var(--gold);transition:width .3s}
.amount-box{border:1px solid rgba(212,175,55,.35);background:#15120a;border-radius:10px;padding:10px;text-align:center;margin-bottom:10px}
.amount-label{font-size:11px;color:#aaa}
.amount{font-size:24px;font-weight:900;color:var(--gold2);margin-top:3px}
.action-buttons{display:grid;grid-template-columns:1fr;gap:7px}
.action-buttons button{width:100%;border:1px solid var(--gold);border-radius:8px;background:#17130a;color:var(--gold2);padding:11px;font-size:13px;font-weight:900}
.action-buttons button.primary{background:linear-gradient(135deg,#d4af37,#a47c00);color:#050505;border-color:#f0d878}
.action-buttons button:disabled{opacity:.45}
.correction-box{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#111;padding:10px}
.correction-box textarea{width:100%;min-height:70px;resize:vertical;background:#080808;color:#fff;border:1px solid var(--line);border-radius:7px;padding:8px;font-family:inherit}
.correction-box button{margin-top:7px;width:100%;border:1px solid var(--gold);background:#17130a;color:var(--gold2);border-radius:7px;padding:9px;font-weight:800}
.message{font-size:12px;text-align:center;min-height:17px;margin:8px 0}
.message.success{color:#65d58a}
.message.error{color:#ff7474}
.message.info{color:#bbb}
#paymentSection{display:none;margin-top:10px;border:1px solid rgba(212,175,55,.3);border-radius:10px;background:#111;padding:10px}
.payment-heading{font-weight:900;color:var(--gold2);text-align:center;margin-bottom:8px}
.payment-details{font-size:12px;line-height:1.5;color:#ccc}
.payment-details strong{color:#fff}
.delivery-heading{text-align:center;font-weight:900;color:var(--gold2);margin-bottom:8px}
.delivery-channels{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.delivery-channel{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:9px;background:#171717;color:#fff;font-size:12px;font-weight:800}
.delivery-channel.phone{border-color:rgba(22,163,74,.5)}
.delivery-channel.whatsapp{border-color:rgba(37,211,102,.45)}
.delivery-channel.telegram{border-color:rgba(42,171,238,.45)}
.delivery-channel.email{border-color:rgba(212,175,55,.45)}
.delivery-note{font-size:11px;color:#999;text-align:center;margin-top:8px;line-height:1.4}
.back-office{margin-top:10px;text-align:center}
.back-office button{border:1px solid var(--line);background:#101010;color:#aaa;border-radius:7px;padding:7px 12px;font-size:11px}
#loading{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20}
.loader{border:3px solid #333;border-top-color:var(--gold);border-radius:50%;width:28px;height:28px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
.page-content{padding:16px;font-size:13px}
.action-panel{padding:10px}
.delivery-channels{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="main">

<section class="document-panel">
<div class="section-title">Your Complete Document</div>
<div class="page-count" id="pageCount">0 PAGES</div>
<div class="viewer">
<div id="loading"><div class="loader"></div></div>
<div class="page-shell">
<div id="pageContent" class="page-content">Preparing your document...</div>
</div>
</div>
<div class="viewer-controls">
<button id="prevPage">Previous</button>
<div class="go-wrap">
<input id="pageInput" type="number" min="1" value="1">
<button id="goPage">GO</button>
</div>
<button id="nextPage">Next</button>
</div>
</section>

<section class="action-panel">
<div class="review-card">

<div class="section-title">Review Your Complete Service</div>

<div class="status-box">
<div class="status-title" id="statusTitle">Review is ready</div>
<div class="status-text" id="statusText">Please review your complete document before proceeding.</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="amount-box">
<div class="amount-label">AMOUNT TO PAY</div>
<div class="amount" id="amount">₦0</div>
</div>

<div class="action-buttons">
<button id="makePaymentButton" class="primary">💳 MAKE PAYMENT</button>
<button id="paymentButton">✓ I HAVE MADE PAYMENT</button>
<button id="downloadButton">⬇ DOWNLOAD DOCUMENT</button>
</div>

<div class="correction-box">
<textarea id="correctionInput" placeholder="Tell us what you want corrected..."></textarea>
<button id="correctionButton">APPLY CORRECTION</button>
</div>

<div class="message info" id="message"></div>

<div id="paymentSection">
<div class="payment-heading">PAYMENT &amp; DELIVERY</div>
<div class="payment-details" id="paymentDetails"></div>
<div class="message info" id="paymentMessage"></div>
</div>

<div class="back-office">
<button id="backOfficeButton">Back Office</button>
</div>

</div>
</section>

</div>

<script>
const API_BASE="";
const params=new URLSearchParams(location.search);
const jobId=(params.get("job_id")||"").trim();
const service=(params.get("service")||"Business Center Service").trim();
let documentTitle=(params.get("title")||params.get("document_title")||"").trim();

let pages=[];
let currentPage=1;
let versionId="";
let amountValue=0;

const pageContent=document.getElementById("pageContent");
const pageCount=document.getElementById("pageCount");
const pageInput=document.getElementById("pageInput");
const prevPage=document.getElementById("prevPage");
const nextPage=document.getElementById("nextPage");
const goPage=document.getElementById("goPage");
const amount=document.getElementById("amount");
const statusTitle=document.getElementById("statusTitle");
const statusText=document.getElementById("statusText");
const progressBar=document.getElementById("progressBar");
const message=document.getElementById("message");
const correctionInput=document.getElementById("correctionInput");
const correctionButton=document.getElementById("correctionButton");
const makePaymentButton=document.getElementById("makePaymentButton");
const paymentButton=document.getElementById("paymentButton");
const downloadButton=document.getElementById("downloadButton");
const paymentSection=document.getElementById("paymentSection");
const paymentDetails=document.getElementById("paymentDetails");
const paymentMessage=document.getElementById("paymentMessage");
const backOfficeButton=document.getElementById("backOfficeButton");
const loading=document.getElementById("loading");

function clean(v){
return typeof v==="string"?v.trim():""
}

function setLoading(v){
loading.style.display=v?"flex":"none"
}

function setMessage(text,type="info"){
message.textContent=text;
message.className="message "+type
}

function formatMoney(v){
const n=Number(v)||0;
return "₦"+n.toLocaleString("en-NG")
}

function setProgress(v){
progressBar.style.width=Math.max(0,Math.min(100,Number(v)||0))+"%"
}

function renderPage(){
if(!pages.length){
pageContent.textContent="No document pages are available.";
pageCount.textContent="0 PAGES";
pageInput.value=1;
return
}
currentPage=Math.max(1,Math.min(currentPage,pages.length));
pageCount.textContent=pages.length+" "+(pages.length===1?"PAGE":"PAGES");
pageInput.value=currentPage;
pageContent.innerHTML=pages[currentPage-1]||"";
prevPage.disabled=currentPage<=1;
nextPage.disabled=currentPage>=pages.length;
setProgress((currentPage/pages.length)*100)
}

function normalizeDocument(text){
let s=String(text||"");
s=s.replace(/\r\n/g,"\n");
s=s.replace(/```(?:html|markdown|md)?/gi,"");
s=s.replace(/```/g,"");
s=s.replace(/\*\*(.*?)\*\*/gs,"$1");
s=s.replace(/__(.*?)__/gs,"$1");
s=s.replace(/^#{1,6}\s*/gm,"");
s=s.replace(/^---+\s*$/gm,"");
return s.trim()
}

function extractPages(data){
let rawPages=[];
if(Array.isArray(data?.pages))rawPages=data.pages;
else if(Array.isArray(data?.document?.pages))rawPages=data.document.pages;
else if(Array.isArray(data?.result?.pages))rawPages=data.result.pages;

if(!rawPages.length){
const raw=data?.content||data?.document?.content||data?.result?.content||data?.text||"";
if(raw){
const normalized=normalizeDocument(raw);
rawPages=normalized.split(/\f|\n\s*PAGE\s+\d+\s*\n/gi).filter(Boolean)
}
}

return rawPages.map(p=>{
if(typeof p==="string")return normalizeDocument(p);
if(typeof p?.content==="string")return normalizeDocument(p.content);
if(typeof p?.text==="string")return normalizeDocument(p.text);
return normalizeDocument(JSON.stringify(p))
}).filter(Boolean)
}

async function getJson(url,options={}){
const r=await fetch(url,{credentials:"same-origin",...options});
const text=await r.text();
let data={};
try{data=text?JSON.parse(text):{}}catch(e){data={raw:text}};
if(!r.ok){
throw new Error(clean(data?.detail)||clean(data?.message)||"Request failed")
}
return data
}

async function loadReview(){
if(!jobId){
setMessage("Review job is missing.","error");
statusTitle.textContent="Review unavailable";
statusText.textContent="No review job was supplied.";
return
}

setLoading(true);
setMessage("Loading your document...","info");

try{
const data=await getJson(API_BASE+"/api/review/"+encodeURIComponent(jobId));

pages=extractPages(data);
versionId=clean(data?.version_id||data?.versionId||data?.document?.version_id||"");
documentTitle=clean(data?.document_title||data?.title||documentTitle);
amountValue=Number(data?.amount||data?.price||data?.total_amount||0)||0;

if(data?.page_count && !pages.length){
pageCount.textContent=String(data.page_count)+" PAGES"
}

amount.textContent=formatMoney(amountValue);
statusTitle.textContent=clean(data?.status_title)||"Review is ready";
statusText.textContent=clean(data?.status_message)||"Please review your complete document before proceeding.";

renderPage();
setMessage("Your document is ready for review.","success");

}catch(err){
console.error(err);
statusTitle.textContent="Review unavailable";
statusText.textContent=err.message||"Unable to load the review.";
setMessage(err.message||"Unable to load the review.","error");
}finally{
setLoading(false)
}
}

prevPage.addEventListener("click",()=>{
if(currentPage>1){
currentPage--;
renderPage()
}
});

nextPage.addEventListener("click",()=>{
if(currentPage<pages.length){
currentPage++;
renderPage()
}
});

goPage.addEventListener("click",()=>{
const n=Number(pageInput.value)||1;
currentPage=n;
renderPage()
});

pageInput.addEventListener("keydown",e=>{
if(e.key==="Enter")goPage.click()
});

function buildFallbackDownloadUrl(){
return ("/api/download?job_id="+encodeURIComponent(jobId)+"&version_id="+encodeURIComponent(versionId))
}

function buildEmailUrl(downloadUrl){
const subject=encodeURIComponent("Your Naija Pocket Business Center Document");
const body=encodeURIComponent(
"Dear Customer,\n\n"+
"Thank you for using Naija Pocket Business Center. Your requested document has been prepared and is ready for delivery.\n\n"+
"Please use the link below to access your document:\n\n"+
new URL(downloadUrl,window.location.origin).href+
"\n\nIf you need any assistance with your document or delivery, please contact Customer Care.\n\n"+
"Thank you for choosing Naija Pocket Business Center.\n\n"+
"Customer Care\nNaija Pocket Business Center"
);
return "mailto:?subject="+subject+"&body="+body
}

function renderDeliveryChannels(ch){
const channels=Array.isArray(ch?.channels)?ch.channels:[];
const findChannel=id=>channels.find(x=>clean(x?.id).toLowerCase()===id);
const phone=findChannel("phone");
const whatsapp=findChannel("whatsapp");
const telegram=findChannel("telegram");
const apiEmail=findChannel("email");
const fallbackDownload=buildFallbackDownloadUrl();
const phoneUrl=clean(phone?.url)||fallbackDownload;
const whatsappUrl=clean(whatsapp?.url)||("https://wa.me/?text="+encodeURIComponent("Your document is ready: "+new URL(phoneUrl,window.location.origin).href));
const telegramUrl=clean(telegram?.url)||("https://t.me/share/url?url="+encodeURIComponent(new URL(phoneUrl,window.location.origin).href)+"&text="+encodeURIComponent("Your document is ready."));
const emailUrl=buildEmailUrl(phoneUrl);

paymentSection.style.display="block";
paymentDetails.innerHTML=`<div class="delivery-heading">YOUR DOCUMENT IS READY</div><div class="delivery-channels"><a class="delivery-channel phone" href="${phoneUrl}" rel="noopener">📱 Download to Phone</a><a class="delivery-channel whatsapp" href="${whatsappUrl}" target="_blank" rel="noopener">💬 WhatsApp</a><a class="delivery-channel telegram" href="${telegramUrl}" target="_blank" rel="noopener">✈️ Telegram</a><a class="delivery-channel email" href="${emailUrl}" target="_blank" rel="noopener">📧 Email</a></div><div class="delivery-note">Your document has already been prepared. Choose how you want to receive it.</div>`;
paymentMessage.textContent="Choose a delivery option above.";
setMessage("Your delivery options are ready.","success")
}

makePaymentButton.addEventListener("click",async()=>{
setLoading(true);
setMessage("Preparing payment details...","info");

try{
const data=await getJson(API_BASE+"/api/payment/details",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
job_id:jobId,
service:service,
document_title:documentTitle,
amount:amountValue,
version_id:versionId
})
});

paymentSection.style.display="block";
paymentDetails.innerHTML=
"<div><strong>Service:</strong> "+(clean(data?.service)||service)+"</div>"+
"<div><strong>Document:</strong> "+(clean(data?.document_title)||documentTitle||"Your Document")+"</div>"+
"<div><strong>Amount:</strong> "+formatMoney(data?.amount||amountValue)+"</div>"+
"<div><strong>Bank:</strong> "+(clean(data?.bank_name)||"Please contact Customer Care for payment details.")+"</div>"+
"<div><strong>Account Name:</strong> "+(clean(data?.account_name)||"")+"</div>"+
"<div><strong>Account Number:</strong> "+(clean(data?.account_number)||"")+"</div>";

paymentMessage.textContent=clean(data?.message)||"After payment, contact Customer Care for verification.";
setMessage("Payment details are ready.","success");

}catch(err){
paymentSection.style.display="block";
paymentDetails.innerHTML="<div>Please contact Customer Care for payment details and verification.</div>";
paymentMessage.textContent=err.message||"Payment details could not be loaded.";
setMessage("Payment details are ready.","success");
}finally{
setLoading(false)
}
});

paymentButton.addEventListener("click",async()=>{
setLoading(true);
setMessage("Checking payment status...","info");

try{
const data=await getJson(API_BASE+"/api/payment/report",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
job_id:jobId,
service:service,
document_title:documentTitle,
amount:amountValue,
version_id:versionId
})
});

paymentMessage.textContent=clean(data?.message)||"Your payment report has been received. Customer Care will verify it.";
setMessage("Payment report submitted.","success");

if(data?.channels)renderDeliveryChannels(data);

}catch(err){
setMessage(err.message||"Unable to submit payment report.","error");
}finally{
setLoading(false)
}
});

downloadButton.addEventListener("click",()=>{
const url=buildFallbackDownloadUrl();
window.location.href=url
});

correctionButton.addEventListener("click",async()=>{
const correction=correctionInput.value.trim();

if(!correction){
setMessage("Please enter the correction you want made.","error");
return
}

setLoading(true);
setMessage("Applying your correction...","info");

try{
const data=await getJson(API_BASE+"/api/review/correct",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
job_id:jobId,
version_id:versionId,
correction:correction
})
});

const newPages=extractPages(data);
if(newPages.length)pages=newPages;

versionId=clean(data?.version_id||data?.versionId||versionId);
renderPage();
correctionInput.value="";
setMessage("Correction applied. Please review the updated document.","success");

}catch(err){
setMessage(err.message||"Unable to apply correction.","error");
}finally{
setLoading(false)
}
});

backOfficeButton.addEventListener("click",()=>{
window.location.href="/back-office.html"
});

loadReview();
</script>

</body></html>
