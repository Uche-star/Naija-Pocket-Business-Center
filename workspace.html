<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naija Pocket Business Center</title><style>
*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#000;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:#000;
}

/* HEADER */

.header{
    flex:0 0 auto;
    min-height:64px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#050505;
    border-bottom:1px solid rgba(0,128,0,.45);
    z-index:20;
}

.brand-title{
    margin:0;
    color:#008000;
    font-size:clamp(18px,4vw,25px);
    font-weight:900;
    line-height:1.15;
}

.brand-subtitle{
    margin-top:3px;
    color:#aaa;
    font-size:10px;
}

.service-badge{
    max-width:45%;
    padding:7px 10px;
    border:1px solid rgba(0,128,0,.5);
    border-radius:20px;
    background:#111;
    color:#69c28e;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* MAIN */

.main{
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
}

.workspace{
    width:100%;
    height:100%;
    max-width:900px;
    margin:auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    padding:8px;
}

/* SERVICE INFORMATION */

.service-card{
    flex:0 0 auto;
    padding:12px;
    margin-bottom:7px;
    background:#111;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
}

.service-title{
    margin:0;
    color:#fff;
    font-size:18px;
    font-weight:900;
}

.service-description{
    margin:5px 0 0;
    color:#bbb;
    font-size:11px;
    line-height:1.5;
}

.price{
    display:inline-block;
    margin-top:7px;
    padding:6px 9px;
    border:1px solid rgba(0,128,0,.45);
    border-radius:8px;
    color:#69c28e;
    font-size:10px;
    font-weight:900;
}

/* CONVERSATION */

.chat{
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
    padding:7px 3px 10px;
    -webkit-overflow-scrolling:touch;
}

.message-row{
    display:flex;
    margin-bottom:8px;
}

.message-row.customer{
    justify-content:flex-end;
}

.message-row.business{
    justify-content:flex-start;
}

.message-bubble{
    max-width:88%;
    padding:10px 12px;
    border-radius:13px;
    font-size:12px;
    line-height:1.55;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.business .message-bubble{
    background:#171717;
    color:#ddd;
    border:1px solid rgba(255,255,255,.07);
}

.customer .message-bubble{
    background:#075c2b;
    color:#fff;
}

.working{
    display:none;
    flex:0 0 auto;
    padding:4px 0;
    color:#69c28e;
    font-size:9px;
    text-align:center;
}

.working.show{
    display:block;
}

/* BOTTOM */

.bottom{
    flex:0 0 auto;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:#080808;
    border-top:1px solid rgba(0,128,0,.35);
    z-index:20;
}

.tools{
    width:100%;
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.tool{
    min-height:38px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    background:#181818;
    color:#fff;
    font-size:9px;
    font-weight:800;
}

.tool.voice{
    color:#69c28e;
}

.choose{
    width:100%;
    max-width:900px;
    min-height:36px;
    margin:5px auto;
    display:block;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    background:#000;
    color:#fff;
    font-size:9px;
    font-weight:800;
}

.composer{
    width:100%;
    max-width:900px;
    margin:auto;
    display:flex;
    gap:6px;
    align-items:flex-end;
}

.message-input{
    flex:1;
    min-width:0;
    min-height:43px;
    max-height:110px;
    resize:none;
    padding:10px;
    background:#171717;
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
    border-radius:9px;
    outline:none;
    font-size:12px;
}

.send{
    width:62px;
    min-height:43px;
    border:0;
    border-radius:9px;
    background:#008000;
    color:#fff;
    font-size:10px;
    font-weight:900;
}

.status{
    min-height:13px;
    margin:3px auto 0;
    color:#777;
    font-size:9px;
    text-align:center;
}

.status.error{
    color:#ff7777;
}

.status.success{
    color:#69c28e;
}

#fileInput{
    display:none;
}

@media(max-width:480px){
    .workspace{padding:7px}
    .tools{gap:4px}
    .tool{font-size:8px}
}
</style></head><body><div class="app"><header class="header">
    <div>
        <h1 class="brand-title">Naija Pocket Business Center</h1>
        <div class="brand-subtitle">Your Business Center</div>
    </div><div id="serviceBadge" class="service-badge"></div>

</header><main class="main"><section class="workspace"><div class="service-card">

    <h2 id="serviceTitle" class="service-title"></h2>

    <p id="serviceDescription" class="service-description">
        Tell us what you need and provide any useful information for your request.
    </p>

    <div id="price" class="price"></div>

</div>

<div id="chat" class="chat" aria-live="polite"></div>

<div id="working" class="working">
    Processing your request…
</div>

</section></main><footer class="bottom"><div class="tools">

    <button
        id="uploadButton"
        class="tool"
        type="button"
    >
        📄 Upload
    </button>

    <button
        id="voiceButton"
        class="tool voice"
        type="button"
    >
        🎤 Voice
    </button>

    <button
        id="customerButton"
        class="tool"
        type="button"
    >
        Customer Service
    </button>

</div>

<button
    id="chooseButton"
    class="choose"
    type="button"
>
    Choose Another Service
</button>

<input
    id="fileInput"
    type="file"
    accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.xls,.xlsx,.csv,.ppt,.pptx"
>

<div class="composer">

    <textarea
        id="messageInput"
        class="message-input"
        rows="1"
        placeholder="Type your message..."
        autocomplete="off"
    ></textarea>

    <button
        id="sendButton"
        class="send"
        type="button"
    >
        SEND
    </button>

</div>

<div id="status" class="status"></div>

</footer></div><script>
"use strict";

/*
    CUSTOMER WORKSPACE

    This page contains NO Groq implementation.
    It contains NO prompts.
    It contains NO keyword AI.
    It contains NO duplicate intelligence.

    The existing /api/chat endpoint remains the intelligence
    gateway already used by this project.

    The workspace only:
        1. accepts customer input
        2. sends it to the existing API
        3. stores returned work for review
        4. opens review.html
*/

const params =
    new URLSearchParams(location.search);

const service =
    (
        params.get("service") ||
        "Business Center Service"
    ).trim();

const serviceBadge =
    document.getElementById("serviceBadge");

const serviceTitle =
    document.getElementById("serviceTitle");

const serviceDescription =
    document.getElementById("serviceDescription");

const price =
    document.getElementById("price");

const chat =
    document.getElementById("chat");

const working =
    document.getElementById("working");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const uploadButton =
    document.getElementById("uploadButton");

const voiceButton =
    document.getElementById("voiceButton");

const customerButton =
    document.getElementById("customerButton");

const chooseButton =
    document.getElementById("chooseButton");

const fileInput =
    document.getElementById("fileInput");

const status =
    document.getElementById("status");

let busy = false;

let customerId =
    localStorage.getItem(
        "npbc_customer_id"
    );

if(!customerId){

    customerId =
        "customer_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2);

    localStorage.setItem(
        "npbc_customer_id",
        customerId
    );
}

let jobId =
    params.get("job_id") ||
    localStorage.getItem(
        "npbc_job_id"
    ) ||
    "";

let clientRequestId =
    localStorage.getItem(
        "npbc_client_request_id"
    );

if(!clientRequestId){

    clientRequestId =
        "request_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2);

    localStorage.setItem(
        "npbc_client_request_id",
        clientRequestId
    );
}

/*
    Existing customer-facing prices.
    These are display values only.
    They do not replace BillingManager.
*/

const prices = {

    "Document Typing":"₦200 per page",
    "Document Formatting":"₦1,500",
    "Document Editing":"₦250 per page",
    "Grammar Correction":"₦200 per page",

    "Assignments":"₦2,500",
    "Assignment":"₦2,500",

    "Projects":"₦250 per page",
    "Project":"₦250 per page",

    "Research Assistance":"₦3,500",

    "Seminar Papers":"₦3,500",
    "Seminar Paper":"₦3,500",

    "CV":"₦2,500",
    "CVs & Résumés":"₦2,500",
    "CVs & Resumes":"₦2,500",

    "Cover Letter":"₦1,500",
    "Cover Letters":"₦1,500",

    "CV + Cover Letter":"₦3,500",

    "Business Proposals":"₦7,500",
    "Company Profiles":"₦5,000",

    "Business Letters & Letterhead":"₦2,000",
    "Invoices":"₦2,000",
    "Quotations":"₦2,000",
    "Meeting Minutes":"₦2,500",

    "Document Rewriting":"₦2,500",
    "Document Summarization":"₦2,500",

    "PDF Conversion":"₦1,000",
    "Voice To Text":"₦250 per page",

    "Topic Explanations":"₦2,000",
    "Printing Preparation":"₦1,000",

    "Excel Spreadsheets":"₦3,000",
    "Data Entry":"₦2,000",
    "Data Analysis":"₦5,000",
    "Presentations":"₦5,000",

    "Translation":"Quotation",
    "Business Plan":"₦15,000",
    "Research Proposal":"₦6,000"
};

function getPrice(name){

    if(prices[name]){
        return prices[name];
    }

    const key =
        String(name)
            .trim()
            .toLowerCase();

    const match =
        Object.keys(prices)
            .find(
                item =>
                    item.toLowerCase() === key
            );

    return match
        ? prices[match]
        : "Quotation";
}

function setStatus(text,type=""){

    status.textContent =
        text || "";

    status.className =
        "status " + type;
}

function setBusy(value){

    busy = value;

    [
        sendButton,
        uploadButton,
        voiceButton,
        customerButton,
        chooseButton
    ].forEach(
        button =>
            button.disabled = value
    );

    working.classList.toggle(
        "show",
        value
    );
}

function addMessage(text,type){

    if(!text){
        return;
    }

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " + type;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";

    bubble.textContent =
        String(text);

    row.appendChild(
        bubble
    );

    chat.appendChild(
        row
    );

    chat.scrollTop =
        chat.scrollHeight;
}

/*
    One API gateway.
    Nothing intelligent is implemented here.
*/

async function sendToExistingAPI(
    message,
    event,
    context = null
){

    const payload = {

        message:
            String(
                message || ""
            ).trim(),

        service,

        event,

        customer_id:
            customerId,

        job_id:
            jobId || null,

        client_request_id:
            clientRequestId,

        activate_intelligence:
            true,

        context:
            context || null
    };

    const response =
        await fetch(
            "/api/chat",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );

    if(!response.ok){

        throw new Error(
            data.error_message ||
            data.message ||
            data.error ||
            "Your request could not be processed."
        );
    }

    if(data.job_id){

        jobId =
            data.job_id;

        localStorage.setItem(
            "npbc_job_id",
            jobId
        );
    }

    return data;
}

/*
    The complete generated document is stored once.
    Review reads this local copy.
    The document is NOT resent just because the customer
    wants to scroll through it.
*/

function reviewKey(){

    return (
        "npbc_review_" +
        (
            jobId ||
            clientRequestId
        )
    );
}

function saveReview(work){

    const packet = {

        service,

        customer_id:
            customerId,

        job_id:
            jobId,

        client_request_id:
            clientRequestId,

        work:
            String(work || ""),

        saved_at:
            Date.now()
    };

    localStorage.setItem(
        reviewKey(),
        JSON.stringify(packet)
    );

    localStorage.setItem(
        "npbc_active_review_key",
        reviewKey()
    );
}

function openReview(work){

    saveReview(work);

    const query =
        new URLSearchParams({

            service,

            customer_id:
                customerId,

            job_id:
                jobId || "",

            client_request_id:
                clientRequestId
        });

    location.href =
        "review.html?" +
        query.toString();
}

/*
    Initial service display.
*/

serviceBadge.textContent =
    service;

serviceTitle.textContent =
    service;

price.textContent =
    "Service fee: " +
    getPrice(service);

/*
    The initial page message is UI guidance only.
    It does not pretend to be intelligence.
*/

addMessage(
    "Welcome. Tell us what you need for your " +
    service +
    " request. You can also upload a document if you already have one.",
    "business"
);

/*
    MESSAGE
*/

async function sendMessage(){

    const message =
        messageInput.value.trim();

    if(!message || busy){
        return;
    }

    messageInput.value =
        "";

    messageInput.style.height =
        "auto";

    addMessage(
        message,
        "customer"
    );

    setBusy(true);

    setStatus(
        "Processing your request..."
    );

    try{

        const data =
            await sendToExistingAPI(
                message,
                "customer_message"
            );

        if(data.reply){

            /*
                The API response is the authoritative result.
                It is handed to review exactly as returned.
            */

            openReview(
                data.reply
            );

            return;
        }

        setStatus(
            "Your message was received.",
            "success"
        );

    }catch(error){

        setStatus(
            error.message,
            "error"
        );

    }finally{

        setBusy(false);
    }
}

sendButton.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);

messageInput.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                110
            ) + "px";
    }
);

/*
    UPLOAD
*/

uploadButton.addEventListener(
    "click",
    () => {

        if(!busy){
            fileInput.click();
        }
    }
);

fileInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files &&
            this.files[0];

        if(!file){
            return;
        }

        const form =
            new FormData();

        form.append(
            "file",
            file
        );

        form.append(
            "service",
            service
        );

        form.append(
            "customer_id",
            customerId
        );

        if(jobId){

            form.append(
                "job_id",
                jobId
            );
        }

        setBusy(true);

        setStatus(
            "Uploading your document..."
        );

        try{

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method:"POST",
                        body:form
                    }
                );

            const data =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );

            if(!response.ok){

                throw new Error(
                    data.message ||
                    data.error ||
                    "Upload failed."
                );
            }

            if(data.job_id){

                jobId =
                    data.job_id;

                localStorage.setItem(
                    "npbc_job_id",
                    jobId
                );
            }

            addMessage(
                "Your document has been received. Continue with your instructions.",
                "business"
            );

            setStatus(
                "Document received.",
                "success"
            );

        }catch(error){

            setStatus(
                error.message,
                "error"
            );

        }finally{

            this.value =
                "";

            setBusy(false);
        }
    }
);

/*
    CUSTOMER SERVICE

    This remains a customer action.
    It does not create a second intelligence system.
*/

customerButton.addEventListener(
    "click",
    () => {

        messageInput.value =
            "I need Customer Service assistance with my " +
            service +
            " request.";

        messageInput.focus();

        messageInput.dispatchEvent(
            new Event("input")
        );
    }
);

/*
    VOICE

    Keep the existing button and do not invent
    another transcription/AI implementation here.
*/

voiceButton.addEventListener(
    "click",
    () => {

        setStatus(
            "Voice is available through the existing voice workflow."
        );
    }
);

/*
    SERVICE SELECTION
*/

chooseButton.addEventListener(
    "click",
    () => {

        if(!busy){

            location.href =
                "conversation.html";
        }
    }
);
</script></body>
</html>
