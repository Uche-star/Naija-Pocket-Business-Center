<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naija Pocket Business Center</title>

<style>
*{box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#000;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#000;
}

.header{
    flex:0 0 auto;
    min-height:64px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#050505;
    border-bottom:1px solid rgba(212,175,55,.3);
    z-index:20;
}

.brand-title{
    margin:0;
    color:#d4af37;
    font-size:clamp(18px,4vw,25px);
    font-weight:900;
    line-height:1.15;
}

.brand-subtitle{
    margin-top:3px;
    color:#aaa;
    font-size:10px;
}

.service-badge{
    max-width:45%;
    padding:7px 10px;
    border:1px solid rgba(212,175,55,.5);
    border-radius:20px;
    background:#171717;
    color:#f3d66b;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.main{
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
}

.workspace{
    width:100%;
    height:100%;
    max-width:900px;
    margin:auto;
    padding:10px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.card{
    margin-bottom:10px;
    padding:15px;
    background:#111;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
}

.title{
    margin:0;
    color:#f3d66b;
    font-size:18px;
    font-weight:900;
}

.text{
    margin:7px 0 0;
    color:#ddd;
    font-size:13px;
    line-height:1.6;
    white-space:pre-wrap;
}

.price{
    display:inline-block;
    margin-top:10px;
    padding:7px 10px;
    border:1px solid rgba(212,175,55,.3);
    border-radius:8px;
    color:#f3d66b;
    font-size:11px;
    font-weight:800;
}

.field{
    margin-bottom:11px;
}

.field label{
    display:block;
    margin-bottom:5px;
    color:#ddd;
    font-size:11px;
    font-weight:800;
}

.field input,
.field textarea{
    width:100%;
    padding:11px;
    background:#191919;
    color:#fff;
    border:1px solid rgba(255,255,255,.13);
    border-radius:9px;
    outline:none;
    font-size:13px;
}

.field textarea{
    min-height:85px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus{
    border-color:rgba(212,175,55,.7);
}

.submit{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:9px;
    background:#d4af37;
    color:#000;
    font-weight:900;
}

.bottom{
    flex:0 0 auto;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:#080808;
    border-top:1px solid rgba(212,175,55,.28);
    z-index:20;
}

.tools{
    width:100%;
    max-width:900px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.tool{
    min-height:38px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:8px;
    background:#181818;
    color:#fff;
    font-size:10px;
    font-weight:800;
}

.tool.gold{color:#f3d66b}

.choose{
    width:100%;
    max-width:900px;
    min-height:37px;
    margin:6px auto;
    display:block;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    background:#000;
    color:#fff;
    font-size:10px;
    font-weight:800;
}

.composer{
    width:100%;
    max-width:900px;
    margin:auto;
    display:flex;
    gap:6px;
    align-items:flex-end;
}

.message{
    flex:1;
    min-width:0;
    min-height:44px;
    max-height:110px;
    resize:none;
    padding:10px;
    background:#171717;
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
    border-radius:9px;
    outline:none;
    font-size:12px;
}

.send{
    width:62px;
    min-height:44px;
    border:0;
    border-radius:9px;
    background:#d4af37;
    color:#000;
    font-size:10px;
    font-weight:900;
}

.status{
    width:100%;
    max-width:900px;
    min-height:14px;
    margin:3px auto 0;
    color:#777;
    font-size:9px;
    text-align:center;
}

.status.error{color:#ff7777}
.status.success{color:#7bd99a}

#fileInput{display:none}

#reviewFrame{
    display:none;
    width:100%;
    height:100%;
    border:0;
    background:#000;
}

#reviewFrame.active{
    display:block;
}

#workspacePanel.hidden{
    display:none;
}

@media(max-width:480px){
    .workspace{padding:7px}
    .tools{gap:4px}
    .tool{font-size:9px}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div>
        <h1 class="brand-title">Naija Pocket Business Center</h1>
        <div class="brand-subtitle">Your Business Center</div>
    </div>

    <div id="serviceBadge" class="service-badge">
        Service
    </div>
</header>

<main class="main">

    <section id="workspacePanel" class="workspace">

        <div class="card">
            <h2 id="serviceTitle" class="title">
                Your Service
            </h2>

            <p id="serviceText" class="text">
                Tell Ada what you need and she will take care of the request.
            </p>

            <div id="price" class="price">
                Service
            </div>
        </div>

        <div class="card">

            <form id="serviceForm">

                <div id="fields"></div>

                <button
                    id="submitButton"
                    class="submit"
                    type="submit"
                >
                    SEND REQUEST
                </button>

            </form>

        </div>

    </section>

    <iframe
        id="reviewFrame"
        title="Document Review"
        src="about:blank"
    ></iframe>

</main>

<footer class="bottom">

    <div class="tools">

        <button id="uploadButton" class="tool" type="button">
            📄 Upload
        </button>

        <button id="voiceButton" class="tool gold" type="button">
            🎤 Voice
        </button>

        <button id="customerButton" class="tool" type="button">
            Customer Service
        </button>

    </div>

    <button id="chooseButton" class="choose" type="button">
        Choose Another Service
    </button>

    <input
        id="fileInput"
        type="file"
        accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.xls,.xlsx,.csv,.ppt,.pptx"
    >

    <div class="composer">

        <textarea
            id="messageInput"
            class="message"
            rows="1"
            placeholder="Type your message..."
        ></textarea>

        <button id="sendButton" class="send" type="button">
            SEND
        </button>

    </div>

    <div id="status" class="status"></div>

</footer>

</div>

<script>
"use strict";

/*
    WORKSPACE RESPONSIBILITY

    This file is only the customer workspace.

    It does NOT:
      - contain Ada intelligence
      - contain Groq
      - contain prompts
      - contain keyword matching
      - generate documents itself
      - contain the review interface

    Generated work is handed to review.html.
*/

const service =
    new URLSearchParams(location.search)
        .get("service") ||
    "Business Center Service";

const serviceBadge =
    document.getElementById("serviceBadge");

const serviceTitle =
    document.getElementById("serviceTitle");

const serviceText =
    document.getElementById("serviceText");

const price =
    document.getElementById("price");

const fields =
    document.getElementById("fields");

const serviceForm =
    document.getElementById("serviceForm");

const submitButton =
    document.getElementById("submitButton");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const uploadButton =
    document.getElementById("uploadButton");

const voiceButton =
    document.getElementById("voiceButton");

const customerButton =
    document.getElementById("customerButton");

const chooseButton =
    document.getElementById("chooseButton");

const fileInput =
    document.getElementById("fileInput");

const status =
    document.getElementById("status");

const workspacePanel =
    document.getElementById("workspacePanel");

const reviewFrame =
    document.getElementById("reviewFrame");


let busy = false;

let jobId =
    localStorage.getItem("npbc_job_id") || "";

let customerId =
    localStorage.getItem("npbc_customer_id") ||
    (
        "customer_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2)
    );

localStorage.setItem(
    "npbc_customer_id",
    customerId
);


function statusMessage(
    text,
    type = ""
){
    status.textContent = text || "";
    status.className =
        "status " + type;
}


function setBusy(value){

    busy = value;

    [
        submitButton,
        sendButton,
        uploadButton,
        voiceButton,
        customerButton
    ].forEach(button => {
        button.disabled = value;
    });
}


function inputField(
    name,
    label,
    placeholder,
    type = "text",
    required = false
){

    const wrapper =
        document.createElement("div");

    wrapper.className = "field";

    const labelElement =
        document.createElement("label");

    labelElement.textContent =
        label +
        (required ? " *" : "");

    const input =
        document.createElement(
            type === "textarea"
                ? "textarea"
                : "input"
        );

    input.name = name;
    input.id = name;
    input.placeholder = placeholder || "";

    if(type !== "textarea"){
        input.type = type;
    }

    input.required = required;

    wrapper.append(
        labelElement,
        input
    );

    return wrapper;
}


function buildFields(){

    fields.innerHTML = "";

    fields.append(
        inputField(
            "request",
            "What do you need?",
            "Tell Ada exactly what you want done.",
            "textarea",
            true
        )
    );

    fields.append(
        inputField(
            "details",
            "Important details",
            "Add any information Ada should know.",
            "textarea"
        )
    );

    fields.append(
        inputField(
            "instructions",
            "Additional instructions",
            "Anything else you want included.",
            "textarea"
        )
    );
}


function collectForm(){

    const data = {};

    fields
        .querySelectorAll(
            "input,textarea,select"
        )
        .forEach(element => {

            const value =
                String(
                    element.value || ""
                ).trim();

            if(value){
                data[element.name] = value;
            }
        });

    return data;
}


/*
    This is deliberately the only intelligence-facing
    operation in the page: hand the customer's request
    to the existing API.

    No Groq call is made here.
*/
async function sendToAda(
    message,
    extra = {}
){

    const payload = {
        message,
        service,
        customer_id: customerId,
        job_id: jobId,
        ...extra
    };

    const response =
        await fetch(
            "/api/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(payload)
            }
        );

    const data =
        await response
            .json()
            .catch(() => ({}));

    if(!response.ok){
        throw new Error(
            data.reply ||
            data.message ||
            data.error ||
            "Ada could not process the request."
        );
    }

    if(data.job_id){

        jobId =
            data.job_id;

        localStorage.setItem(
            "npbc_job_id",
            jobId
        );
    }

    return data;
}


/*
    The review application is loaded only when there
    is actual work to review.
*/
function openReview(work){

    workspacePanel.classList.add("hidden");

    const query =
        new URLSearchParams({
            service,
            customer_id: customerId,
            job_id: jobId
        });

    reviewFrame.src =
        "review.html?" +
        query.toString();

    reviewFrame.classList.add("active");

    reviewFrame.onload = function(){

        reviewFrame.contentWindow.postMessage(
            {
                type:
                    "NPBC_REVIEW_LOAD",

                work:
                    work || "",

                service,
                customer_id:
                    customerId,

                job_id:
                    jobId
            },
            location.origin
        );
    };
}


/*
    Service introduction is obtained through the existing
    API, but no document is created here.
*/
async function loadService(){

    try{

        const data =
            await sendToAda(
                "The customer has selected the service. " +
                "Provide only a short explanation of what " +
                "information the customer should provide. " +
                "Do not create the requested work yet.",
                {
                    event:
                        "service_selected",
                    create_work:
                        false
                }
            );

        if(data.reply){
            serviceText.textContent =
                data.reply;
        }

        if(data.amount){

            price.textContent =
                "Service fee: ₦" +
                Number(
                    data.amount
                ).toLocaleString();

        }

    }catch(error){

        serviceText.textContent =
            "Please provide the information needed for your request below.";

        price.textContent =
            service;

    }
}


serviceForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        if(
            busy ||
            !serviceForm.reportValidity()
        ){
            return;
        }

        const formData =
            collectForm();

        const message =
            [
                formData.request,
                formData.details,
                formData.instructions
            ]
            .filter(Boolean)
            .join("\n\n");

        setBusy(true);

        statusMessage(
            "Ada is working on your request..."
        );

        try{

            const data =
                await sendToAda(
                    message,
                    {
                        event:
                            "customer_request",

                        form_data:
                            formData,

                        create_work:
                            true
                    }
                );

            openReview(
                data.reply || ""
            );

            statusMessage(
                "Your work is ready for review.",
                "success"
            );

        }catch(error){

            statusMessage(
                error.message,
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);


sendButton.addEventListener(
    "click",
    async function(){

        const message =
            messageInput.value.trim();

        if(
            !message ||
            busy
        ){
            return;
        }

        messageInput.value = "";
        messageInput.style.height = "auto";

        setBusy(true);

        statusMessage(
            "Ada is processing your message..."
        );

        try{

            const data =
                await sendToAda(
                    message,
                    {
                        event:
                            "customer_message",

                        create_work:
                            true
                    }
                );

            openReview(
                data.reply || ""
            );

            statusMessage(
                "Ada has updated your work.",
                "success"
            );

        }catch(error){

            statusMessage(
                error.message,
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);


messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendButton.click();
        }
    }
);


messageInput.addEventListener(
    "input",
    function(){

        this.style.height = "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                110
            ) + "px";
    }
);


/*
    Upload remains a workspace operation.
    The uploaded document is sent to the existing API.
*/
uploadButton.addEventListener(
    "click",
    function(){

        if(!busy){
            fileInput.click();
        }
    }
);


fileInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files &&
            this.files[0];

        if(!file){
            return;
        }

        const form =
            new FormData();

        form.append(
            "file",
            file
        );

        form.append(
            "service",
            service
        );

        form.append(
            "customer_id",
            customerId
        );

        if(jobId){
            form.append(
                "job_id",
                jobId
            );
        }

        setBusy(true);

        statusMessage(
            "Uploading your document..."
        );

        try{

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",
                        body: form
                    }
                );

            const data =
                await response
                    .json()
                    .catch(() => ({}));

            if(!response.ok){

                throw new Error(
                    data.message ||
                    data.error ||
                    "Upload failed."
                );
            }

            if(data.job_id){

                jobId =
                    data.job_id;

                localStorage.setItem(
                    "npbc_job_id",
                    jobId
                );
            }

            statusMessage(
                "Document received.",
                "success"
            );

        }catch(error){

            statusMessage(
                error.message,
                "error"
            );

        }finally{

            this.value = "";

            setBusy(false);
        }
    }
);


customerButton.addEventListener(
    "click",
    function(){

        messageInput.value =
            "I need Customer Service assistance with my " +
            service +
            " request.";

        messageInput.focus();
    }
);


chooseButton.addEventListener(
    "click",
    function(){

        if(!busy){
            location.href =
                "conversation.html";
        }
    }
);


/*
    Review → workspace communication.

    The review page can update the active job or ask
    the workspace to send an instruction to Ada.
*/
window.addEventListener(
    "message",
    async function(event){

        if(
            event.origin !==
            location.origin
        ){
            return;
        }

        const data =
            event.data;

        if(
            !data ||
            typeof data !== "object"
        ){
            return;
        }

        if(data.job_id){

            jobId =
                data.job_id;

            localStorage.setItem(
                "npbc_job_id",
                jobId
            );
        }


        if(
            data.type ===
            "NPBC_REVIEW_CORRECTION"
        ){

            try{

                setBusy(true);

                statusMessage(
                    "Ada is applying your correction..."
                );

                const response =
                    await sendToAda(
                        data.correction,
                        {
                            event:
                                "review_correction",

                            correction:
                                data.correction,

                            create_work:
                                true
                        }
                    );

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_WORK_UPDATED",

                        work:
                            response.reply || "",

                        job_id:
                            jobId
                    },
                    location.origin
                );

                statusMessage(
                    "Correction applied.",
                    "success"
                );

            }catch(error){

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_ERROR",

                        message:
                            error.message
                    },
                    location.origin
                );

                statusMessage(
                    error.message,
                    "error"
                );

            }finally{

                setBusy(false);
            }
        }


        /*
            Review requests the existing approval/payment
            workflow through the same API client.
        */
        if(
            data.type ===
            "NPBC_REVIEW_APPROVE"
        ){

            try{

                setBusy(true);

                statusMessage(
                    "Processing approval..."
                );

                const response =
                    await sendToAda(
                        "Customer has approved the document and wants to continue to payment.",
                        {
                            event:
                                "review_approved",

                            approval:
                                true,

                            create_work:
                                false
                        }
                    );

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_APPROVAL_RESULT",

                        result:
                            response,

                        job_id:
                            jobId
                    },
                    location.origin
                );

            }catch(error){

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_ERROR",

                        message:
                            error.message
                    },
                    location.origin
                );

            }finally{

                setBusy(false);
            }
        }


        if(
            data.type ===
            "NPBC_REVIEW_PAYMENT"
        ){

            try{

                setBusy(true);

                statusMessage(
                    "Processing payment request..."
                );

                const response =
                    await sendToAda(
                        data.message ||
                        "Customer is proceeding with payment.",
                        {
                            event:
                                "payment_action",

                            payment_action:
                                data.action,

                            create_work:
                                false
                        }
                    );

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_PAYMENT_RESULT",

                        result:
                            response,

                        job_id:
                            jobId
                    },
                    location.origin
                );

            }catch(error){

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_ERROR",

                        message:
                            error.message
                    },
                    location.origin
                );

            }finally{

                setBusy(false);
            }
        }


        if(
            data.type ===
            "NPBC_REVIEW_DOWNLOAD"
        ){

            /*
                The existing backend response supplies the
                download destination. No new download API
                is invented by this page.
            */

            try{

                setBusy(true);

                statusMessage(
                    "Preparing your download..."
                );

                const response =
                    await sendToAda(
                        "Customer wants to download the approved work.",
                        {
                            event:
                                "download_request",

                            create_work:
                                false
                        }
                    );

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_DOWNLOAD_RESULT",

                        result:
                            response
                    },
                    location.origin
                );

            }catch(error){

                reviewFrame.contentWindow.postMessage(
                    {
                        type:
                            "NPBC_REVIEW_ERROR",

                        message:
                            error.message
                    },
                    location.origin
                );

            }finally{

                setBusy(false);
            }
        }
    }
);


serviceBadge.textContent =
    service;

serviceTitle.textContent =
    service;

buildFields();

loadService();

</script>

</body>
</html>
