<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding:
                max(8px, env(safe-area-inset-top))
                8px
                max(8px, env(safe-area-inset-bottom))
                8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .workspace {
            width: 100%;
            max-width: 700px;
            height: 100%;
            min-height: 0;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            flex: 0 0 auto;
            background: #171717;
            border-radius: 6px;
            padding: 10px 11px;
            margin-bottom: 6px;
            border-bottom: 2px solid #FFFFFF;
        }

        .brand {
            font-size: 17px;
            font-weight: bold;
        }

        .selected-service {
            margin-top: 7px;
            background: #0B0B0B;
            border: 1px solid #444444;
            border-radius: 5px;
            padding: 7px 9px;
        }

        .selected-service-label {
            color: #AAAAAA;
            font-size: 9px;
            margin-bottom: 2px;
        }

        .selected-service-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .service-price {
            margin-top: 6px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .connection-status {
            display: none;
            flex: 0 0 auto;
            width: 100%;
            margin-bottom: 5px;
            padding: 7px 9px;
            border-radius: 5px;
            background: #242424;
            border: 1px solid #444444;
            color: white;
            font-size: 10px;
            line-height: 1.35;
            text-align: center;
        }

        .connection-status.show {
            display: block;
        }

        .chat-area {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            background: #171717;
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid #292929;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            width: 100%;
            margin-bottom: 13px;
            display: flex;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.you {
            justify-content: flex-end;
        }

        .bubble {
            display: inline-block;
            max-width: 92%;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .message.ada .bubble {
            background: #242424;
            color: white;
            border-bottom-left-radius: 2px;
        }

        .message.you .bubble {
            background: #111111;
            color: white;
            border: 1px solid #444444;
            border-bottom-right-radius: 2px;
        }

        .message.system .bubble {
            background: #202020;
            color: #CCCCCC;
            border: 1px solid #333333;
            width: 100%;
            max-width: 100%;
            text-align: center;
        }

        .actions {
            flex: 0 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
            margin-top: 6px;
        }

        .action-button {
            width: 100%;
            min-width: 0;
            min-height: 40px;
            border: 1px solid #444444;
            border-radius: 5px;
            padding: 7px 5px;
            background: #000000;
            color: white;
            font-size: 10px;
            font-weight: bold;
            line-height: 1.15;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .action-button:hover {
            background: #171717;
        }

        .action-button:active {
            background: #242424;
            transform: scale(0.98);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area {
            flex: 0 0 auto;
            width: 100%;
            margin-top: 6px;
            display: flex;
            gap: 5px;
        }

        .message-input {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 44px;
            max-height: 90px;
            resize: none;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            padding: 10px;
            font-size: 13px;
            outline: none;
        }

        .send-button {
            flex: 0 0 76px;
            min-height: 44px;
            border: 1px solid #444444;
            border-radius: 5px;
            background: #000000;
            color: white;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:disabled {
            opacity: 0.5;
        }

        #fileInput,
        #voiceInput {
            display: none;
        }

        .footer {
            flex: 0 0 auto;
            text-align: center;
            color: #777777;
            font-size: 9px;
            line-height: 1.3;
            padding-top: 5px;
        }

        @media (max-width: 360px) {
            .page {
                padding-left: 6px;
                padding-right: 6px;
            }

            .header {
                padding: 8px 9px;
            }

            .brand {
                font-size: 15px;
            }

            .selected-service {
                padding: 6px 8px;
            }

            .selected-service-name {
                font-size: 13px;
            }

            .chat-area {
                padding: 9px;
            }

            .bubble {
                font-size: 12px;
                padding: 9px 10px;
            }

            .actions {
                gap: 4px;
            }

            .action-button {
                min-height: 37px;
                font-size: 9px;
                padding: 5px 3px;
            }

            .message-input {
                min-height: 42px;
                font-size: 12px;
            }

            .send-button {
                flex-basis: 68px;
                min-height: 42px;
            }

            .footer {
                font-size: 8px;
            }
        }

        @media (min-width: 600px) {
            .page {
                padding-left: 16px;
                padding-right: 16px;
            }

            .actions {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }

            .action-button {
                min-height: 42px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <main class="workspace">

        <section class="header">
            <div class="brand">
                NAIJA POCKET BUSINESS CENTER
            </div>

            <div class="selected-service">
                <div class="selected-service-label">
                    SELECTED SERVICE
                </div>

                <div
                    id="selectedService"
                    class="selected-service-name"
                >
                    Loading service...
                </div>

                <div
                    id="servicePrice"
                    class="service-price"
                ></div>
            </div>
        </section>

        <div
            id="connectionStatus"
            class="connection-status"
        ></div>

        <section
            id="chatArea"
            class="chat-area"
        ></section>

        <section class="actions">

            <button
                type="button"
                id="uploadButton"
                class="action-button"
                onclick="openFilePicker()"
            >
                📎 Upload
            </button>

            <button
                type="button"
                id="voiceButton"
                class="action-button"
                onclick="openVoice()"
            >
                🎤 Voice
            </button>

            <button
                type="button"
                id="reviewButton"
                class="action-button"
                onclick="reviewDocument()"
            >
                🔍 Review
            </button>

            <button
                type="button"
                id="approveButton"
                class="action-button"
                onclick="approveDocument()"
            >
                ✅ Approve
            </button>

            <button
                type="button"
                id="paymentButton"
                class="action-button"
                onclick="openPayment()"
            >
                💳 Payment &amp; Download
            </button>

            <button
                type="button"
                id="customerServiceButton"
                class="action-button"
                onclick="contactCustomerService()"
            >
                🆘 Customer Service
            </button>

        </section>

        <section class="input-area">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Write your message here..."
                rows="2"
            ></textarea>

            <button
                type="button"
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
            >
                SEND
            </button>

        </section>

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.webp"
            onchange="handleFileSelected(event)"
        >

        <input
            type="file"
            id="voiceInput"
            accept="audio/*"
            capture="microphone"
            onchange="handleVoiceSelected(event)"
        >

        <div class="footer">
            Naija Pocket Business Center<br>
            Your Business Center In Your Pocket
        </div>

    </main>
</div>

<script>

/* ============================================================
   CONFIGURATION
============================================================ */

const API_BASE =
    "https://naija-pocket-business-center.onrender.com";

const CHAT_ENDPOINT =
    API_BASE + "/api/chat";

const UPLOAD_ENDPOINT =
    API_BASE + "/upload";

const VOICE_PAGE_ENDPOINT =
    API_BASE + "/voice";


/* ============================================================
   CUSTOMER ID
============================================================ */

const CUSTOMER_ID_KEY =
    "naijaPocketCustomerId";

function createPersistentId(prefix) {

    return (
        prefix +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 12)
    );
}

function getCustomerId() {

    let customerId =
        localStorage.getItem(
            CUSTOMER_ID_KEY
        );

    if (!customerId) {

        customerId =
            createPersistentId(
                "customer"
            );

        localStorage.setItem(
            CUSTOMER_ID_KEY,
            customerId
        );
    }

    return customerId;
}

const customerId =
    getCustomerId();


/* ============================================================
   STATE
============================================================ */

let selectedService = "";
let currentJobId = "";
let requestInProgress = false;
let intelligenceStarted = false;
let conversation = [];
let reconnectTimer = null;

let pendingRequests = {};


/* ============================================================
   STORAGE
============================================================ */

const CONVERSATION_PREFIX =
    "naijaPocketConversation:";

const JOB_PREFIX =
    "naijaPocketJob:";

const SERVICE_KEY =
    "selectedService";

const PENDING_KEY =
    "naijaPocketPendingRequests";


/* ============================================================
   NETWORK MESSAGE
============================================================ */

const NETWORK_MESSAGE =
    "There is a temporary network connection issue. Your current request is being kept safely. We will continue it when the connection is available.";


/* ============================================================
   SERVICE
============================================================ */

function normaliseService(service) {

    return String(
        service || ""
    ).trim();
}


/* ============================================================
   JOB
============================================================ */

function createJobId(service) {

    return (
        "job-" +
        encodeURIComponent(
            normaliseService(service)
        ) +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );
}

function getJobStorageKey(service) {

    return (
        JOB_PREFIX +
        customerId +
        ":" +
        encodeURIComponent(
            normaliseService(service)
        )
    );
}

function getConversationStorageKey(service) {

    return (
        CONVERSATION_PREFIX +
        customerId +
        ":" +
        encodeURIComponent(
            normaliseService(service)
        )
    );
}

function saveCurrentJob() {

    try {

        localStorage.setItem(
            getJobStorageKey(
                selectedService
            ),
            JSON.stringify({

                customerId:
                    customerId,

                jobId:
                    currentJobId,

                service:
                    selectedService,

                updatedAt:
                    Date.now()

            })
        );

    } catch (error) {

        console.error(
            "Job save error:",
            error
        );
    }
}

function loadOrCreateCurrentJob() {

    const key =
        getJobStorageKey(
            selectedService
        );

    try {

        const saved =
            localStorage.getItem(
                key
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (
                parsed &&
                parsed.jobId &&
                parsed.service ===
                    selectedService
            ) {

                currentJobId =
                    parsed.jobId;

                return;
            }
        }

    } catch (error) {

        console.error(
            "Job restore error:",
            error
        );
    }

    currentJobId =
        createJobId(
            selectedService
        );

    saveCurrentJob();
}


/* ============================================================
   CONVERSATION
============================================================ */

function loadConversationForService(service) {

    conversation = [];

    try {

        const saved =
            localStorage.getItem(
                getConversationStorageKey(
                    service
                )
            );

        if (!saved) {
            return;
        }

        const parsed =
            JSON.parse(saved);

        if (
            Array.isArray(parsed)
        ) {

            conversation =
                parsed;
        }

    } catch (error) {

        console.error(
            "Conversation restore error:",
            error
        );

        conversation = [];
    }
}

function saveConversation() {

    try {

        localStorage.setItem(
            getConversationStorageKey(
                selectedService
            ),
            JSON.stringify(
                conversation
            )
        );

    } catch (error) {

        console.error(
            "Conversation save error:",
            error
        );
    }
}

function renderMessage(
    sender,
    message,
    save = true
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    let messageClass = "ada";

    if (sender === "You") {
        messageClass = "you";
    }

    if (sender === "System") {
        messageClass = "system";
    }

    wrapper.className =
        "message " +
        messageClass;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.innerText =
        message;

    wrapper.appendChild(
        bubble
    );

    chatArea.appendChild(
        wrapper
    );

    if (save) {

        conversation.push({

            sender:
                sender,

            message:
                message,

            timestamp:
                Date.now()

        });

        saveConversation();
    }

    scrollChatToBottom();
}

function addMessage(
    sender,
    message
) {

    if (
        !message ||
        !String(message).trim()
    ) {
        return;
    }

    renderMessage(
        sender,
        String(message).trim(),
        true
    );
}

function restoreConversationToScreen() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    chatArea.innerHTML = "";

    for (
        const item of conversation
    ) {

        if (
            !item ||
            !item.message
        ) {
            continue;
        }

        renderMessage(
            item.sender,
            item.message,
            false
        );
    }

    scrollChatToBottom();
}

function scrollChatToBottom() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    requestAnimationFrame(
        function() {

            chatArea.scrollTop =
                chatArea.scrollHeight;

        }
    );
}


/* ============================================================
   SELECTED SERVICE
============================================================ */

function getSelectedService() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    selectedService =
        normaliseService(
            params.get("service")
        );

    if (!selectedService) {

        selectedService =
            normaliseService(
                localStorage.getItem(
                    SERVICE_KEY
                )
            );
    }

    if (!selectedService) {

        selectedService =
            "Service not selected";
    }

    document.getElementById(
        "selectedService"
    ).innerText =
        selectedService;

    localStorage.setItem(
        SERVICE_KEY,
        selectedService
    );

    loadConversationForService(
        selectedService
    );

    loadOrCreateCurrentJob();
}


/* ============================================================
   PRICE
============================================================ */

function updatePrice(result) {

    if (
        !result ||
        result.price === undefined ||
        result.price === null
    ) {
        return;
    }

    const price =
        String(
            result.price
        );

    document.getElementById(
        "servicePrice"
    ).innerText =
        price.includes("₦")
            ? "SERVICE PRICE: " + price
            : "SERVICE PRICE: ₦" + price;
}


/* ============================================================
   CONNECTION STATUS
============================================================ */

function showConnectionStatus(message) {

    const status =
        document.getElementById(
            "connectionStatus"
        );

    status.innerText =
        message;

    status.classList.add(
        "show"
    );
}

function hideConnectionStatus() {

    const status =
        document.getElementById(
            "connectionStatus"
        );

    status.classList.remove(
        "show"
    );

    status.innerText = "";
}


/* ============================================================
   REQUEST IDS
============================================================ */

function createRequestId() {

    return (
        "request-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );
}

function createRequest(
    message,
    eventName
) {

    return {

        requestId:
            createRequestId(),

        customerId:
            customerId,

        jobId:
            currentJobId,

        service:
            selectedService,

        message:
            message,

        event:
            eventName,

        createdAt:
            Date.now(),

        attempts:
            0

    };
}


/* ============================================================
   PENDING REQUESTS
============================================================ */

function loadPendingRequests() {

    pendingRequests = {};

    try {

        const saved =
            localStorage.getItem(
                PENDING_KEY
            );

        if (!saved) {
            return;
        }

        const parsed =
            JSON.parse(saved);

        if (
            parsed &&
            typeof parsed === "object"
        ) {

            pendingRequests =
                parsed;
        }

    } catch (error) {

        console.error(
            "Pending request restore error:",
            error
        );
    }
}

function savePendingRequests() {

    try {

        localStorage.setItem(
            PENDING_KEY,
            JSON.stringify(
                pendingRequests
            )
        );

    } catch (error) {

        console.error(
            "Pending request save error:",
            error
        );
    }
}

function savePendingRequest(request) {

    if (
        !request ||
        !request.requestId
    ) {
        return;
    }

    pendingRequests[
        request.requestId
    ] = request;

    savePendingRequests();
}

function clearPendingRequest(requestId) {

    if (!requestId) {
        return;
    }

    delete pendingRequests[
        requestId
    ];

    savePendingRequests();
}

function getPendingRequestList() {

    return Object.values(
        pendingRequests
    ).filter(
        function(request) {

            return (
                request &&
                request.requestId &&
                request.customerId ===
                    customerId &&
                request.message !==
                    undefined
            );
        }
    );
}

function getPendingRequestForCurrentJob() {

    const requests =
        getPendingRequestList();

    for (
        const request of requests
    ) {

        if (
            request.service ===
                selectedService &&
            request.jobId ===
                currentJobId
        ) {

            return request;
        }
    }

    return null;
}

function cleanInvalidPendingRequests() {

    let changed = false;

    for (
        const request of
        getPendingRequestList()
    ) {

        if (
            !request.service ||
            !request.jobId
        ) {

            delete pendingRequests[
                request.requestId
            ];

            changed = true;
        }
    }

    if (changed) {
        savePendingRequests();
    }
}


/* ============================================================
   NETWORK
============================================================ */

function isNetworkError(error) {

    if (!error) {
        return false;
    }

    if (
        error.name ===
        "AbortError"
    ) {
        return true;
    }

    if (
        error instanceof
        TypeError
    ) {
        return true;
    }

    const text =
        String(
            error.message || ""
        ).toLowerCase();

    return (
        text.includes("network") ||
        text.includes("failed to fetch") ||
        text.includes("connection") ||
        text.includes("timeout") ||
        text.includes("offline") ||
        text.includes("fetch")
    );
}

function wait(milliseconds) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );
}


/* ============================================================
   CHAT REQUEST
============================================================ */

async function requestFastAPI(request) {

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            function() {

                controller.abort();

            },
            30000
        );

    try {

        const response =
            await fetch(
                CHAT_ENDPOINT,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                request.message,

                            service:
                                request.service,

                            event:
                                request.event,

                            customer_id:
                                request.customerId,

                            job_id:
                                request.jobId,

                            client_request_id:
                                request.requestId,

                            activate_intelligence:
                                true

                        }),

                    signal:
                        controller.signal
                }
            );

        let result;

        try {

            result =
                await response.json();

        } catch (error) {

            const invalid =
                new Error(
                    "Server returned an invalid response."
                );

            invalid.serverError =
                true;

            invalid.status =
                response.status;

            throw invalid;
        }

        updatePrice(result);

        if (
            response.ok &&
            result &&
            result.success
        ) {

            return {
                reply:
                    result.reply ||
                    result.response ||
                    result.message ||
                    "Your request is ready to continue.",

                result:
                    result
            };
        }

        const serverError =
            (
                result &&
                (
                    result.error ||
                    result.message
                )
            ) ||
            "The Business Center could not process the request.";

        const error =
            new Error(
                serverError
            );

        error.serverError =
            true;

        error.status =
            response.status;

        error.result =
            result;

        throw error;

    } finally {

        clearTimeout(
            timeout
        );
    }
}


/* ============================================================
   SEND CHAT REQUEST
============================================================ */

async function sendToAda(
    message,
    eventName
) {

    const request =
        createRequest(
            message,
            eventName
        );

    const retryDelays = [
        1500,
        3000,
        6000,
        10000
    ];

    let lastError = null;

    for (
        let attempt = 0;
        attempt <= retryDelays.length;
        attempt++
    ) {

        try {

            if (
                !navigator.onLine
            ) {

                throw new TypeError(
                    "Network is currently offline."
                );
            }

            request.attempts =
                attempt + 1;

            if (
                attempt > 0
            ) {

                showConnectionStatus(
                    "Reconnecting and continuing your request..."
                );
            }

            const result =
                await requestFastAPI(
                    request
                );

            hideConnectionStatus();

            return result.reply;

        } catch (error) {

            lastError =
                error;

            console.error(
                "Ada request attempt " +
                (attempt + 1) +
                " failed:",
                error
            );

            if (
                error.serverError
            ) {
                break;
            }

            if (
                attempt <
                retryDelays.length
            ) {

                showConnectionStatus(
                    "Reconnecting..."
                );

                await wait(
                    retryDelays[
                        attempt
                    ]
                );

                continue;
            }

            savePendingRequest(
                request
            );

            break;
        }
    }

    showConnectionStatus(
        NETWORK_MESSAGE
    );

    throw (
        lastError ||
        new Error(
            "Temporary network connection issue."
        )
    );
}


/* ============================================================
   START ADA
============================================================ */

async function startAdaIntelligence() {

    if (
        intelligenceStarted
    ) {
        return;
    }

    if (
        !selectedService ||
        selectedService ===
            "Service not selected"
    ) {

        addMessage(
            "System",
            "Please return to the services and select the service you need."
        );

        return;
    }

    if (
        conversation.length > 0
    ) {

        intelligenceStarted =
            true;

        return;
    }

    if (
        getPendingRequestForCurrentJob()
    ) {

        return;
    }

    intelligenceStarted =
        true;

    try {

        const response =
            await sendToAda(

                "The customer has selected the service '" +
                selectedService +
                "'. Begin the normal conversation for this service. Welcome the customer, acknowledge the selected service, and ask only the first useful question needed to begin the work. Do not ask which service the customer wants because the service has already been selected.",

                "service_selected"
            );

        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "SERVICE ACTIVATION ERROR:",
            error
        );

        if (
            !isNetworkError(error)
        ) {

            intelligenceStarted =
                false;

            addMessage(
                "System",
                "We could not start your request at the moment. Please try again."
            );
        }
    }
}


/* ============================================================
   CUSTOMER MESSAGE
============================================================ */

async function sendMessage() {

    if (
        requestInProgress
    ) {
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    requestInProgress =
        true;

    addMessage(
        "You",
        message
    );

    input.value = "";

    button.disabled =
        true;

    button.innerText =
        "WAIT...";

    try {

        const response =
            await sendToAda(
                message,
                "customer_message"
            );

        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "CUSTOMER MESSAGE ERROR:",
            error
        );

        if (
            !isNetworkError(error)
        ) {

            addMessage(
                "System",
                "I could not complete that request right now. Please try again."
            );
        }

    } finally {

        requestInProgress =
            false;

        button.disabled =
            false;

        button.innerText =
            "SEND";
    }
}


/* ============================================================
   ENTER TO SEND
============================================================ */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

            }

    );


/* ============================================================
   REAL FILE UPLOAD
============================================================ */

function openFilePicker() {

    if (
        requestInProgress
    ) {
        return;
    }

    document
        .getElementById(
            "fileInput"
        )
        .click();
}

async function uploadFileToBackend(file) {

    const formData =
        new FormData();

    /*
       These fields keep the uploaded document tied
       to the same customer/job/service that Ada is
       already handling.
    */

    formData.append(
        "file",
        file
    );

    formData.append(
        "customer_id",
        customerId
    );

    formData.append(
        "job_id",
        currentJobId
    );

    formData.append(
        "service",
        selectedService
    );

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            function() {

                controller.abort();

            },
            60000
        );

    try {

        const response =
            await fetch(
                UPLOAD_ENDPOINT,
                {
                    method:
                        "POST",

                    body:
                        formData,

                    signal:
                        controller.signal
                }
            );

        let result = null;

        try {

            result =
                await response.json();

        } catch (error) {

            result = null;
        }

        if (
            !response.ok
        ) {

            const error =
                new Error(
                    (
                        result &&
                        (
                            result.error ||
                            result.message
                        )
                    ) ||
                    "The file could not be uploaded."
                );

            error.serverError =
                true;

            error.status =
                response.status;

            throw error;
        }

        return (
            result || {
                success: true
            }
        );

    } finally {

        clearTimeout(
            timeout
        );
    }
}

async function handleFileSelected(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    if (
        requestInProgress
    ) {

        event.target.value = "";

        return;
    }

    requestInProgress =
        true;

    addMessage(
        "You",
        "📎 Uploading: " +
        file.name
    );

    showConnectionStatus(
        "Uploading your file..."
    );

    try {

        const result =
            await uploadFileToBackend(
                file
            );

        hideConnectionStatus();

        /*
           The backend has now received the actual file.

           We tell Ada what happened through the normal
           ONE-request chat path so the conversation can
           continue naturally.
        */

        const response =
            await sendToAda(

                "The customer has successfully uploaded the file '" +
                file.name +
                "'. The uploaded file is now available to the Business Center for the active '" +
                selectedService +
                "' service. Continue the customer's request naturally. Use the uploaded document context if available. Do not ask the customer to upload the same file again.",

                "file_uploaded"
            );

        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "REAL FILE UPLOAD ERROR:",
            error
        );

        if (
            isNetworkError(error)
        ) {

            showConnectionStatus(
                NETWORK_MESSAGE
            );

        } else {

            hideConnectionStatus();

            addMessage(
                "System",
                "The file could not be uploaded. Please try again."
            );
        }

    } finally {

        requestInProgress =
            false;

        event.target.value = "";
    }
}


/* ============================================================
   VOICE
============================================================ */

function openVoice() {

    if (
        requestInProgress
    ) {
        return;
    }

    /*
       Open the existing phone/VPS voice interface.

       This preserves the established voice workflow rather
       than pretending that a voice recording has already
       been transcribed.
    */

    const voiceUrl =
        VOICE_PAGE_ENDPOINT +
        "?customer_id=" +
        encodeURIComponent(

        ) +
        "&job_id=" +
        encodeURIComponent(

        ) +
        "&service=" +
        encodeURIComponent(

    window.open(
        voiceUrl,
        "_blank"
    );
}

/* ============================================================
   COMMON BUSINESS ACTION
============================================================ */

async function performBusinessAction(
    customerMessage,
    controllerMessage,
    eventName
) {

    if (
        requestInProgress
    ) {
        return;
    }

    requestInProgress =
        true;

    addMessage(
        "You",
        customerMessage
    );

    try {

        const response =
            await sendToAda(
                controllerMessage,
                eventName
            );

        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            eventName +
            " ERROR:",
            error
        );

        if (
            !isNetworkError(error)
        ) {

            addMessage(
                "System",
                "I could not complete that step right now. Please try again."
            );
        }

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   RESUME CURRENT JOB
============================================================ */

async function resumeCurrentJobPendingRequest() {

    const request =
        getPendingRequestForCurrentJob();

    if (!request) {
        return false;
    }

    if (
        !navigator.onLine
    ) {

        showConnectionStatus(
            NETWORK_MESSAGE
        );

        return true;
    }

    requestInProgress =
        true;

    try {

        showConnectionStatus(
            "Your connection is back. Continuing your saved request..."
        );

        const result =
            await requestFastAPI(
                request
            );

        clearPendingRequest(
            request.requestId
        );

        if (
            selectedService ===
                request.service &&
            currentJobId ===
                request.jobId
        ) {

            addMessage(
                "Business Center",
                result.reply
            );
        }

        hideConnectionStatus();

        return true;

    } catch (error) {

        console.error(
            "CURRENT JOB RESUME ERROR:",
            error
        );

        if (
            error.serverError
        ) {

            clearPendingRequest(
                request.requestId
            );

            hideConnectionStatus();

            return false;
        }

        if (
            isNetworkError(error)
        ) {

            savePendingRequest(
                request
            );

            showConnectionStatus(
                NETWORK_MESSAGE
            );

            return true;
        }

        clearPendingRequest(
            request.requestId
        );

        hideConnectionStatus();

        return false;

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   OLD REQUESTS
============================================================ */

async function resumeOtherPendingRequests() {

    const requests =
        getPendingRequestList();

    for (
        const request of requests
    ) {

        if (
            request.service ===
                selectedService &&
            request.jobId ===
                currentJobId
        ) {
            continue;
        }

        if (
            !navigator.onLine
        ) {
            return;
        }

        try {

            const result =
                await requestFastAPI(
                    request
                );

            clearPendingRequest(
                request.requestId
            );

            console.log(
                "Old saved request completed:",
                request.service,
                request.jobId,
                result
            );

        } catch (error) {

            console.error(
                "OLD REQUEST RESUME ERROR:",
                error
            );

            if (
                error.serverError ||
                !isNetworkError(error)
            ) {

                clearPendingRequest(
                    request.requestId
                );
            }
        }
    }
}


/* ============================================================
   STARTUP
============================================================ */

async function initialiseWorkspace() {

    loadPendingRequests();

    cleanInvalidPendingRequests();

    getSelectedService();

    restoreConversationToScreen();

    const resumed =
        await resumeCurrentJobPendingRequest();

    if (resumed) {

        intelligenceStarted =
            true;

    } else if (
        conversation.length > 0
    ) {

        intelligenceStarted =
            true;

    } else {

        intelligenceStarted =
            false;

        await startAdaIntelligence();
    }

    setTimeout(
        function() {

            resumeOtherPendingRequests();

        },
        1500
    );
}


/* ============================================================
   NETWORK RESTORED
============================================================ */

window.addEventListener(
    "online",
    function() {

        showConnectionStatus(
            "Connection restored. Continuing saved work..."
        );

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            setTimeout(
                async function() {

                    const resumed =
                        await resumeCurrentJobPendingRequest();

                    if (!resumed) {
                        hideConnectionStatus();
                    }

                    resumeOtherPendingRequests();

                },
                1200
            );
    }
);


/* ============================================================
   NETWORK LOST
============================================================ */

window.addEventListener(
    "offline",
    function() {

        showConnectionStatus(
            NETWORK_MESSAGE
        );
    }
);


/* ============================================================
   PERIODIC RECOVERY
============================================================ */

setInterval(
    function() {

        if (
            navigator.onLine &&
            !requestInProgress &&
            getPendingRequestForCurrentJob()
        ) {

            resumeCurrentJobPendingRequest();
        }

    },
    15000
);


/* ============================================================
   SAVE
============================================================ */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
                "hidden"
        ) {

            saveConversation();

            saveCurrentJob();

            savePendingRequests();
        }
    }
);

window.addEventListener(
    "beforeunload",
    function() {

        saveConversation();

        saveCurrentJob();

        savePendingRequests();
    }
);


/* ============================================================
   START
============================================================ */

initialiseWorkspace();

</script>
