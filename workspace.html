<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            padding:
                max(8px, env(safe-area-inset-top))
                8px
                max(8px, env(safe-area-inset-bottom))
                8px;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .workspace {
            width: 100%;
            max-width: 700px;
            height: 100%;
            min-height: 0;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =====================================================
           FIXED TOP
        ===================================================== */

        .header {
            flex: 0 0 auto;

            background: #171717;

            border-radius: 6px;

            padding: 10px 11px;

            margin-bottom: 6px;

            border-bottom: 2px solid #FFFFFF;
        }

        .brand {
            font-size: 17px;
            font-weight: bold;
        }

        .selected-service {
            margin-top: 7px;

            background: #0B0B0B;

            border: 1px solid #444444;

            border-radius: 5px;

            padding: 7px 9px;
        }

        .selected-service-label {
            color: #AAAAAA;

            font-size: 9px;

            margin-bottom: 2px;
        }

        .selected-service-name {
            color: white;

            font-size: 14px;

            font-weight: bold;

            overflow-wrap: anywhere;
        }

        .service-price {
            margin-top: 6px;

            color: white;

            font-size: 12px;

            font-weight: bold;
        }


        /* =====================================================
           NETWORK STATUS
        ===================================================== */

        .connection-status {
            display: none;

            flex: 0 0 auto;

            width: 100%;

            margin-bottom: 5px;

            padding: 7px 9px;

            border-radius: 5px;

            background: #242424;

            border: 1px solid #444444;

            color: white;

            font-size: 10px;

            line-height: 1.35;

            text-align: center;
        }

        .connection-status.show {
            display: block;
        }


        /* =====================================================
           CHAT AREA
           ONLY THIS AREA SCROLLS
        ===================================================== */

        .chat-area {
            flex: 1 1 auto;

            min-height: 0;

            width: 100%;

            background: #171717;

            border-radius: 6px;

            padding: 12px;

            overflow-y: auto;

            overflow-x: hidden;

            border: 1px solid #292929;

            -webkit-overflow-scrolling: touch;
        }

        .message {
            width: 100%;

            margin-bottom: 13px;

            display: flex;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.you {
            justify-content: flex-end;
        }

        .bubble {
            display: inline-block;

            max-width: 92%;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .message.ada .bubble {
            background: #242424;

            color: white;

            border-bottom-left-radius: 2px;
        }

        .message.you .bubble {
            background: #111111;

            color: white;

            border: 1px solid #444444;

            border-bottom-right-radius: 2px;
        }


        /* =====================================================
           FIXED ACTION BUTTONS
        ===================================================== */

        .actions {
            flex: 0 0 auto;

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 5px;

            margin-top: 6px;
        }

        .action-button {
            width: 100%;

            min-width: 0;

            min-height: 40px;

            border: 1px solid #444444;

            border-radius: 5px;

            padding: 7px 5px;

            background: #000000;

            color: white;

            font-size: 10px;

            font-weight: bold;

            line-height: 1.15;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .action-button:hover {
            background: #171717;
        }

        .action-button:active {
            background: #242424;

            transform: scale(0.98);
        }

        .action-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =====================================================
           FIXED MESSAGE INPUT
        ===================================================== */

        .input-area {
            flex: 0 0 auto;

            width: 100%;

            margin-top: 6px;

            display: flex;

            gap: 5px;
        }

        .message-input {
            flex: 1 1 auto;

            min-width: 0;

            min-height: 44px;

            max-height: 90px;

            resize: none;

            background: white;

            color: black;

            border: none;

            border-radius: 5px;

            padding: 10px;

            font-size: 13px;

            outline: none;
        }

        .send-button {
            flex: 0 0 76px;

            min-height: 44px;

            border: 1px solid #444444;

            border-radius: 5px;

            background: #000000;

            color: white;

            font-size: 10px;

            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .send-button:hover {
            background: #171717;
        }

        .send-button:active {
            background: #242424;

            transform: scale(0.98);
        }

        .send-button:disabled {
            opacity: 0.5;
        }

        #fileInput {
            display: none;
        }


        /* =====================================================
           FIXED FOOTER
        ===================================================== */

        .footer {
            flex: 0 0 auto;

            text-align: center;

            color: #777777;

            font-size: 9px;

            line-height: 1.3;

            padding-top: 5px;
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 6px;

                padding-right: 6px;
            }

            .header {
                padding: 8px 9px;
            }

            .brand {
                font-size: 15px;
            }

            .selected-service {
                padding: 6px 8px;
            }

            .selected-service-name {
                font-size: 13px;
            }

            .chat-area {
                padding: 9px;
            }

            .bubble {
                font-size: 12px;

                padding: 9px 10px;
            }

            .actions {
                gap: 4px;
            }

            .action-button {
                min-height: 37px;

                font-size: 9px;

                padding: 5px 3px;
            }

            .message-input {
                min-height: 42px;

                font-size: 12px;
            }

            .send-button {
                flex-basis: 68px;

                min-height: 42px;
            }

            .footer {
                font-size: 8px;
            }
        }


        /* =====================================================
           LARGER PHONES / TABLETS
        ===================================================== */

        @media (min-width: 600px) {

            .page {
                padding-left: 16px;

                padding-right: 16px;
            }

            .actions {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 6px;
            }

            .action-button {
                min-height: 42px;

                font-size: 11px;
            }
        }

    </style>
</head>


<body>

<div class="page">

    <main class="workspace">


        <!-- =================================================
             FIXED TOP
        ================================================== -->

        <section class="header">

            <div class="brand">
                NAIJA POCKET BUSINESS CENTER
            </div>

            <div class="selected-service">

                <div class="selected-service-label">
                    SELECTED SERVICE
                </div>

                <div
                    id="selectedService"
                    class="selected-service-name"
                >
                    Loading service...
                </div>

                <div
                    id="servicePrice"
                    class="service-price"
                ></div>

            </div>

        </section>


        <!-- =================================================
             NETWORK STATUS
        ================================================== -->

        <div
            id="connectionStatus"
            class="connection-status"
        ></div>


        <!-- =================================================
             MIDDLE
             ONLY THIS AREA SCROLLS
        ================================================== -->

        <section
            id="chatArea"
            class="chat-area"
        ></section>


        <!-- =================================================
             FIXED ACTION BUTTONS
        ================================================== -->

        <section class="actions">

            <button
                type="button"
                class="action-button upload-button"
                onclick="openFilePicker()"
            >
                📎 Upload
            </button>

            <button
                type="button"
                class="action-button voice-button"
                onclick="openVoice()"
            >
                🎤 Voice
            </button>

            <button
                type="button"
                class="action-button review-button"
                onclick="reviewDocument()"
            >
                🔍 Review
            </button>

            <button
                type="button"
                class="action-button approve-button"
                onclick="approveDocument()"
            >
                ✅ Approve
            </button>

            <button
                type="button"
                class="action-button payment-button"
                onclick="openPayment()"
            >
                💳 Payment &amp; Download
            </button>

            <button
                type="button"
                class="action-button customer-service-button"
                onclick="contactCustomerService()"
            >
                🆘 Customer Service
            </button>

        </section>


        <!-- =================================================
             FIXED MESSAGE INPUT
        ================================================== -->

        <section class="input-area">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Write your message here..."
                rows="2"
            ></textarea>

            <button
                type="button"
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
            >
                SEND
            </button>

        </section>


        <input
            type="file"
            id="fileInput"
            accept=".pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.webp"
            onchange="handleFileSelected(event)"
        >


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">
            Naija Pocket Business Center<br>
            Your Business Center In Your Pocket
        </div>

    </main>

</div>


<script>

/* ============================================================
   CUSTOMER / JOB IDENTITY
============================================================ */

/*
   This ID belongs to this browser.

   It is created once and reused.

   It is NOT the service ID.

   It identifies the browser/customer session so the backend
   can later associate saved work with the same customer.
*/

const CUSTOMER_ID_KEY =
    "naijaPocketCustomerId";


function createPersistentId(prefix) {

    return (
        prefix +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 12)
    );
}


function getCustomerId() {

    let customerId =
        localStorage.getItem(
            CUSTOMER_ID_KEY
        );

    if (!customerId) {

        customerId =
            createPersistentId(
                "customer"
            );

        localStorage.setItem(
            CUSTOMER_ID_KEY,
            customerId
        );
    }

    return customerId;
}


const customerId =
    getCustomerId();


/* ============================================================
   CORE STATE
============================================================ */

let selectedService = "";

let currentJobId = "";

let intelligenceStarted = false;

let requestInProgress = false;

let reconnectTimer = null;

let pendingRequests = {};

let conversation = [];


/* ============================================================
   STORAGE KEYS
============================================================ */

const CONVERSATION_PREFIX =
    "naijaPocketConversation:";

const JOB_PREFIX =
    "naijaPocketJob:";

const SERVICE_KEY =
    "selectedService";

const PENDING_KEY =
    "naijaPocketPendingRequests";

const CUSTOMER_KEY =
    "naijaPocketCustomerId";


/* ============================================================
   CONNECTION STATUS
============================================================ */

const NETWORK_MESSAGE =
    "There is a temporary network connection issue. Your current request is being kept safely. We will continue it when the connection is available.";


/* ============================================================
   SERVICE NORMALISATION
============================================================ */

function normaliseService(
    service
) {

    return String(
        service || ""
    ).trim();
}


function createJobId(
    service
) {

    return (
        "job-" +
        encodeURIComponent(
            normaliseService(
                service
            )
        ) +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );
}


/* ============================================================
   JOB STORAGE KEY
============================================================ */

function getJobStorageKey(
    service
) {

    return (
        JOB_PREFIX +
        customerId +
        ":" +
        encodeURIComponent(
            normaliseService(
                service
            )
        )
    );
}


/* ============================================================
   CONVERSATION STORAGE KEY
============================================================ */

function getConversationStorageKey(
    service
) {

    return (
        CONVERSATION_PREFIX +
        customerId +
        ":" +
        encodeURIComponent(
            normaliseService(
                service
            )
        )
    );
}


/* ============================================================
   LOAD SAVED WORK
============================================================ */

function loadSavedWork() {

    /*
       Load all pending requests.
    */

    try {

        const savedPending =
            localStorage.getItem(
                PENDING_KEY
            );

        if (savedPending) {

            const parsed =
                JSON.parse(
                    savedPending
                );

            if (
                parsed &&
                typeof parsed === "object"
            ) {

                pendingRequests =
                    parsed;

            } else {

                pendingRequests = {};
            }

        } else {

            pendingRequests = {};
        }

    } catch (error) {

        console.error(
            "Pending request restore error:",
            error
        );

        pendingRequests = {};
    }


    /*
       The currently selected service gets its own
       conversation.
    */

    loadConversationForService(
        selectedService
    );
}


/* ============================================================
   LOAD CONVERSATION FOR CURRENT SERVICE
============================================================ */

function loadConversationForService(
    service
) {

    conversation = [];

    const key =
        getConversationStorageKey(
            service
        );

    try {

        const saved =
            localStorage.getItem(
                key
            );

        if (saved) {

            const parsed =
                JSON.parse(
                    saved
                );

            if (
                Array.isArray(parsed)
            ) {

                conversation =
                    parsed;
            }
        }

    } catch (error) {

        console.error(
            "Conversation restore error:",
            error
        );

        conversation = [];
    }
}


/* ============================================================
   SAVE COMPLETE CONVERSATION
============================================================ */

function saveConversation() {

    try {

        localStorage.setItem(

            getConversationStorageKey(
                selectedService
            ),

            JSON.stringify(
                conversation
            )
        );

    } catch (error) {

        console.error(
            "Conversation save error:",
            error
        );
    }
}


/* ============================================================
   SAVE PENDING REQUESTS
============================================================ */

function savePendingRequests() {

    try {

        localStorage.setItem(
            PENDING_KEY,
            JSON.stringify(
                pendingRequests
            )
        );

    } catch (error) {

        console.error(
            "Pending requests save error:",
            error
        );
    }
}


/* ============================================================
   SAVE ONE PENDING REQUEST
============================================================ */

function savePendingRequest(
    request
) {

    if (
        !request ||
        !request.requestId
    ) {

        return;
    }


    pendingRequests[
        request.requestId
    ] = request;


    savePendingRequests();
}


/* ============================================================
   REMOVE ONE PENDING REQUEST
============================================================ */

function clearPendingRequest(
    requestId
) {

    if (!requestId) {

        return;
    }


    delete pendingRequests[
        requestId
    ];


    savePendingRequests();
}


/* ============================================================
   GET PENDING REQUESTS
============================================================ */

function getPendingRequestList() {

    return Object.values(
        pendingRequests
    ).filter(
        function(request) {

            return (
                request &&
                request.requestId &&
                request.message !== undefined
            );
        }
    );
}


/* ============================================================
   GET PENDING REQUEST FOR CURRENT JOB
============================================================ */

function getPendingRequestForCurrentJob() {

    const requests =
        getPendingRequestList();

    for (
        const request of requests
    ) {

        if (
            request.customerId ===
                customerId &&

            request.service ===
                selectedService &&

            request.jobId ===
                currentJobId
        ) {

            return request;
        }
    }

    return null;
}


/* ============================================================
   DISPLAY SAVED CONVERSATION
============================================================ */

function restoreConversationToScreen() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    chatArea.innerHTML = "";


    for (
        const item of conversation
    ) {

        renderMessage(
            item.sender,
            item.message,
            false
        );
    }


    scrollChatToBottom();
}


/* ============================================================
   RENDER MESSAGE
============================================================ */

function renderMessage(
    sender,
    message,
    save = true
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            sender === "You"
                ? "you"
                : "ada"
        );


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.innerText =
        message;


    wrapper.appendChild(
        bubble
    );

    chatArea.appendChild(
        wrapper
    );


    if (save) {

        conversation.push({

            sender:
                sender,

            message:
                message,

            timestamp:
                Date.now()
        });

        saveConversation();
    }


    scrollChatToBottom();
}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    sender,
    message
) {

    renderMessage(
        sender,
        message,
        true
    );
}


/* ============================================================
   SCROLL CHAT ONLY
============================================================ */

function scrollChatToBottom() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    requestAnimationFrame(
        function() {

            chatArea.scrollTop =
                chatArea.scrollHeight;
        }
    );
}


/* ============================================================
   GET SERVICE
============================================================ */

function getSelectedService() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    selectedService =
        normaliseService(
            params.get("service")
        );


    if (!selectedService) {

        selectedService =
            normaliseService(
                localStorage.getItem(
                    SERVICE_KEY
                )
            );
    }


    if (!selectedService) {

        selectedService =
            "Service not selected";
    }


    document.getElementById(
        "selectedService"
    ).innerText =
        selectedService;


    localStorage.setItem(
        SERVICE_KEY,
        selectedService
    );


    /*
       Load the correct service conversation.
    */

    loadConversationForService(
        selectedService
    );


    /*
       Load or create the correct job for this
       customer + service.
    */

    loadOrCreateCurrentJob();
}


/* ============================================================
   LOAD OR CREATE CURRENT JOB
============================================================ */

function loadOrCreateCurrentJob() {

    const key =
        getJobStorageKey(
            selectedService
        );


    try {

        const savedJob =
            localStorage.getItem(
                key
            );


        if (savedJob) {

            const parsed =
                JSON.parse(
                    savedJob
                );


            if (
                parsed &&
                parsed.jobId &&
                parsed.service ===
                    selectedService
            ) {

                currentJobId =
                    parsed.jobId;

                return;
            }
        }

    } catch (error) {

        console.error(
            "Job restore error:",
            error
        );
    }


    currentJobId =
        createJobId(
            selectedService
        );


    saveCurrentJob();
}


/* ============================================================
   SAVE CURRENT JOB
============================================================ */

function saveCurrentJob() {

    try {

        localStorage.setItem(

            getJobStorageKey(
                selectedService
            ),

            JSON.stringify({

                customerId:
                    customerId,

                jobId:
                    currentJobId,

                service:
                    selectedService,

                updatedAt:
                    Date.now()

            })
        );

    } catch (error) {

        console.error(
            "Job save error:",
            error
        );
    }
}


/* ============================================================
   CONNECTION STATUS
============================================================ */

function showConnectionStatus(
    message
) {

    const status =
        document.getElementById(
            "connectionStatus"
        );


    status.innerText =
        message;


    status.classList.add(
        "show"
    );
}


function hideConnectionStatus() {

    const status =
        document.getElementById(
            "connectionStatus"
        );


    status.classList.remove(
        "show"
    );


    status.innerText = "";
}


/* ============================================================
   REQUEST ID
============================================================ */

function createRequestId() {

    return (
        "request-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );
}


/* ============================================================
   CREATE COMPLETE REQUEST OBJECT
============================================================ */

function createRequest(
    message,
    eventName
) {

    return {

        requestId:
            createRequestId(),

        customerId:
            customerId,

        jobId:
            currentJobId,

        service:
            selectedService,

        message:
            message,

        event:
            eventName,

        createdAt:
            Date.now(),

        attempts:
            0
    };
}


/* ============================================================
   NETWORK ERROR CHECK
============================================================ */

function isNetworkError(
    error
) {

    if (!error) {

        return false;
    }


    if (
        error.name ===
        "AbortError"
    ) {

        return true;
    }


    if (
        error instanceof
        TypeError
    ) {

        return true;
    }


    const text =
        String(
            error.message || ""
        ).toLowerCase();


    return (

        text.includes(
            "network"
        ) ||

        text.includes(
            "failed to fetch"
        ) ||

        text.includes(
            "fetch"
        ) ||

        text.includes(
            "connection"
        ) ||

        text.includes(
            "timeout"
        ) ||

        text.includes(
            "offline"
        )
    );
}


/* ============================================================
   WAIT
============================================================ */

function wait(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );
        }
    );
}


/* ============================================================
   RAW FASTAPI REQUEST
============================================================ */

async function requestFastAPI(
    request
) {

    const abortController =
        new AbortController();


    const timeout =
        setTimeout(
            function() {

                abortController.abort();

            },
            30000
        );


    try {

        /*
           VERY IMPORTANT:

           Use the service stored INSIDE the request.

           Never use the current page's selectedService here.

           This prevents Service A from accidentally being
           submitted as Service B after the customer switches.
        */

        const response =
            await fetch(

                "https://naija-pocket-business-center.onrender.com/api/chat",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                request.message,

                            service:
                                request.service,

                            event:
                                request.event,

                            customer_id:
                                request.customerId,

                            job_id:
                                request.jobId,

                            client_request_id:
                                request.requestId,

                            activate_intelligence:
                                true

                        }),

                    signal:
                        abortController.signal
                }
            );


        let result;


        try {

            result =
                await response.json();

        } catch (error) {

            const invalidResponse =
                new Error(
                    "Server returned an invalid response."
                );

            invalidResponse.serverError =
                !response.ok;

            invalidResponse.status =
                response.status;

            throw invalidResponse;
        }


        /* ====================================================
           SERVICE PRICE
        ==================================================== */

        if (
            result &&
            result.price !== undefined
        ) {

            const price =
                String(
                    result.price
                );


            document.getElementById(
                "servicePrice"
            ).innerText =

                price.includes("₦")

                    ? "SERVICE PRICE: " +
                      price

                    : "SERVICE PRICE: ₦" +
                      price;
        }


        /* ====================================================
           SUCCESS
        ==================================================== */

        if (
            response.ok &&
            result &&
            result.success
        ) {

            return {

                reply:
                    result.reply ||
                    result.response ||
                    result.message ||
                    "Your request is ready to continue.",

                result:
                    result
            };
        }


        /* ====================================================
           SERVER ERROR
        ==================================================== */

        const serverError =
            (
                result &&
                (
                    result.error ||
                    result.message
                )
            ) ||

            "The Business Center could not process the request.";


        const error =
            new Error(
                serverError
            );


        error.serverError =
            true;


        error.status =
            response.status;


        throw error;

    } finally {

        clearTimeout(
            timeout
        );
    }
}


/* ============================================================
   SEND TO ADA
============================================================ */

async function sendToAda(
    message,
    eventName
) {

    /*
       The request captures the CURRENT service and job.

       Once created, it never changes even if the customer
       navigates to another service.
    */

    const request =
        createRequest(
            message,
            eventName
        );


    savePendingRequest(
        request
    );


    const retryDelays = [

        1500,
        3000,
        6000,
        10000

    ];


    let lastError =
        null;


    for (
        let attempt = 0;
        attempt <= retryDelays.length;
        attempt++
    ) {

        try {

            if (
                !navigator.onLine
            ) {

                throw new TypeError(
                    "Network is currently offline."
                );
            }


            request.attempts =
                attempt + 1;


            savePendingRequest(
                request
            );


            if (
                attempt > 0
            ) {

                showConnectionStatus(
                    "Reconnecting and continuing your request..."
                );
            }


            const result =
                await requestFastAPI(
                    request
                );


            /*
               SUCCESS.

               Remove only THIS request.
            */

            clearPendingRequest(
                request.requestId
            );


            hideConnectionStatus();


            return result.reply;

        } catch (error) {

            lastError =
                error;


            console.error(
                "Business Center request attempt " +
                (attempt + 1) +
                " failed:",
                error
            );


            /*
               Real server errors are not blindly retried.
            */

            if (
                error.serverError
            ) {

                break;
            }


            /*
               Temporary network problem.
            */

            if (
                attempt <
                retryDelays.length
            ) {

                showConnectionStatus(
                    "Reconnecting..."
                );


                await wait(
                    retryDelays[
                        attempt
                    ]
                );


                continue;
            }
        }
    }


    /*
       IMPORTANT:

       The request remains inside pendingRequests.

       It has NOT been deleted.

       Therefore network recovery can resume this exact
       request later.
    */

    showConnectionStatus(
        NETWORK_MESSAGE
    );


    throw (
        lastError ||
        new Error(
            "Temporary network connection issue."
        )
    );
}


/* ============================================================
   AUTOMATIC SERVICE ACTIVATION
============================================================ */

async function startAdaIntelligence() {

    if (
        intelligenceStarted
    ) {

        return;
    }


    intelligenceStarted =
        true;


    if (
        !selectedService ||
        selectedService ===
        "Service not selected"
    ) {

        addMessage(
            "Business Center",
            "Please return to the services and select the service you need."
        );

        return;
    }


    /*
       Existing conversation means this service/job has
       already started.

       Do not send another service-selection message.
    */

    if (
        conversation.length > 0
    ) {

        return;
    }


    /*
       If THIS service has a pending request, let the
       pending-resume system handle it.
    */

    if (
        getPendingRequestForCurrentJob()
    ) {

        return;
    }


    try {

        const response =
            await sendToAda(

                "The customer has selected the service '" +
                selectedService +
                "'. Begin the normal conversation for this service. Welcome the customer, acknowledge the selected service, and ask only the first useful question needed to begin the work. Do not ask which service the customer wants because the service has already been selected.",

                "service_selected"
            );


        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "SERVICE ACTIVATION ERROR:",
            error
        );


        if (
            !isNetworkError(
                error
            )
        ) {

            addMessage(
                "Business Center",
                "We could not complete that request at the moment. Please try again shortly."
            );
        }
    }
}


/* ============================================================
   CUSTOMER MESSAGE
============================================================ */

async function sendMessage() {

    if (
        requestInProgress
    ) {

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    requestInProgress =
        true;


    /*
       Save the message immediately.

       It belongs to the CURRENT service and therefore
       the CURRENT job.
    */

    addMessage(
        "You",
        message
    );


    input.value = "";


    sendButton.disabled =
        true;


    sendButton.innerText =
        "WAIT...";


    try {

        const response =
            await sendToAda(

                message,

                "customer_message"

            );


        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "CUSTOMER MESSAGE ERROR:",
            error
        );


        /*
           Do NOT add the embarrassing network message
           into the actual conversation.

           The status bar handles temporary connectivity.
        */

        if (
            !isNetworkError(
                error
            )
        ) {

            addMessage(
                "Business Center",
                "I could not complete that request right now. Please try again shortly."
            );
        }

    } finally {

        requestInProgress =
            false;


        sendButton.disabled =
            false;


        sendButton.innerText =
            "SEND";
    }
}

/* ============================================================
   RESUME ONE SAVED REQUEST
============================================================ */

async function resumePendingRequest(
    request
) {

    if (!request) {

        return;
    }


    if (
        request.customerId !==
        customerId
    ) {

        return;
    }


    /*
       The request must be resumed using the service/job
       stored in the request.

       It does NOT matter what service the customer is
       currently looking at.
    */

    if (
        !navigator.onLine
    ) {

        showConnectionStatus(
            NETWORK_MESSAGE
        );

        return;
    }


    try {

        showConnectionStatus(
            "Your connection is back. Continuing your saved request..."
        );


        const result =
            await requestFastAPI(
                request
            );


        /*
           Only clear THIS request after successful
           completion.
        */

        clearPendingRequest(
            request.requestId
        );


        /*
           Only show the reply if the customer is still
           viewing the same service/job.

           If they have moved elsewhere, the result remains
           saved and is not incorrectly inserted into the
           new service's conversation.
        */

        if (
            selectedService ===
                request.service &&

            currentJobId ===
                request.jobId
        ) {

            addMessage(
                "Business Center",
                result.reply
            );

            hideConnectionStatus();

        } else {

            hideConnectionStatus();

            console.log(
                "Saved request completed for another service/job:",
                request.service,
                request.jobId
            );
        }

    } catch (error) {

        console.error(
            "PENDING REQUEST RESUME ERROR:",
            error
        );


        /*
           Keep the pending request for a temporary
           network failure.
        */

        if (
            isNetworkError(
                error
            )
        ) {

            showConnectionStatus(
                NETWORK_MESSAGE
            );

            return;
        }


        /*
           A genuine server/application error should not
           be endlessly retried by the browser.

           Keep the work record but remove this network
           retry entry.
        */

        clearPendingRequest(
            request.requestId
        );


        if (
            selectedService ===
                request.service &&

            currentJobId ===
                request.jobId
        ) {

            addMessage(
                "Business Center",
                "I could not complete that saved request right now. Please try again shortly."
            );
        }

    }
}


/* ============================================================
   RESUME SAVED WORK
============================================================ */

async function resumeSavedWork() {

    if (
        requestInProgress
    ) {

        return;
    }


    if (
        !navigator.onLine
    ) {

        showConnectionStatus(
            NETWORK_MESSAGE
        );

        return;
    }


    const requests =
        getPendingRequestList();


    if (
        requests.length === 0
    ) {

        hideConnectionStatus();

        return;
    }


    requestInProgress =
        true;


    try {

        /*
           Resume each saved request individually.

           Each request carries its own:

           customerId
           jobId
           service
           message
           event
           requestId
        */

        for (
            const request of requests
        ) {

            if (
                !navigator.onLine
            ) {

                break;
            }


            await resumePendingRequest(
                request
            );
        }

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   NETWORK RETURNS
============================================================ */

window.addEventListener(
    "online",
    function() {

        showConnectionStatus(
            "Connection restored. Continuing saved work..."
        );


        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                function() {

                    resumeSavedWork();

                },
                1200
            );
    }
);


/* ============================================================
   NETWORK GOES OFFLINE
============================================================ */

window.addEventListener(
    "offline",
    function() {

        showConnectionStatus(
            NETWORK_MESSAGE
        );
    }
);


/* ============================================================
   PERIODIC CONNECTION CHECK
============================================================ */

setInterval(
    function() {

        if (
            getPendingRequestList()
                .length > 0 &&

            navigator.onLine &&

            !requestInProgress
        ) {

            resumeSavedWork();
        }

    },
    15000
);


/* ============================================================
   SAVE BEFORE PAGE IS HIDDEN
============================================================ */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            saveConversation();

            saveCurrentJob();

            savePendingRequests();
        }
    }
);


/* ============================================================
   BEFORE PAGE UNLOAD
============================================================ */

window.addEventListener(
    "beforeunload",
    function() {

        saveConversation();

        saveCurrentJob();

        savePendingRequests();
    }
);


/* ============================================================
   START WORKSPACE
============================================================ */

getSelectedService();

loadSavedWork();

restoreConversationToScreen();


/*
   If there are pending requests, attempt to resume them.

   Otherwise start Ada for a brand-new service.
*/

if (
    getPendingRequestList()
        .length > 0
) {

    intelligenceStarted =
        true;


    if (
        navigator.onLine
    ) {

        setTimeout(
            function() {

                resumeSavedWork();

            },
            1000
        );

    } else {

        showConnectionStatus(
            NETWORK_MESSAGE
        );
    }

} else {

    startAdaIntelligence();
}
