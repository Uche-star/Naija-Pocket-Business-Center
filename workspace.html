<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Naija Pocket Business Center</title><style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
    }

    body {
        display: flex;

    }

    .header {

        background: #000;

    .brand {

    .service-title {

    .workspace {

        padding: 14px 12px 10px;

    }

    .assistant .bubble {

    .attachment-card {

    .attachment-card.visible {

    .attachment-name {

    }

    .attachment-status {

        font-size: 12px;

    }

    .input-area {

    .input-row {

    }

    .message-input {
        flex: 1;
        min-width: 0;
        min-height: 43px;
        max-height: 110px;

        border: 1px solid #363636;
        border-radius: 11px;
        background: #181818;
        color: #fff;
        padding: 11px 12px;
        font-family: Inter, Arial, sans-serif;
        font-size: 15px;
        outline: none;
    }

    .message-input:focus {
        border-color: #555;
    }

    .send-button {
        flex: 0 0 auto;
        min-height: 43px;
        border: 0;
        border-radius: 11px;
        padding: 0 16px;
        background: #d4af37;
        color: #000;
        font-size: 14px;
        font-weight: 800;

    }

    .send-button:disabled {
        opacity: .5;
    }

    .actions {
        flex: 0 0 auto;
        background: #000;
        border-top: 1px solid #292929;
        padding: 8px 9px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    .action-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
    }

    .action-button {
        min-height: 40px;
        border: 1px solid #3a3a3a;
        border-radius: 9px;
        background: #111;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        padding: 6px 4px;
    }

    .action-button:active {
        background: #262626;
    }

    .action-button:disabled {
        opacity: .45;
    }

    .back-button {
        background: #9b1c1c;
        border-color: #b52a2a;
    }

    .hidden-input {
        display: none;
    }

    .voice-panel {
        display: none;
        position: fixed;
        z-index: 1000;
        inset: 0;
        background: rgba(0, 0, 0, .92);
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .voice-panel.visible {
        display: flex;
    }

    .voice-box {
        width: 100%;
        max-width: 420px;
        background: #181818;
        border: 1px solid #3a3a3a;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
    }

    .voice-title {
        color: #d4af37;
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .voice-status {
        color: #bbb;
        font-size: 14px;
        line-height: 1.4;
        min-height: 42px;
        margin-bottom: 15px;
    }

    .voice-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .voice-button {
        min-height: 44px;
        border: 1px solid #3c3c3c;
        border-radius: 10px;
        background: #101010;
        color: #fff;
        font-weight: 700;
    }

    .voice-button.recording {
        background: #8e1b1b;
    }

    .voice-button.send {
        background: #d4af37;
        color: #000;
    }

    .voice-close {
        width: 100%;
        margin-top: 9px;
        min-height: 42px;
        border: 0;
        border-radius: 10px;
        background: #333;
        color: #fff;
        font-weight: 700;
    }

    .audio-preview {
        width: 100%;
        margin: 8px 0 12px;
        display: none;
    }

    @media (max-width: 390px) {
        .brand {
            font-size: 18px;
        }

        .service-title {
            font-size: 14px;
        }

        .bubble {
            max-width: 92%;
            font-size: 14px;
        }

        .action-grid {
            gap: 5px;
        }

        .action-button {
            font-size: 11px;
            min-height: 38px;
        }

        .send-button {
            padding: 0 12px;
        }
    }
</style>

</main><input

<section id="voicePanel" class="voice-panel"><div class="voice-box">

</section><script>
"use strict";

/* ==================================================
   SESSION
   ================================================== */

const params = new URLSearchParams(
    window.location.search
);

function cleanValue(value) {
    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    const text = String(value).trim();

    if (!text) {
        return "";
    }

    if (
        ["null", "undefined", "none", "unknown"]
            .includes(text.toLowerCase())
    ) {
        return "";
    }

    return text;
}

function cryptoRandomId() {
    if (
        window.crypto &&
        window.crypto.randomUUID
    ) {
        return window.crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2)
    );
}

let selectedService = cleanValue(
    params.get("service")
);

let customerId = cleanValue(
    params.get("customer_id")
);

let jobId = cleanValue(
    params.get("job_id")
);

let clientRequestId = cleanValue(
    params.get("client_request_id")
);

if (!customerId) {
    customerId =
        localStorage.getItem("npbc_customer_id") ||
        "customer_" + cryptoRandomId();

    localStorage.setItem(
        "npbc_customer_id",
        customerId
    );
}

if (!jobId) {
    jobId =
        sessionStorage.getItem("npbc_job_id") ||
        "job_" + cryptoRandomId();

    sessionStorage.setItem(
        "npbc_job_id",
        jobId
    );
}

if (!clientRequestId) {
    clientRequestId =
        sessionStorage.getItem(
            "npbc_client_request_id"
        ) ||
        "request_" + cryptoRandomId();

    sessionStorage.setItem(
        "npbc_client_request_id",
        clientRequestId
    );
}

/* ==================================================
   DOM
   ================================================== */

const conversation =
    document.getElementById("conversation");

const serviceTitle =
    document.getElementById("serviceTitle");

const statusLine =
    document.getElementById("statusLine");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const documentInput =
    document.getElementById("documentInput");

const cameraInput =
    document.getElementById("cameraInput");

const attachmentCard =
    document.getElementById("attachmentCard");

const attachmentName =
    document.getElementById("attachmentName");

const attachmentStatus =
    document.getElementById("attachmentStatus");

const voicePanel =
    document.getElementById("voicePanel");

const voiceStatus =
    document.getElementById("voiceStatus");

const audioPreview =
    document.getElementById("audioPreview");

const recordButton =
    document.getElementById("recordButton");

const stopRecordButton =
    document.getElementById("stopRecordButton");

const sendVoiceButton =
    document.getElementById("sendVoiceButton");

const againVoiceButton =
    document.getElementById("againVoiceButton");

serviceTitle.textContent =
    selectedService ||
    "Business Center Service";

/* ==================================================
   CHAT DISPLAY
   ================================================== */

function addMessage(text, type) {
    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (
            type === "customer"
                ? "customer"
                : "assistant"
        );

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent =
        String(text || "");

    wrapper.appendChild(bubble);
    conversation.appendChild(wrapper);

    conversation.scrollTop =
        conversation.scrollHeight;
}

function addSystemMessage(text) {
    const element =
        document.createElement("div");

    element.className =
        "system-message";

    element.textContent = text;

    conversation.appendChild(element);

    conversation.scrollTop =
        conversation.scrollHeight;
}

/* ==================================================
   DIAGNOSTICS
   ================================================== */

function addDiagnosticMessage(
    result,
    httpStatus = null
) {
    const diagnostic =
        result &&
        result.diagnostic
            ? result.diagnostic
            : null;

    const element =
        document.createElement("div");

    element.className =
        "diagnostic-message";

    const title =
        document.createElement("div");

    title.className =
        "diagnostic-title";

    title.textContent =
        "ADA DIAGNOSTIC ERROR";

    element.appendChild(title);

    const diagnosticData = {
        http_status: httpStatus,

        stage:
            diagnostic &&
            diagnostic.stage
                ? diagnostic.stage
                : "unknown",

        error_type:
            diagnostic &&
            diagnostic.error_type
                ? diagnostic.error_type
                : "unknown",

        error:
            diagnostic &&
            diagnostic.error
                ? diagnostic.error
                : "No diagnostic error was returned.",

        controller:
            diagnostic &&
            diagnostic.controller
                ? diagnostic.controller
                : null,

        session:
            diagnostic &&
            diagnostic.session
                ? diagnostic.session
                : result &&
                  result.session_id
                    ? result.session_id
                    : null,

        service:
            diagnostic &&
            diagnostic.service
                ? diagnostic.service
                : result &&
                  result.service
                    ? result.service
                    : null,

        traceback:
            diagnostic &&
            diagnostic.traceback
                ? diagnostic.traceback
                : null
    };

    element.appendChild(
        document.createTextNode(
            JSON.stringify(
                diagnosticData,
                null,
                2
            )
        )
    );

    conversation.appendChild(element);

    conversation.scrollTop =
        conversation.scrollHeight;

    console.error(
        "ADA DIAGNOSTIC RESPONSE:",
        diagnosticData
    );
}

/* ==================================================
   STATUS
   ================================================== */

function setStatus(text) {
    statusLine.textContent = text;
}

/* ==================================================
   ADA API
   ================================================== */

async function sendToIntelligence(
    message,
    eventName = null
) {
    const payload = {
        message: message,

        service:
            selectedService || null,

        event:
            eventName,

        customer_id:
            customerId,

        job_id:
            jobId,

        client_request_id:
            clientRequestId,

        activate_intelligence:
            true
    };

    console.log(
        "ADA CHAT REQUEST:",
        payload
    );

    setStatus(
        "Working on your request..."
    );

    let response;

    try {
        response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(payload)
            }
        );
    } catch (networkError) {
        console.error(
            "ADA CHAT NETWORK ERROR:",
            networkError
        );

        throw new Error(
            "Could not connect to the Ada service."
        );
    }

    let result;

    try {
        result =
            await response.json();
    } catch (parseError) {
        console.error(
            "ADA CHAT RESPONSE PARSE ERROR:",
            parseError
        );

        throw new Error(
            "The Ada service returned an invalid response."
        );
    }

    console.log(
        "ADA CHAT RESPONSE:",
        result
    );

    if (
        !response.ok ||
        !result ||
        result.success !== true
    ) {
        if (
            result &&
            result.diagnostic
        ) {
            addDiagnosticMessage(
                result,
                response.status
            );
        }

        setStatus(
            "Ada request failed."
        );

        const error =
            new Error(
                result &&
                result.diagnostic &&
                result.diagnostic.error
                    ? result.diagnostic.error
                    : "The request could not be completed."
            );

        error.apiResult = result;
        error.httpStatus = response.status;

        throw error;
    }

    setStatus("Ready");

    return result;
}

/* ==================================================
   INITIAL ADA ACTIVATION
   ================================================== */

async function startService() {
    if (!selectedService) {
        setStatus("Ready");

        addSystemMessage(
            "Please select a service to begin."
        );

        return;
    }

    addSystemMessage(
        "Starting your selected service..."
    );

    try {
        const result =
            await sendToIntelligence(
                "I have selected this service and I am ready to begin. Please explain what you need from me and how I should use the available options for this request.",
                "start_new_job"
            );

        if (
            result &&
            result.reply
        ) {
            addMessage(
                result.reply,
                "assistant"
            );
        }
    } catch (error) {
        console.error(
            "SERVICE START ERROR:",
            error
        );

        setStatus(
            "Please try again."
        );

        if (
            !error.apiResult ||
            !error.apiResult.diagnostic
        ) {
            addMessage(
                "Sorry, we could not start your request right now. Please try again in a moment.",
                "assistant"
            );
        }
    }
}

/* ==================================================
   SEND TEXT MESSAGE
   ================================================== */

async function sendMessage() {
    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        message,
        "customer"
    );

    messageInput.value = "";

    resizeTextarea();

    sendButton.disabled = true;

    try {
        const result =
            await sendToIntelligence(
                message
            );

        if (
            result &&
            result.reply
        ) {
            addMessage(
                result.reply,
                "assistant"
            );
        }
    } catch (error) {
        console.error(
            "CHAT ERROR:",
            error
        );

        setStatus(
            "Please try again."
        );

        if (
            !error.apiResult ||
            !error.apiResult.diagnostic
        ) {
            addMessage(
                "Sorry, we could not complete that step right now. Please try again in a moment.",
                "assistant"
            );
        }
    } finally {
        sendButton.disabled = false;
        messageInput.focus();
    }
}

sendButton.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();
            sendMessage();
        }
    }
);

/* ==================================================
   TEXTAREA
   ================================================== */

function resizeTextarea() {
    messageInput.style.height = "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) + "px";
}

messageInput.addEventListener(
    "input",
    resizeTextarea
);

/* ==================================================
   UPLOAD
   ================================================== */

document.getElementById(
    "uploadButton"
).addEventListener(
    "click",
    function() {
        documentInput.value = "";
        documentInput.click();
    }
);

documentInput.addEventListener(
    "change",
    async function() {
        if (
            documentInput.files &&
            documentInput.files.length
        ) {
            await uploadDocument(
                documentInput.files[0]
            );
        }
    }
);

async function uploadDocument(file) {
    if (!file) {
        return;
    }

    attachmentCard.classList.add(
        "visible"
    );

    attachmentName.textContent =
        file.name;

    attachmentStatus.textContent =
        "Sending file...";

    addSystemMessage(
        "Uploading " +
        file.name +
        "..."
    );

    const formData =
        new FormData();

    formData.append(
        "file",
        file,
        file.name
    );

    formData.append(
        "customer_id",
        customerId
    );

    formData.append(
        "job_id",
        jobId
    );

    formData.append(
        "client_request_id",
        clientRequestId
    );

    formData.append(
        "service",
        selectedService
    );

    try {
        const response =
            await fetch(
                "/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

        let result;

        try {
            result =
                await response.json();
        } catch (error) {
            throw new Error(
                "The upload service returned an invalid response."
            );
        }

        if (
            !response.ok ||
            !result ||
            result.success !== true
        ) {
            console.error(
                "DOCUMENT UPLOAD API ERROR:",
                result
            );

            throw new Error(
                result &&
                result.message
                    ? result.message
                    : "The file could not be uploaded."
            );
        }

        attachmentStatus.textContent =
            "File received.";

        addSystemMessage(
            "Your file has been received and attached to this request."
        );

        /*
         * One and only one Ada continuation request
         * for the uploaded document.
         */
        const intelligenceResult =
            await sendToIntelligence(
                "A document named \"" +
                file.name +
                "\" has just been uploaded to this request. Please continue with the selected service and tell me the next step.",
                "file_uploaded"
            );

        if (
            intelligenceResult &&
            intelligenceResult.reply
        ) {
            addMessage(
                intelligenceResult.reply,
                "assistant"
            );
        }
    } catch (error) {
        console.error(
            "DOCUMENT UPLOAD ERROR:",
            error
        );

        attachmentStatus.textContent =
            "Upload could not be completed.";

        addMessage(
            "Sorry, we could not receive that file right now. Please try again.",
            "assistant"
        );
    }
}

/* ==================================================
   VOICE
   ================================================== */

let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;
let microphoneStream = null;

document.getElementById(
    "voiceButton"
).addEventListener(
    "click",
    openVoicePanel
);

function openVoicePanel() {
    voicePanel.classList.add(
        "visible"
    );

    voiceStatus.textContent =
        "Tap Record and allow microphone access when your phone asks.";
}

function closeVoicePanel() {
    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {
        mediaRecorder.stop();
    }

    stopMicrophone();

    voicePanel.classList.remove(
        "visible"
    );
}

document.getElementById(
    "closeVoiceButton"
).addEventListener(
    "click",
    closeVoicePanel
);

async function startRecording() {
    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {
        voiceStatus.textContent =
            "Voice recording is not available in this browser.";

        return;
    }

    try {
        microphoneStream =
            await navigator.mediaDevices.getUserMedia(
                {
                    audio: true
                }
            );

        recordedChunks = [];
        recordedBlob = null;

        let mimeType = "";

        const possibleTypes = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/mp4"
        ];

        for (
            const candidate
            of possibleTypes
        ) {
            if (
                window.MediaRecorder &&
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(
                    candidate
                )
            ) {
                mimeType = candidate;
                break;
            }
        }

        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    microphoneStream,
                    {
                        mimeType:
                            mimeType
                    }
                )
                : new MediaRecorder(
                    microphoneStream
                );

        mediaRecorder.ondataavailable =
            function(event) {
                if (
                    event.data &&
                    event.data.size > 0
                ) {
                    recordedChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            function() {
                const finalType =
                    mediaRecorder.mimeType ||
                    "audio/webm";

                recordedBlob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                finalType
                        }
                    );

                const audioUrl =
                    URL.createObjectURL(
                        recordedBlob
                    );

                audioPreview.src =
                    audioUrl;

                audioPreview.style.display =
                    "block";

                sendVoiceButton.disabled =
                    false;

                againVoiceButton.disabled =
                    false;

                recordButton.disabled =
                    false;

                stopRecordButton.disabled =
                    true;

                voiceStatus.textContent =
                    "Recording ready. You can play it or send it.";

                stopMicrophone();
            };

        mediaRecorder.start();

        recordButton.disabled = true;
        stopRecordButton.disabled = false;
        sendVoiceButton.disabled = true;
        againVoiceButton.disabled = true;

        voiceStatus.textContent =
            "Recording... speak normally.";

    } catch (error) {
        console.error(
            "MICROPHONE ERROR:",
            error
        );

        stopMicrophone();

        voiceStatus.textContent =
            "Microphone access was not granted. Please allow microphone access and try again.";
    }
}

recordButton.addEventListener(
    "click",
    startRecording
);

stopRecordButton.addEventListener(
    "click",
    function() {
        if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
        ) {
            mediaRecorder.stop();
        }
    }
);

againVoiceButton.addEventListener(
    "click",
    function() {
        recordedChunks = [];
        recordedBlob = null;

        audioPreview.removeAttribute(
            "src"
        );

        audioPreview.style.display =
            "none";

        sendVoiceButton.disabled = true;
        againVoiceButton.disabled = true;
        recordButton.disabled = false;
        stopRecordButton.disabled = true;

        voiceStatus.textContent =
            "Ready to record again.";
    }
);

function stopMicrophone() {
    if (!microphoneStream) {
        return;
    }

    microphoneStream
        .getTracks()
        .forEach(
            function(track) {
                track.stop();
            }
        );

    microphoneStream = null;
}

/* ==================================================
   SEND VOICE
   ================================================== */

sendVoiceButton.addEventListener(
    "click",
    sendVoice
);

async function sendVoice() {
    if (!recordedBlob) {
        return;
    }

    sendVoiceButton.disabled = true;

    voiceStatus.textContent =
        "Sending your recording to Ada...";

    const formData =
        new FormData();

    let extension = "webm";

    if (
        recordedBlob.type &&
        recordedBlob.type.includes("mp4")
    ) {
        extension = "mp4";
    }

    formData.append(
        "file",
        recordedBlob,
        "voice_message." +
        extension
    );

    formData.append(
        "customer_id",
        customerId
    );

    formData.append(
        "job_id",
        jobId
    );

    formData.append(
        "client_request_id",
        clientRequestId
    );

    formData.append(
        "service",
        selectedService
    );

    try {
        /*
         * IMPORTANT:
         *
         * Voice is processed ONCE.
         *
         * /api/voice receives the recording and Ada's
         * voice/transcription processing happens there.
         *
         * We DO NOT call /api/chat again afterwards.
         *
         * This removes the previous duplicate voice
         * processing.
         */
        const response =
            await fetch(
                "/api/voice",
                {
                    method: "POST",
                    body: formData
                }
            );

        let result;

        try {
            result =
                await response.json();
        } catch (error) {
            throw new Error(
                "The voice service returned an invalid response."
            );
        }

        console.log(
            "ADA VOICE RESPONSE:",
            result
        );

        if (
            !response.ok ||
            !result ||
            result.success !== true
        ) {
            if (
                result &&
                result.diagnostic
            ) {
                addDiagnosticMessage(
                    result,
                    response.status
                );
            }

            throw new Error(
                result &&
                result.message
                    ? result.message
                    : result &&
                      result.diagnostic &&
                      result.diagnostic.error
                        ? result.diagnostic.error
                        : "Voice processing failed."
            );
        }

        voiceStatus.textContent =
            "Ada received your voice message.";

        addSystemMessage(
            "Voice message received."
        );

        /*
         * Use the response from /api/voice directly.
         *
         * Different API versions may return the Ada
         * response under reply or response.
         */
        const voiceReply =
            result.reply ||
            result.response ||
            (
                result.data &&
                (
                    result.data.reply ||
                    result.data.response
                )
            );

        if (voiceReply) {
            addMessage(
                voiceReply,
                "assistant"
            );
        } else {
            addSystemMessage(
                "Ada received your voice message and is processing it."
            );
        }

        setStatus("Ready");

        sendVoiceButton.disabled = true;

    } catch (error) {
        console.error(
            "VOICE PROCESSING ERROR:",
            error
        );

        voiceStatus.textContent =
            "The recording could not be processed. Please try again.";

        sendVoiceButton.disabled = false;
    }
}
