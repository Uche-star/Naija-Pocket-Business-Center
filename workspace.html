<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            color: #fff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        :root {
            --black: #000;
            --panel: #111;
            --panel-2: #181818;
            --panel-3: #222;

            --gold: #d4af37;
            --gold-light: #f0d36a;

            --white: #fff;
            --muted: #bdbdbd;

            --red: #b30000;
            --red-hover: #d00000;

            --green: #167a3d;

            --border: rgba(212, 175, 55, 0.30);
        }

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--black);
        }

        .header {
            flex: 0 0 auto;
            width: 100%;
            min-height: 76px;
            padding: 12px 16px 10px;
            background: #050505;
            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;

            position: relative;
            z-index: 20;
        }

        .brand {
            min-width: 0;
        }

        .brand-title {
            margin: 0;
            color: var(--gold);

            font-family:
                Montserrat,
                Inter,
                Arial,
                sans-serif;

            font-size: clamp(18px, 4vw, 25px);
            font-weight: 800;
            line-height: 1.1;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: #ddd;
            font-size: 12px;
        }

        .service-badge {
            flex: 0 0 auto;
            max-width: 48%;

            padding: 8px 11px;

            background: #171717;
            border: 1px solid rgba(212, 175, 55, 0.55);
            border-radius: 999px;

            color: var(--gold-light);

            font-size: 12px;
            font-weight: 700;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 16px 12px 18px;

            scroll-behavior: smooth;

            background:
                radial-gradient(
                    circle at top,
                    #151515 0%,
                    #050505 38%,
                    #000 100%
                );
        }

        .conversation-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            width: 100%;
            display: flex;
        }

        .message-row.customer {
            justify-content: flex-end;
        }

        .message-row.service {
            justify-content: flex-start;
        }

        .message {
            max-width: min(90%, 720px);

            padding: 12px 14px;

            border-radius: 15px;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

            line-height: 1.52;
            font-size: 15px;
        }

        .message-row.service .message {
            background: #171717;
            color: #fff;

            border:
                1px solid
                rgba(212, 175, 55, 0.28);

            border-top-left-radius: 4px;
        }

        .message-row.customer .message {
            background: #2b2b2b;
            color: #fff;

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-top-right-radius: 4px;
        }

        .message-label {
            display: block;
            margin-bottom: 5px;

            color: var(--gold);

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .typing {
            display: none;

            width: fit-content;

            padding: 10px 14px;

            background: #171717;

            border:
                1px solid
                rgba(212, 175, 55, 0.25);

            border-radius: 15px;

            color: var(--gold);
            font-size: 13px;
        }

        .typing.show {
            display: block;
        }

        /* ====================================================
           INFORMATION FORM
        ==================================================== */

        .service-form-card {
            display: none;

            width: 100%;

            padding: 18px;

            background:
                linear-gradient(
                    145deg,
                    #1c1c1c,
                    #101010
                );

            border:
                1px solid
                rgba(212, 175, 55, 0.42);

            border-radius: 16px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.35);
        }

        .service-form-card.show {
            display: block;
        }

        .service-form-header {
            margin-bottom: 16px;
        }

        .service-form-title {
            margin: 0;

            color: var(--gold-light);

            font-size: 18px;
            font-weight: 850;
        }

        .service-form-description {
            margin-top: 7px;

            color: #d2d2d2;

            font-size: 13px;
            line-height: 1.5;
        }

        .service-form-fields {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field-label {
            color: #f2f2f2;

            font-size: 13px;
            font-weight: 750;
        }

        .required-star {
            color: #ff7272;
            margin-left: 3px;
        }

        .form-field-help {
            color: #969696;
            font-size: 11px;
            line-height: 1.4;
        }

        .form-control {
            width: 100%;

            min-height: 44px;

            padding: 11px 12px;

            background: #080808;

            color: #fff;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            outline: none;
        }

        textarea.form-control {
            min-height: 82px;
            resize: vertical;
        }

        .form-control:focus {
            border-color:
                rgba(212, 175, 55, 0.70);
        }

        .form-control::placeholder {
            color: #777;
        }

        .service-form-footer {
            display: flex;
            gap: 8px;

            margin-top: 17px;
        }

        .form-submit {
            flex: 1;

            min-height: 44px;

            border: none;
            border-radius: 9px;

            background: var(--gold);
            color: #000;

            font-size: 13px;
            font-weight: 900;
        }

        .form-clear {
            flex: 0 0 auto;

            min-width: 90px;
            min-height: 44px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 9px;

            background: #222;
            color: #fff;

            font-size: 12px;
            font-weight: 750;
        }

        .form-submit:disabled,
        .form-clear:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* ====================================================
           BOTTOM
        ==================================================== */

        .bottom {
            flex: 0 0 auto;
            width: 100%;

            background: #090909;

            border-top: 1px solid var(--border);

            padding:
                8px
                10px
                calc(8px + env(safe-area-inset-bottom));

            position: relative;
            z-index: 20;
        }

        .bottom-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .actions {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 6px;

            margin-bottom: 8px;
        }

        .action-button {
            min-height: 39px;

            padding: 8px 5px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            border-radius: 8px;

            background: #181818;
            color: #fff;

            font-size: 11px;
            font-weight: 750;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        .action-button:hover {
            background: #252525;

            border-color:
                rgba(212, 175, 55, 0.55);
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button.gold {
            color: var(--gold-light);

            border-color:
                rgba(212, 175, 55, 0.45);
        }

        .action-button.red {
            background: var(--red);
            color: #fff;
            border-color: var(--red);
        }

        .action-button.red:hover {
            background: var(--red-hover);
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 7px;
        }

        .message-input {
            flex: 1 1 auto;
            min-width: 0;

            min-height: 48px;
            max-height: 110px;

            resize: none;

            padding: 13px;

            background: #171717;
            color: #fff;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            border-radius: 11px;

            outline: none;

            line-height: 1.4;
        }

        .message-input::placeholder {
            color: #888;
        }

        .message-input:focus {
            border-color:
                rgba(212, 175, 55, 0.65);
        }

        .send-button {
            flex: 0 0 auto;

            width: 72px;
            min-height: 48px;

            border: none;
            border-radius: 11px;

            background: var(--gold);
            color: #000;

            font-size: 13px;
            font-weight: 900;
        }

        .send-button:hover {
            background: var(--gold-light);
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #fileInput {
            display: none;
        }

        .status {
            min-height: 16px;

            margin-top: 5px;
            padding-left: 2px;

            color: #888;

            font-size: 10px;
            text-align: center;
        }

        .status.error {
            color: #ff7070;
        }

        .status.success {
            color: #7edc9c;
        }

        /* ====================================================
           PAYMENT
        ==================================================== */

        .payment-panel {
            display: none;

            margin-bottom: 8px;
            padding: 12px;

            background: #121212;

            border:
                1px solid
                rgba(212, 175, 55, 0.40);

            border-radius: 10px;
        }

        .payment-panel.show {
            display: block;
        }

        .payment-title {
            color: var(--gold);

            font-size: 13px;
            font-weight: 800;

            margin-bottom: 7px;
        }

        .payment-details {
            color: #eee;

            font-size: 12px;
            line-height: 1.5;

            white-space: pre-wrap;
        }

        .payment-buttons {
            display: flex;
            gap: 7px;
            margin-top: 9px;
        }

        .payment-buttons button {
            flex: 1;

            min-height: 40px;

            border-radius: 8px;
            border: none;

            font-weight: 800;
            font-size: 12px;
        }

        .payment-report {
            background: var(--gold);
            color: #000;
        }

        .payment-check {
            background: #292929;
            color: #fff;

            border:
                1px solid
                rgba(255, 255, 255, 0.15) !important;
        }

        .voice-recording {
            display: none;

            margin-bottom: 8px;
            padding: 9px;

            background: #160707;

            border:
                1px solid
                rgba(179, 0, 0, 0.60);

            border-radius: 9px;

            color: #ff8a8a;

            font-size: 12px;
            text-align: center;
        }

        .voice-recording.show {
            display: block;
        }

        @media (max-width: 620px) {

            .header {
                min-height: 68px;
                padding: 10px 11px;
            }

            .brand-title {
                font-size: 18px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .service-badge {
                max-width: 42%;
                padding: 7px 9px;
                font-size: 10px;
            }

            .conversation {
                padding: 11px 8px 14px;
            }

            .message {
                max-width: 94%;
                font-size: 14px;
                padding: 11px 12px;
            }

            .service-form-card {
                padding: 14px;
            }

            .service-form-title {
                font-size: 16px;
            }

            .actions {
                gap: 4px;
            }

            .action-button {
                min-height: 36px;
                padding: 6px 2px;
                font-size: 9px;
            }

            .message-input {
                min-height: 46px;
                font-size: 14px;
            }

            .send-button {
                width: 64px;
                min-height: 46px;
                font-size: 12px;
            }
        }

        @media (max-width: 390px) {

            .brand-subtitle {
                display: none;
            }

            .service-badge {
                max-width: 45%;
            }

            .action-button {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <h1 class="brand-title">
                Naija Pocket Business Center
            </h1>

            <div class="brand-subtitle">
                Your Business Center
            </div>

        </div>

        <div
            id="serviceBadge"
            class="service-badge"
        >
            Service
        </div>

    </header>


    <main
        id="conversation"
        class="conversation"
    >

        <div
            id="conversationInner"
            class="conversation-inner"
        >

            <div
                id="typing"
                class="typing"
            >
                Working...
            </div>

        </div>

    </main>


    <section class="bottom">

        <div class="bottom-inner">

            <div
                id="paymentPanel"
                class="payment-panel"
            >

                <div class="payment-title">
                    Payment
                </div>

                <div
                    id="paymentDetails"
                    class="payment-details"
                ></div>

                <div class="payment-buttons">

                    <button
                        id="paymentReportButton"
                        class="payment-report"
                        type="button"
                    >
                        Report Payment
                    </button>

                    <button
                        id="paymentCheckButton"
                        class="payment-check"
                        type="button"
                    >
                        Check Status
                    </button>

                </div>

            </div>


            <div
                id="voiceRecording"
                class="voice-recording"
            >
                🔴 Recording... tap Voice again to stop.
            </div>


            <div class="actions">

                <button
                    id="uploadButton"
                    class="action-button"
                    type="button"
                >
                    📎 Upload
                </button>

                <button
                    id="voiceButton"
                    class="action-button gold"
                    type="button"
                >
                    🎤 Voice
                </button>

                <button
                    id="reviewButton"
                    class="action-button gold"
                    type="button"
                >
                    ✓ Review
                </button>

                <button
                    id="approveButton"
                    class="action-button gold"
                    type="button"
                >
                    ✓ Approve
                </button>

                <button
                    id="customerServiceButton"
                    class="action-button"
                    type="button"
                >
                    Customer Service
                </button>

            </div>


            <input
                id="fileInput"
                type="file"
            >


            <div class="composer">

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Type your message..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                >
                    SEND
                </button>

            </div>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </section>

</div>


<script>
"use strict";


/* ============================================================
   CURRENT FASTAPI APPLICATION
============================================================ */

const API_BASE = "";


/* ============================================================
   ELEMENTS
============================================================ */

const conversation =
    document.getElementById("conversation");

const conversationInner =
    document.getElementById("conversationInner");

const typing =
    document.getElementById("typing");

const serviceBadge =
    document.getElementById("serviceBadge");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const uploadButton =
    document.getElementById("uploadButton");

const voiceButton =
    document.getElementById("voiceButton");

const reviewButton =
    document.getElementById("reviewButton");

const approveButton =
    document.getElementById("approveButton");

const customerServiceButton =
    document.getElementById("customerServiceButton");

const fileInput =
    document.getElementById("fileInput");

const statusElement =
    document.getElementById("status");

const voiceRecording =
    document.getElementById("voiceRecording");

const paymentPanel =
    document.getElementById("paymentPanel");

const paymentDetails =
    document.getElementById("paymentDetails");

const paymentReportButton =
    document.getElementById("paymentReportButton");

const paymentCheckButton =
    document.getElementById("paymentCheckButton");


/* ============================================================
   SERVICE
============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

const service =
    clean(
        params.get("service")
    ) ||
    "Business Center Service";


/* ============================================================
   CUSTOMER / JOB IDENTIFIERS
============================================================ */

let customerId =
    getStored(
        "npbc_customer_id"
    );

if (!customerId) {

    customerId =
        createId(
            "customer_"
        );

    store(
        "npbc_customer_id",
        customerId
    );
}


let jobId =
    params.get("job_id") ||
    getStored(
        "npbc_job_id"
    );

if (!jobId) {

    jobId =
        createId(
            "job_"
        );

    store(
        "npbc_job_id",
        jobId
    );
}


const clientRequestId =
    getStored(
        "npbc_client_request_id"
    ) ||
    createId(
        "request_"
    );

store(
    "npbc_client_request_id",
    clientRequestId
);


/* ============================================================
   STATE
============================================================ */

let busy = false;
let approved = false;
let paymentId = null;

let mediaRecorder = null;
let recordedChunks = [];
let recordingStream = null;


/* ============================================================
   FORM STATE
============================================================ */

let serviceFormCard = null;
let serviceFormFields = [];
let formAlreadySubmitted = false;


/* ============================================================
   HELPERS
============================================================ */

function clean(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return null;
    }

    const result =
        String(value).trim();

    if (!result) {
        return null;
    }

    if (
        [
            "none",
            "null",
            "undefined",
            "unknown"
        ].includes(
            result.toLowerCase()
        )
    ) {
        return null;
    }

    return result;
}


function createId(prefix) {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {
        return (
            prefix +
            crypto.randomUUID()
        );
    }

    return (
        prefix +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


function store(key, value) {

    try {

        localStorage.setItem(
            key,
            value
        );

    } catch (error) {

        console.warn(
            "Local storage unavailable.",
            error
        );
    }
}


function getStored(key) {

    try {

        return localStorage.getItem(
            key
        );

    } catch (error) {

        return null;
    }
}


function setStatus(
    message,
    type = ""
) {

    statusElement.textContent =
        message || "";

    statusElement.className =
        "status " + type;
}


function scrollToBottom() {

    requestAnimationFrame(
        () => {

            conversation.scrollTop =
                conversation.scrollHeight;

        }
    );
}


function setBusy(value) {

    busy = value;

    sendButton.disabled =
        value;

    uploadButton.disabled =
        value;

    voiceButton.disabled =
        value;

    reviewButton.disabled =
        value;

    approveButton.disabled =
        value;

    customerServiceButton.disabled =
        value;

    if (!value) {
        messageInput.focus();
    }
}


/* ============================================================
   MESSAGE DISPLAY
============================================================ */

function addMessage(
    sender,
    text
) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        (
            sender === "customer"
                ? "customer"
                : "service"
        );


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message";


    const label =
        document.createElement(
            "span"
        );

    label.className =
        "message-label";


    /*
        IMPORTANT:
        No customer-facing Ada name.
        No "Assistant" label.
    */

    label.textContent =
        sender === "customer"
            ? "You"
            : "";


    if (label.textContent) {

        bubble.appendChild(
            label
        );

    }


    const content =
        document.createElement(
            "div"
        );

    content.textContent =
        text || "";


    bubble.appendChild(
        content
    );

    row.appendChild(
        bubble
    );


    conversationInner.insertBefore(
        row,
        typing
    );


    /*
        Let the intelligence response determine whether
        a service-specific information form should appear.
    */

    if (
        sender !== "customer" &&
        text
    ) {

        detectAndBuildServiceForm(
            text
        );

    }


    scrollToBottom();
}


/* ============================================================
   SERVICE FORM
============================================================ */

/*
    This is deliberately NOT a list of services.

    The selected service is already supplied to /api/chat.

    The intelligence response determines what information
    is needed. This function simply turns an information-form
    description from that response into the beautiful form
    container.

    There is no generic Name / Phone / Email form here.
*/

function detectAndBuildServiceForm(
    responseText
) {

    const text =
        String(
            responseText || ""
        );

    if (
        formAlreadySubmitted
    ) {
        return;
    }


    /*
        Look for the form section introduced by the
        intelligence. This is intentionally generic.
    */

    const lower =
        text.toLowerCase();


    const hasFormLanguage =
        lower.includes(
            "information form"
        ) ||
        lower.includes(
            "form"
        ) &&
        (
            lower.includes(
                "required"
            ) ||
            lower.includes(
                "optional"
            )
        );


    if (!hasFormLanguage) {
        return;
    }


    const fields =
        extractFormFields(
            text
        );


    if (!fields.length) {
        return;
    }


    buildServiceForm(
        fields
    );
}


/*
    Extract fields from numbered/bulleted form descriptions.

    Examples understood:

    1. Document title (required)
    2. Document type (required)
    3. Formatting style (optional)

    Also understands simple bullet fields.

    "Deadline" is deliberately ignored because it is not
    a standard field for this business-center workflow.
*/

function extractFormFields(
    text
) {

    const results = [];

    const lines =
        text.split(
            /\r?\n/
        );


    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        let line =
            lines[i]
                .replace(
                    /\*\*/g,
                    ""
                )
                .trim();


        if (!line) {
            continue;
        }


        /*
            Ignore headings.
        */

        if (
            /information form/i.test(
                line
            )
        ) {
            continue;
        }


        /*
            Numbered field.
        */

        let match =
            line.match(
                /^\s*\d+[\.\)]\s+(.+?)\s*$/
            );


        /*
            Bullet field.
        */

        if (!match) {

            match =
                line.match(
                    /^\s*[-•]\s+(.+?)\s*$/
                );

        }


        if (!match) {
            continue;
        }


        let fieldText =
            match[1]
                .trim();


        /*
            Remove table-like trailing text.
        */

        fieldText =
            fieldText
                .replace(
                    /\s*\|.*$/,
                    ""
                )
                .trim();


        /*
            Remove deadline completely.
        */

        if (
            /\bdeadline\b/i.test(
                fieldText
            )
        ) {
            continue;
        }


        const required =
            /\brequired\b/i.test(
                fieldText
            );


        const optional =
            /\boptional\b/i.test(
                fieldText
            );


        fieldText =
            fieldText
                .replace(
                    /\(\s*required\s*\)/ig,
                    ""
                )
                .replace(
                    /\(\s*optional\s*\)/ig,
                    ""
                )
                .replace(
                    /\brequired\b/ig,
                    ""
                )
                .replace(
                    /\boptional\b/ig,
                    ""
                )
                .trim();


        /*
            Separate an example/help explanation.
        */

        let label =
            fieldText;

        let help = "";


        const helpMatch =
            fieldText.match(
                /^(.+?)\s*(?:\((.+)\))$/
            );


        if (helpMatch) {

            label =
                helpMatch[1]
                    .trim();

            help =
                helpMatch[2]
                    .trim();

        }


        /*
            Remove markdown emphasis.
        */

        label =
            label
                .replace(
                    /[*_`]/g,
                    ""
                )
                .trim();


        help =
            help
                .replace(
                    /[*_`]/g,
                    ""
                )
                .trim();


        if (!label) {
            continue;
        }


        /*
            Avoid duplicate fields.
        */

        const duplicate =
            results.some(
                item =>
                    item.label.toLowerCase() ===
                    label.toLowerCase()
            );


        if (duplicate) {
            continue;
        }


        results.push(
            {
                label,
                help,
                required
            }
        );

    }


    return results;
}

/* ============================================================
   REBUILD EXISTING FORM
============================================================ */

function rebuildExistingServiceForm() {

    if (
        !serviceFormCard
    ) {
        return;
    }


    const container =
        serviceFormCard.querySelector(
            ".service-form-fields"
        );


    if (!container) {
        return;
    }


    renderFormFields(
        container
    );
}


/* ============================================================
   RENDER FORM FIELDS
============================================================ */

function renderFormFields(
    container
) {

    container.innerHTML = "";


    serviceFormFields.forEach(
        function(field, index) {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "form-field";


            const label =
                document.createElement(
                    "label"
                );

            label.className =
                "form-field-label";

            label.textContent =
                field.label;


            if (
                field.required
            ) {

                const star =
                    document.createElement(
                        "span"
                    );

                star.className =
                    "required-star";

                star.textContent =
                    "*";

                label.appendChild(
                    star
                );

            }


            const lower =
                field.label.toLowerCase();


            let control;


            /*
                Longer instructions get a textarea.
            */

            if (
                lower.includes(
                    "instruction"
                ) ||
                lower.includes(
                    "guideline"
                ) ||
                lower.includes(
                    "description"
                ) ||
                lower.includes(
                    "experience"
                ) ||
                lower.includes(
                    "education"
                ) ||
                lower.includes(
                    "qualification"
                ) ||
                lower.includes(
                    "skill"
                ) ||
                lower.includes(
                    "objective"
                )
            ) {

                control =
                    document.createElement(
                        "textarea"
                    );

            } else {

                control =
                    document.createElement(
                        "input"
                    );

                control.type =
                    "text";

            }


            control.className =
                "form-control";


            control.dataset.fieldLabel =
                field.label;


            control.dataset.required =
                field.required
                    ? "true"
                    : "false";


            control.placeholder =
                field.help ||
                "Enter " +
                field.label.toLowerCase();


            if (
                field.required
            ) {

                control.required =
                    true;

            }


            if (
                field.help
            ) {

                const help =
                    document.createElement(
                        "div"
                    );

                help.className =
                    "form-field-help";

                help.textContent =
                    field.help;

                wrapper.appendChild(
                    label
                );

                wrapper.appendChild(
                    help
                );

            } else {

                wrapper.appendChild(
                    label
                );

            }


            wrapper.appendChild(
                control
            );


            container.appendChild(
                wrapper
            );

        }
    );
}

/* ============================================================
   FORM SUBMISSION
============================================================ */

async function submitServiceForm() {

    if (
        busy
    ) {
        return;
    }


    if (
        !serviceFormCard
    ) {
        return;
    }


    const controls =
        Array.from(
            serviceFormCard.querySelectorAll(
                ".form-control"
            )
        );


    const information = [];


    for (
        const control of controls
    ) {

        const value =
            clean(
                control.value
            );


        const required =
            control.dataset.required ===
            "true";


        const label =
            control.dataset.fieldLabel;


        if (
            required &&
            !value
        ) {

            control.focus();


            setStatus(
                "Please complete the required information.",
                "error"
            );

            return;
        }


        /*
            Optional empty fields are not sent.
            This is important for reducing request size.
        */

        if (
            value
        ) {

            information.push(
                label +
                ": " +
                value
            );

        }

    }


    if (
        !information.length
    ) {

        setStatus(
            "Please provide the information that is relevant to your request.",
            "error"
        );

        return;
    }


    const compactFormMessage =
        "SERVICE INFORMATION FORM\n" +
        information.join(
            "\n"
        );


    formAlreadySubmitted =
        true;


    serviceFormCard
        .classList
        .remove(
            "show"
        );


    addMessage(
        "customer",
        information.join(
            "\n"
        )
    );


    /*
        Send only the completed fields.
        Do not resend the entire form or unnecessary
        empty fields.
    */

    await sendMessage(
        compactFormMessage,
        {
            event:
                "service_information_submitted"
        }
    );


    setStatus(
        "Your information has been received.",
        "success"
    );
}


/* ============================================================
   CURRENT /api/chat
============================================================ */

async function sendMessage(
    message,
    options = {}
) {

    const text =
        clean(message);


    if (!text) {

        setStatus(
            "Please enter a message.",
            "error"
        );

        return null;
    }


    if (busy) {
        return null;
    }


    if (!options.silent) {

        /*
            Do not display form data twice if the caller
            already displayed it.
        */

        if (
            !options.alreadyDisplayed
        ) {

            addMessage(
                "customer",
                text
            );

        }

    }


    setBusy(true);

    typing.classList.add(
        "show"
    );

    scrollToBottom();


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/chat",
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify({

                            message:
                                text,

                            service:
                                service,

                            event:
                                options.event ||
                                null,

                            customer_id:
                                customerId,

                            job_id:
                                jobId,

                            client_request_id:
                                clientRequestId,

                            activate_intelligence:
                                true

                        })

                }
            );


        const data =
            await response.json()
                .catch(
                    () => ({})
                );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.reply ||
                data.message ||
                data.error ||
                "The request could not be processed."
            );

        }


        const reply =
            clean(
                data.reply
            );


        if (reply) {

            addMessage(
                "service",
                reply
            );

        }


        if (
            data.job_id &&
            data.job_id !== jobId
        ) {

            jobId =
                data.job_id;

            store(
                "npbc_job_id",
                jobId
            );

        }


        setStatus(
            "Ready for your next instruction.",
            "success"
        );


        return data;


    } catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        /*
            Show the actual server error in the browser
            console while keeping customer-facing wording
            clean.
        */

        addMessage(
            "service",
            "Sorry, I could not complete that step right now. Please try again."
        );


        setStatus(
            "Connection problem. Please try again.",
            "error"
        );


        return null;


    } finally {

        typing.classList.remove(
            "show"
        );

        setBusy(false);

        scrollToBottom();

    }
}

voiceButton.addEventListener(

    async function() {

            stopRecording();

async function startRecording() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        setStatus(
            "Voice recording is not supported on this device.",
            "error"
        );

        return;
    }


    try {

        recordingStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    {
                        audio: true
                    }
                );


        recordedChunks = [];


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";

        }


        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    recordingStream,
                    {
                        mimeType
                    }
                )
                : new MediaRecorder(
                    recordingStream
                );


        mediaRecorder.ondataavailable =
            function(event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function() {

                if (recordingStream) {

                    recordingStream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }


                recordingStream = null;


                voiceRecording
                    .classList
                    .remove(
                        "show"
                    );


                voiceButton.textContent =
                    "🎤 Voice";


                await sendVoice();

            };


        mediaRecorder.start();


        voiceRecording
            .classList
            .add(
                "show"
            );


        voiceButton.textContent =
            "⏹ Stop Voice";


        setStatus(
            "Recording your voice..."
        );


    } catch (error) {

        console.error(
            "VOICE START ERROR:",
            error
        );


        setStatus(
            "Could not access your microphone.",
            "error"
        );

    }
}


function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state ===
            "recording"
    ) {

        mediaRecorder.stop();

    }
}


async function sendVoice() {

    if (
        !recordedChunks.length
    ) {

        setStatus(
            "No voice recording was captured.",
            "error"
        );

        return;
    }


    const blob =
        new Blob(
            recordedChunks,
            {
                type:
                    "audio/webm"
            }
        );


    const formData =
        new FormData();


    formData.append(
        "file",
        blob,
        "voice_message.webm"
    );

    formData.append(
        "customer_id",
        customerId
    );

    formData.append(
        "job_id",
        jobId
    );

    formData.append(
        "client_request_id",
        clientRequestId
    );

    formData.append(
        "service",
        service
    );


    setStatus(
        "Sending your voice recording..."
    );


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/voice",
                {
                    method:
                        "POST",

                    body:
                        formData
                }
            );


        const data =
            await response.json()
                .catch(
                    () => ({})
                );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Voice upload failed."
            );

        }


        addMessage(
            "customer",
            "🎤 Voice recording sent."
        );


        if (
            data.message
        ) {

            addMessage(
                "service",
                data.message
            );

        }


        setStatus(
            "Voice recording received.",
            "success"
        );


        await sendMessage(

            "My voice recording has been attached to this service. Please continue with the request.",

            {
                event:
                    "voice_uploaded"
            }

        );


    } catch (error) {

        console.error(
            "VOICE UPLOAD ERROR:",
            error
        );


        addMessage(
            "service",
            "Sorry, I could not receive your voice recording right now. Please try again."
        );


        setStatus(
            error.message ||
            "Voice upload failed.",
            "error"
        );

    }
}

                            {
                                "Content-Type":
                                    "application/json"
                            },

                        body:
                            JSON.stringify({

                                job_id:
                                    jobId,

                                customer_id:
                                    customerId,

                                service:
                                    service,

                                amount:
                                    amount,

                                payment_method:
                                    "bank_transfer"

                            })

                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Payment record could not be created."
                );

            }


            paymentId =
                data.payment_id;


            store(
                "npbc_payment_id",
                String(
                    paymentId
                )
            );


            addMessage(
                "customer",
                "I have reported my payment."
            );


            addMessage(
                "service",
                data.message ||
                "Your payment has been reported successfully. Payment verification is now pending."
            );


            paymentDetails.textContent +=
                "\nPayment ID: " +
                paymentId +
                "\nStatus: Pending";


            setStatus(
                "Payment reported. Verification is pending.",
                "success"
            );


        } catch (error) {

            console.error(
                "PAYMENT ERROR:",
                error
            );


            setStatus(
                error.message ||
                "Payment could not be created.",
                "error"
            );

        }

    }
);


/* ============================================================
   PAYMENT STATUS
============================================================ */

paymentCheckButton.addEventListener(
    "click",
    checkPaymentStatus
);


async function checkPaymentStatus() {

    setStatus(
        "Checking payment status..."
    );


    try {

        const query =
            new URLSearchParams();


        query.set(
            "job_id",
            jobId
        );


        const response =
            await fetch(
                API_BASE +
                "/api/payment/status?" +
                query.toString()
            );


        const data =
            await response.json()
                .catch(
                    () => ({})
                );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Payment status could not be checked."
            );

        }


        paymentId =
            data.payment_id ||
            paymentId;


        const status =
            String(
                data.status ||
                "pending"
            ).toLowerCase();


        if (
            status === "paid"
        ) {

            addMessage(
                "service",
                "Your payment has been confirmed successfully. Your document can now be released when the delivery file is ready."
            );


            setStatus(
                "Payment confirmed.",
                "success"
            );


            paymentDetails.textContent +=
                "\nStatus: Paid";


            await checkDownloadReady();


        } else {

            addMessage(
                "service",
                "Payment is still pending. Your document will become available after payment has been confirmed."
            );


            setStatus(
                "Payment is still pending."
            );

        }


    } catch (error) {

        console.error(
            "PAYMENT STATUS ERROR:",
            error
        );


        setStatus(
            error.message ||
            "Could not check payment status.",
            "error"
        );

    }
}


/* ============================================================
   DOWNLOAD
============================================================ */

async function checkDownloadReady() {

    const query =
        new URLSearchParams();


    query.set(
        "job_id",
        jobId
    );


    if (customerId) {

        query.set(
            "customer_id",
            customerId
        );

    }


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/download?" +
                query.toString(),
                {
                    method:
                        "GET"
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            response.ok &&
            !contentType.includes(
                "application/json"
            )
        ) {

            addMessage(
                "service",
                "Your document is ready for download."
            );


            showDownloadButton();

            return;
        }


        const data =
            await response.json()
                .catch(
                    () => ({})
                );


        if (
            data.message
        ) {

            setStatus(
                data.message
            );

        }


    } catch (error) {

        console.error(
            "DOWNLOAD CHECK ERROR:",
            error
        );

    }
}


function showDownloadButton() {

    const existing =
        document.getElementById(
            "downloadButton"
        );


    if (existing) {
        return;
    }


    const button =
        document.createElement(
            "button"
        );


    button.id =
        "downloadButton";


    button.className =
        "action-button red";


    button.type =
        "button";


    button.textContent =
        "⬇ Download";


    button.addEventListener(
        "click",
        function() {

            const query =
                new URLSearchParams();


            query.set(
                "job_id",
                jobId
            );


            query.set(
                "customer_id",
                customerId
            );


            window.location.href =
                API_BASE +
                "/api/download?" +
                query.toString();

        }
    );


    document
        .querySelector(".actions")
        .appendChild(
            button
        );

}


/* ============================================================
   CUSTOMER SERVICE
============================================================ */

customerServiceButton.addEventListener(
    "click",
    async function() {

        if (busy) {
            return;
        }


        setBusy(true);


        setStatus(
            "Connecting you to Customer Service..."
        );


        try {

            const query =
                new URLSearchParams();


            query.set(
                "customer_id",
                customerId
            );

            query.set(
                "job_id",
                jobId
            );

            query.set(
                "service",
                service
            );


            const response =
                await fetch(
                    API_BASE +
                    "/api/customer-service?" +
                    query.toString(),
                    {
                        method:
                            "POST"
                    }
                );


            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.reply ||
                    data.message ||
                    "Customer Service is unavailable."
                );

            }


            addMessage(
                "customer",
                "I need Customer Service assistance."
            );


            addMessage(
                "service",
                data.reply ||
                "Customer Service is available to help."
            );


            setStatus(
                "Customer Service response received.",
                "success"
            );


        } catch (error) {

            console.error(
                "CUSTOMER SERVICE ERROR:",
                error
            );


            addMessage(
                "service",
                "Customer Service is available to help. Please try again."
            );


            setStatus(
                error.message ||
                "Customer Service could not be reached.",
                "error"
            );


        } finally {

            setBusy(false);

        }

    }
);


/* ============================================================
   INITIALIZATION
============================================================ */

function initializeWorkspace() {

    serviceBadge.textContent =
        service;


    startAssistant();

}


initializeWorkspace();

</script>
