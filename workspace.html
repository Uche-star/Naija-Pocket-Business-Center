<script>

/*

============================================================

This page is deliberately a thin client.

It does NOT:
- call Groq

function getPrice(name){

    if(prices[name]){
        return prices[name];
    }

    const key =
        String(name)
            .trim()
            .toLowerCase();

    const found =
        Object.keys(prices)
            .find(
                item =>
                    item.toLowerCase() === key
            );

    return found
        ? prices[found]
        : "Quotation";
}

const formDefinitions = {

const genericFields = [

        "request",

    ],

function getDefinitions(){

    if(formDefinitions[service]){
        return formDefinitions[service];
    }

    return genericFields;
}

function makeField(definition){

    const [
        name,
        label,
        placeholder,
        type,
        required
    ] = definition;

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "field";

    const labelElement =
        document.createElement(
            "label"
        );

    labelElement.htmlFor =
        name;

    labelElement.textContent =
        label +
        (
            required
                ? " *"
                : ""
        );

    const input =
        document.createElement(
            type === "textarea"
                ? "textarea"
                : "input"
        );

    input.id =
        name;

    input.name =
        name;

    input.placeholder =
        placeholder;

    input.required =
        !!required;

    if(type !== "textarea"){
        input.type =
            type;
    }

    wrapper.append(
        labelElement,
        input
    );

    return wrapper;
}

function buildFields(){

    fields.innerHTML =
        "";

    getDefinitions()
        .forEach(
            definition =>
                fields.append(
                    makeField(
                        definition
                    )
                )
        );
}

function collectForm(){

    const data = {};

    fields
        .querySelectorAll(
            "input,textarea"
        )
        .forEach(
            element => {

                const value =
                    String(
                        element.value ||
                        ""
                    ).trim();

                if(value){
                    data[
                        element.name
                    ] =
                        value;
                }
            }
        );

    return data;
}

/*

function setStatus(
    text,
    type=""
){

    status.textContent =
        text || "";

    status.className =
        "status " +
        type;
}

function setBusy(
    value
){

    busy =
        value;

    [
        submitButton,
        sendButton,
        uploadButton,
        voiceButton,
        customerButton,
        chooseButton
    ]
    .forEach(
        button =>
            button.disabled =
                value
    );
}

/*
============================================================
EXISTING API
============================================================

This is the only intelligence connection in the page.

The existing FastAPI application accepts:
message
service
event
customer_id
job_id
client_request_id
activate_intelligence
context

Those are the fields this page uses.
*/

async function sendToExistingAPI(
    message,
    event,
    context=""
){

    const payload = {

        message:

            String(
                message || ""
            ).trim(),

        service,

        event,

        customer_id:
            customerId,

        job_id:
            jobId || null,

        client_request_id:
            clientRequestId,

        activate_intelligence:
            true,

        context:
            context || null
    };

    const response =
        await fetch(
            "/api/chat",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );

    if(!response.ok){

        throw new Error(
            data.error_message ||
            data.message ||
            data.error ||
            "Your request could not be processed."
        );
    }

    if(data.job_id){

        jobId =
            data.job_id;

        localStorage.setItem(
            "npbc_job_id",
            jobId
        );
    }

    return data;
}

/*
============================================================
REVIEW HANDOFF
============================================================

The document is written once.

The review page reads it once.

The complete document is NOT sent back to the API merely
because the customer wants to read it.

Corrections contain only the correction request.
*/

function reviewStorageKey(){

    return (
        "npbc_review_" +
        (
            jobId ||
            clientRequestId
        )
    );
}

function saveReview(
    work
){

    const packet = {

        service,

        customer_id:
            customerId,

        job_id:
            jobId,

        client_request_id:
            clientRequestId,

        work:
            String(
                work || ""
            ),

        saved_at:
            Date.now()
    };

    try{

        localStorage.setItem(
            reviewStorageKey(),
            JSON.stringify(
                packet
            )
        );

        localStorage.setItem(
            "npbc_active_review_key",
            reviewStorageKey()
        );

    }catch(error){

        /*
            sessionStorage is only a fallback if localStorage
            cannot accept the document.
        */

        try{

            sessionStorage.setItem(
                "npbc_review_fallback",
                JSON.stringify(
                    packet
                )
            );

        }catch(storageError){

            throw new Error(
                "The document could not be prepared for review on this device."
            );
        }
    }
}

function openReview(
    work
){

    saveReview(
        work
    );

    const query =
        new URLSearchParams({

            service,

            customer_id:
                customerId,

            job_id:
                jobId || "",

            client_request_id:
                clientRequestId
        });

    location.href =
        "review.html?" +
        query.toString();
}

/*
============================================================
FORM SUBMISSION
============================================================
*/

serviceForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(
            busy ||
            !serviceForm.reportValidity()
        ){
            return;
        }

        const formData =
            collectForm();

        const message =
            Object.values(
                formData
            )
            .filter(Boolean)
            .join(
                "\n\n"
            );

        const context =
            Object.entries(
                formData
            )
            .map(
                ([key,value]) =>
                    key.toUpperCase() +
                    ":\n" +
                    value
            )
            .join(
                "\n\n"
            );

        setBusy(true);

        setStatus(
            "Your request is being processed..."
        );

        try{

            const data =
                await sendToExistingAPI(
                    message,
                    "customer_request",
                    context
                );

            if(!data.reply){

                throw new Error(
                    "Your request was received, but no work was returned."
                );
            }

            openReview(
                data.reply
            );

        }catch(error){

            setStatus(
                error.message,
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);

/*
============================================================
MESSAGE
============================================================
*/

sendButton.addEventListener(
    "click",
    async () => {

        const message =
            messageInput.value.trim();

        if(
            !message ||
            busy
        ){
            return;
        }

        messageInput.value =
            "";

        messageInput.style.height =
            "auto";

        setBusy(true);

        setStatus(
            "Your message is being processed..."
        );

        try{

            const data =
                await sendToExistingAPI(
                    message,
                    "customer_message"
                );

            if(
                data.reply
            ){

                openReview(
                    data.reply
                );

            }else{

                setStatus(
                    "Your message was received.",
                    "success"
                );
            }

        }catch(error){

            setStatus(
                error.message,
                "error"
            );

        }finally{

            setBusy(false);
        }
    }
);

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendButton.click();
        }
    }
);

messageInput.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                110
            ) +
            "px";
    }
);

/*
============================================================
UPLOAD
============================================================
*/

uploadButton.addEventListener(
    "click",
    () => {

        if(!busy){
            fileInput.click();
        }
    }
);

fileInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files &&
            this.files[0];

        if(!file){
            return;
        }

        const form =
            new FormData();

        form.append(
            "file",
            file
        );

        form.append(
            "service",
            service
        );

        form.append(
            "customer_id",
            customerId
        );

        if(jobId){

            form.append(
                "job_id",
                jobId
            );
        }

        setBusy(true);

        setStatus(
            "Uploading your document..."
        );

        try{

            const response =
                await fetch(
                    "/api/upload",
                    {
                        method:"POST",
                        body:form
                    }
                );

            const data =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );

            if(!response.ok){

                throw new Error(
                    data.message ||
                    data.error ||
                    "Upload failed."
                );
            }

            if(data.job_id){

                jobId =
                    data.job_id;

                localStorage.setItem(
                    "npbc_job_id",
                    jobId
                );
            }

            setStatus(
                "Document received.",
                "success"
            );

        }catch(error){

            setStatus(
                error.message,
                "error"
            );

        }finally{

            this.value =
                "";

            setBusy(false);
        }
    }
);

/*
============================================================
CUSTOMER SERVICE
============================================================
*/

customerButton.addEventListener(
    "click",
    () => {

        messageInput.value =
            "I need Customer Service assistance with my " +
            service +
            " request.";

        messageInput.focus();

        messageInput.dispatchEvent(
            new Event("input")
        );
    }
);

/*
============================================================
ANOTHER SERVICE
============================================================
*/

chooseButton.addEventListener(
    "click",
    () => {

        if(!busy){

            location.href =
                "conversation.html";
        }
    }
);

/*
============================================================
VOICE
============================================================

The button remains part of the existing workspace UI.
No new AI or transcription engine is introduced here.
*/

let recorder =
    null;

let voiceStream =
    null;

voiceButton.addEventListener(
    "click",
    async () => {

        if(busy){
            return;
        }

        if(
            recorder &&
            recorder.state ===
            "recording"
        ){

            recorder.stop();

            return;
        }

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia ||
            !window.MediaRecorder
        ){

            setStatus(
                "Voice recording is not available on this device.",
                "error"
            );

            return;
        }

        try{

            voiceStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio:true
                    });

            recorder =
                new MediaRecorder(
                    voiceStream
                );

            recorder.onstop =
                () => {

                    if(
                        voiceStream
                    ){

                        voiceStream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );
                    }

                    voiceStream =
                        null;

                    setStatus(
                        "Voice recording captured.",
                        "success"
                    );
                };

            recorder.start();

            setStatus(
                "Recording..."
            );

        }catch(error){

            setStatus(
                "Microphone access was not available.",
                "error"
            );
        }
    }
);

/*
============================================================
INITIALISE
============================================================
*/

serviceBadge.textContent =
    service;

serviceTitle.textContent =
    service;

price.textContent =
    "Service fee: " +
    getPrice(service);

buildFields();

</script>
