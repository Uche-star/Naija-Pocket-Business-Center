<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            padding:
                max(8px, env(safe-area-inset-top))
                8px
                max(8px, env(safe-area-inset-bottom))
                8px;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .workspace {
            width: 100%;
            max-width: 700px;
            height: 100%;
            min-height: 0;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =====================================================
           FIXED TOP
        ===================================================== */

        .header {
            flex: 0 0 auto;

            background: #171717;

            border-radius: 6px;

            padding: 10px 11px;

            margin-bottom: 6px;

            border-bottom: 2px solid #FFFFFF;
        }

        .brand {
            font-size: 17px;
            font-weight: bold;
        }

        .selected-service {
            margin-top: 7px;

            background: #0B0B0B;

            border: 1px solid #444444;

            border-radius: 5px;

            padding: 7px 9px;
        }

        .selected-service-label {
            color: #AAAAAA;

            font-size: 9px;

            margin-bottom: 2px;
        }

        .selected-service-name {
            color: white;

            font-size: 14px;

            font-weight: bold;

            overflow-wrap: anywhere;
        }

        .service-price {
            margin-top: 6px;

            color: white;

            font-size: 12px;

            font-weight: bold;
        }


        /* =====================================================
           NETWORK STATUS
        ===================================================== */

        .connection-status {
            display: none;

            flex: 0 0 auto;

            width: 100%;

            margin-bottom: 5px;

            padding: 7px 9px;

            border-radius: 5px;

            background: #242424;

            border: 1px solid #444444;

            color: white;

            font-size: 10px;

            line-height: 1.35;

            text-align: center;
        }

        .connection-status.show {
            display: block;
        }


        /* =====================================================
           CHAT AREA
           ONLY THIS AREA SCROLLS
        ===================================================== */

        .chat-area {
            flex: 1 1 auto;

            min-height: 0;

            width: 100%;

            background: #171717;

            border-radius: 6px;

            padding: 12px;

            overflow-y: auto;

            overflow-x: hidden;

            border: 1px solid #292929;

            -webkit-overflow-scrolling: touch;
        }

        .message {
            width: 100%;

            margin-bottom: 13px;

            display: flex;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.you {
            justify-content: flex-end;
        }

        .bubble {
            display: inline-block;

            max-width: 92%;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .message.ada .bubble {
            background: #242424;

            color: white;

            border-bottom-left-radius: 2px;
        }

        .message.you .bubble {
            background: #111111;

            color: white;

            border: 1px solid #444444;

            border-bottom-right-radius: 2px;
        }


        /* =====================================================
           FIXED ACTION BUTTONS
        ===================================================== */

        .actions {
            flex: 0 0 auto;

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 5px;

            margin-top: 6px;
        }

        .action-button {
            width: 100%;

            min-width: 0;

            min-height: 40px;

            border: 1px solid #444444;

            border-radius: 5px;

            padding: 7px 5px;

            background: #000000;

            color: white;

            font-size: 10px;

            font-weight: bold;

            line-height: 1.15;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .action-button:hover {
            background: #171717;
        }

        .action-button:active {
            background: #242424;

            transform: scale(0.98);
        }

        .action-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =====================================================
           FIXED MESSAGE INPUT
        ===================================================== */

        .input-area {
            flex: 0 0 auto;

            width: 100%;

            margin-top: 6px;

            display: flex;

            gap: 5px;
        }

        .message-input {
            flex: 1 1 auto;

            min-width: 0;

            min-height: 44px;

            max-height: 90px;

            resize: none;

            background: white;

            color: black;

            border: none;

            border-radius: 5px;

            padding: 10px;

            font-size: 13px;

            outline: none;
        }

        .send-button {
            flex: 0 0 76px;

            min-height: 44px;

            border: 1px solid #444444;

            border-radius: 5px;

            background: #000000;

            color: white;

            font-size: 10px;

            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .send-button:hover {
            background: #171717;
        }

        .send-button:active {
            background: #242424;

            transform: scale(0.98);
        }

        .send-button:disabled {
            opacity: 0.5;
        }

        #fileInput {
            display: none;
        }


        /* =====================================================
           FIXED FOOTER
        ===================================================== */

        .footer {
            flex: 0 0 auto;

            text-align: center;

            color: #777777;

            font-size: 9px;

            line-height: 1.3;

            padding-top: 5px;
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 6px;

                padding-right: 6px;
            }

            .header {
                padding: 8px 9px;
            }

            .brand {
                font-size: 15px;
            }

            .selected-service {
                padding: 6px 8px;
            }

            .selected-service-name {
                font-size: 13px;
            }

            .chat-area {
                padding: 9px;
            }

            .bubble {
                font-size: 12px;

                padding: 9px 10px;
            }

            .actions {
                gap: 4px;
            }

            .action-button {
                min-height: 37px;

                font-size: 9px;

                padding: 5px 3px;
            }

            .message-input {
                min-height: 42px;

                font-size: 12px;
            }

            .send-button {
                flex-basis: 68px;

                min-height: 42px;
            }

            .footer {
                font-size: 8px;
            }
        }


        /* =====================================================
           LARGER PHONES / TABLETS
        ===================================================== */

        @media (min-width: 600px) {

            .page {
                padding-left: 16px;

                padding-right: 16px;
            }

            .actions {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 6px;
            }

            .action-button {
                min-height: 42px;

                font-size: 11px;
            }
        }

    </style>
</head>


<body>

<div class="page">

    <main class="workspace">


        <!-- =================================================
             FIXED TOP
        ================================================== -->

        <section class="header">

            <div class="brand">
                NAIJA POCKET BUSINESS CENTER
            </div>

            <div class="selected-service">

                <div class="selected-service-label">
                    SELECTED SERVICE
                </div>

                <div
                    id="selectedService"
                    class="selected-service-name"
                >
                    Loading service...
                </div>

                <div
                    id="servicePrice"
                    class="service-price"
                ></div>

            </div>

        </section>


        <!-- =================================================
             NETWORK STATUS
        ================================================== -->

        <div
            id="connectionStatus"
            class="connection-status"
        ></div>


        <!-- =================================================
             MIDDLE
             ONLY THIS AREA SCROLLS
        ================================================== -->

        <section
            id="chatArea"
            class="chat-area"
        ></section>


        <!-- =================================================
             FIXED ACTION BUTTONS
        ================================================== -->

        <section class="actions">

            <button
                type="button"
                class="action-button upload-button"
                onclick="openFilePicker()"
            >
                📎 Upload
            </button>

            <button
                type="button"
                class="action-button voice-button"
                onclick="openVoice()"
            >
                🎤 Voice
            </button>

            <button
                type="button"
                class="action-button review-button"
                onclick="reviewDocument()"
            >
                🔍 Review
            </button>

            <button
                type="button"
                class="action-button approve-button"
                onclick="approveDocument()"
            >
                ✅ Approve
            </button>

            <button
                type="button"
                class="action-button payment-button"
                onclick="openPayment()"
            >
                💳 Payment &amp; Download
            </button>

            <button
                type="button"
                class="action-button customer-service-button"
                onclick="contactCustomerService()"
            >
                🆘 Customer Service
            </button>

        </section>


        <!-- =================================================
             FIXED MESSAGE INPUT
        ================================================== -->

        <section class="input-area">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Write your message here..."
                rows="2"
            ></textarea>

            <button
                type="button"
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
            >
                SEND
            </button>

        </section>


        <input
            type="file"
            id="fileInput"
            accept=".pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.webp"
            onchange="handleFileSelected(event)"
        >


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">
            Naija Pocket Business Center<br>
            Your Business Center In Your Pocket
        </div>

    </main>

</div>


<script>

/* ============================================================
   CORE STATE
============================================================ */

let selectedService = "";

let intelligenceStarted = false;

let requestInProgress = false;

let reconnectTimer = null;

let pendingRequest = null;

let conversation = [];


/* ============================================================
   STORAGE
============================================================ */

const STORAGE_KEY =
    "naijaPocketConversation";

const SERVICE_KEY =
    "selectedService";

const PENDING_KEY =
    "naijaPocketPendingRequest";


/* ============================================================
   CUSTOMER-FACING NETWORK MESSAGE
============================================================ */

const NETWORK_MESSAGE =
    "Your work has been saved safely. We are experiencing a temporary network connection issue. Your request has not been lost. Please stay on this page. When the connection returns, we will continue your work from where we stopped.";


/* ============================================================
   LOAD SAVED WORK
============================================================ */

function loadSavedWork() {

    try {

        const savedConversation =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (savedConversation) {

            const parsed =
                JSON.parse(
                    savedConversation
                );

            if (
                Array.isArray(parsed)
            ) {

                conversation =
                    parsed;
            }
        }

    } catch (error) {

        console.error(
            "Conversation restore error:",
            error
        );

        conversation = [];
    }


    try {

        const savedPending =
            localStorage.getItem(
                PENDING_KEY
            );

        if (savedPending) {

            const parsedPending =
                JSON.parse(
                    savedPending
                );

            if (
                parsedPending &&
                parsedPending.message
            ) {

                pendingRequest =
                    parsedPending;
            }
        }

    } catch (error) {

        console.error(
            "Pending request restore error:",
            error
        );

        pendingRequest = null;
    }
}


/* ============================================================
   SAVE COMPLETE CONVERSATION
============================================================ */

function saveConversation() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                conversation
            )
        );

    } catch (error) {

        console.error(
            "Conversation save error:",
            error
        );
    }
}


/* ============================================================
   SAVE PENDING REQUEST
============================================================ */

function savePendingRequest(
    request
) {

    pendingRequest =
        request;

    try {

        localStorage.setItem(
            PENDING_KEY,
            JSON.stringify(
                request
            )
        );

    } catch (error) {

        console.error(
            "Pending request save error:",
            error
        );
    }
}


/* ============================================================
   CLEAR PENDING REQUEST
============================================================ */

function clearPendingRequest() {

    pendingRequest = null;

    try {

        localStorage.removeItem(
            PENDING_KEY
        );

    } catch (error) {

        console.error(
            "Pending request clear error:",
            error
        );
    }
}


/* ============================================================
   DISPLAY SAVED CONVERSATION
============================================================ */

function restoreConversationToScreen() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    chatArea.innerHTML = "";

    for (
        const item of conversation
    ) {

        renderMessage(
            item.sender,
            item.message,
            false
        );
    }

    scrollChatToBottom();
}


/* ============================================================
   RENDER MESSAGE
============================================================ */

function renderMessage(
    sender,
    message,
    save = true
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            sender === "You"
                ? "you"
                : "ada"
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.innerText =
        message;

    wrapper.appendChild(
        bubble
    );

    chatArea.appendChild(
        wrapper
    );

    if (save) {

        conversation.push({

            sender:
                sender,

            message:
                message,

            timestamp:
                Date.now()
        });

        saveConversation();
    }

    scrollChatToBottom();
}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    sender,
    message
) {

    renderMessage(
        sender,
        message,
        true
    );
}


/* ============================================================
   SCROLL CHAT ONLY
============================================================ */

function scrollChatToBottom() {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    requestAnimationFrame(
        function() {

            chatArea.scrollTop =
                chatArea.scrollHeight;
        }
    );
}


/* ============================================================
   GET SERVICE
============================================================ */

function getSelectedService() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    selectedService =
        params.get("service") || "";

    if (!selectedService) {

        selectedService =
            localStorage.getItem(
                SERVICE_KEY
            ) || "";
    }

    if (!selectedService) {

        selectedService =
            "Service not selected";
    }

    document.getElementById(
        "selectedService"
    ).innerText =
        selectedService;

    localStorage.setItem(
        SERVICE_KEY,
        selectedService
    );
}


/* ============================================================
   CONNECTION STATUS
============================================================ */

function showConnectionStatus(
    message
) {

    const status =
        document.getElementById(
            "connectionStatus"
        );

    status.innerText =
        message;

    status.classList.add(
        "show"
    );
}


function hideConnectionStatus() {

    const status =
        document.getElementById(
            "connectionStatus"
        );

    status.classList.remove(
        "show"
    );

    status.innerText = "";
}


/* ============================================================
   CREATE REQUEST ID
============================================================ */

function createRequestId() {

    return (
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );
}


/* ============================================================
   CHECK WHETHER ERROR IS TEMPORARY NETWORK FAILURE
============================================================ */

function isNetworkError(
    error
) {

    if (!error) {
        return false;
    }

    if (
        error.name ===
        "AbortError"
    ) {

        return true;
    }

    if (
        error instanceof
        TypeError
    ) {

        return true;
    }

    const text =
        String(
            error.message || ""
        ).toLowerCase();

    return (
        text.includes("network") ||
        text.includes("failed to fetch") ||
        text.includes("fetch") ||
        text.includes("connection") ||
        text.includes("timeout") ||
        text.includes("offline")
    );
}


/* ============================================================
   WAIT
============================================================ */

function wait(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );
        }
    );
}


/* ============================================================
   RAW FASTAPI REQUEST
============================================================ */

async function requestFastAPI(
    request
) {

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            function() {

                controller.abort();

            },
            30000
        );


    try {

        const response =
            await fetch(
                "https://naija-pocket-business-center.onrender.com/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                request.message,

                            service:
                                selectedService,

                            event:
                                request.event,

                            activate_intelligence:
                                true,

                            client_request_id:
                                request.requestId
                        }),

                    signal:
                        controller.signal
                }
            );


        let result;

        try {

            result =
                await response.json();

        } catch (error) {

            if (!response.ok) {

                throw new Error(
                    "Server returned an invalid response."
                );
            }

            throw new Error(
                "Server returned an invalid response."
            );
        }


        /* ====================================================
           SERVICE PRICE
        ==================================================== */

        if (
            result &&
            result.price !== undefined
        ) {

            const price =
                String(
                    result.price
                );

            document.getElementById(
                "servicePrice"
            ).innerText =
                price.includes("₦")
                    ? "SERVICE PRICE: " + price
                    : "SERVICE PRICE: ₦" + price;
        }


        /* ====================================================
           SUCCESS
        ==================================================== */

        if (
            response.ok &&
            result &&
            result.success
        ) {

            return {

                reply:
                    result.reply ||
                    result.response ||
                    result.message ||
                    "Your request is ready to continue.",

                result:
                    result
            };
        }


        /* ====================================================
           REAL SERVER ERROR
           This is NOT treated as a temporary network
           fluctuation.
        ==================================================== */

        const serverError =
            (
                result &&
                (
                    result.error ||
                    result.message
                )
            ) ||
            "The Business Center could not process the request.";

        const error =
            new Error(
                serverError
            );

        error.serverError =
            true;

        error.status =
            response.status;

        throw error;

    } finally {

        clearTimeout(
            timeout
        );
    }
}


/* ============================================================
   SEND TO BUSINESS CENTER WITH CONTROLLED RETRIES
============================================================ */

async function sendToAda(
    message,
    eventName
) {

    const request = {

        requestId:
            createRequestId(),

        message:
            message,

        event:
            eventName
    };


    /*
       Save the request before contacting the server.
       If the network disappears, the work remains saved.
    */

    savePendingRequest(
        request
    );


    const retryDelays = [
        1500,
        3000,
        6000,
        10000
    ];


    let lastError =
        null;


    for (
        let attempt = 0;
        attempt <= retryDelays.length;
        attempt++
    ) {

        try {

            if (
                !navigator.onLine
            ) {

                throw new TypeError(
                    "Network is currently offline."
                );
            }


            if (
                attempt > 0
            ) {

                showConnectionStatus(
                    "Your work is saved. Reconnecting and continuing your request..."
                );
            }


            const result =
                await requestFastAPI(
                    request
                );


            /*
               The request succeeded.
               Remove it from the pending queue.
            */

            clearPendingRequest();

            hideConnectionStatus();

            return result.reply;

        } catch (error) {

            lastError =
                error;

            console.error(
                "Business Center request attempt " +
                (attempt + 1) +
                " failed:",
                error
            );


            /*
               Real server/application errors should not
               blindly be repeated.
            */

            if (
                error.serverError
            ) {

                break;
            }


            /*
               Temporary network failure.
               Retry automatically.
            */

            if (
                attempt <
                retryDelays.length
            ) {

                showConnectionStatus(
                    "Your work is saved. There is a temporary network connection issue. Reconnecting..."
                );

                await wait(
                    retryDelays[attempt]
                );

                continue;
            }
        }
    }


    /*
       All controlled retries failed.
       The request remains saved in localStorage.
    */

    showConnectionStatus(
        NETWORK_MESSAGE
    );

    throw lastError ||
        new Error(
            "Temporary network connection issue."
        );
}


/* ============================================================
   SHOW SAVED-WORK MESSAGE ONCE
============================================================ */

function showSavedNetworkMessage() {

    const alreadyShown =
        conversation.some(
            function(item) {

                return (
                    item.message ===
                    NETWORK_MESSAGE
                );
            }
        );

    if (!alreadyShown) {

        addMessage(
            "Business Center",
            NETWORK_MESSAGE
        );
    }
}


/* ============================================================
   AUTOMATIC SERVICE ACTIVATION
============================================================ */

async function startAdaIntelligence() {

    if (
        intelligenceStarted
    ) {

        return;
    }

    intelligenceStarted =
        true;


    if (
        !selectedService ||
        selectedService ===
        "Service not selected"
    ) {

        addMessage(
            "Business Center",
            "Please return to the services and select the service you need."
        );

        return;
    }


    /*
       If this service already has a saved conversation,
       do not start a second welcome request.
    */

    const hasConversation =
        conversation.length > 0;


    if (hasConversation) {

        return;
    }


    try {

        const response =
            await sendToAda(

                "The customer has selected the service '" +
                selectedService +
                "'. Begin the normal conversation for this service. Welcome the customer, acknowledge the selected service, and ask only the first useful question needed to begin the work. Do not ask which service the customer wants because the service has already been selected.",

                "service_selected"
            );

        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "SERVICE ACTIVATION ERROR:",
            error
        );

        if (
            isNetworkError(
                error
            )
        ) {

            showSavedNetworkMessage();

        } else {

            addMessage(
                "Business Center",
                "We could not complete that request at the moment. Your work has been saved. Please continue when the connection is available."
            );
        }
    }
}


/* ============================================================
   CUSTOMER MESSAGE
============================================================ */

async function sendMessage() {

    if (
        requestInProgress
    ) {

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const message =
        input.value.trim();


    if (!message) {

        return;
    }


    requestInProgress =
        true;


    /*
       Save the customer's message immediately.
       It is therefore not lost even if the network disappears.
    */

    addMessage(
        "You",
        message
    );


    input.value = "";


    sendButton.disabled =
        true;

    sendButton.innerText =
        "WAIT...";


    try {

        const response =
            await sendToAda(
                message,
                "customer_message"
            );


        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "CUSTOMER MESSAGE ERROR:",
            error
        );


        if (
            isNetworkError(
                error
            )
        ) {

            showSavedNetworkMessage();

        } else {

            addMessage(
                "Business Center",
                "Your message has been saved. We could not complete the request right now. Please continue when the connection is available."
            );
        }

    } finally {

        requestInProgress =
            false;

        sendButton.disabled =
            false;

        sendButton.innerText =
            "SEND";
    }
}


/* ============================================================
   ENTER TO SEND
============================================================ */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

    );


/* ============================================================
   UPLOAD
============================================================ */

function openFilePicker() {

    document
        .getElementById(
            "fileInput"
        )
        .click();
}


async function handleFileSelected(
    event
) {

    const file =
        event.target.files[0];


    if (!file) {

        return;
    }


    addMessage(
        "You",
        "I have uploaded " +
        file.name
    );


    try {

        const response =
            await sendToAda(

                "The customer has uploaded a file named '" +
                file.name +
                "'. Continue helping with the selected service.",

                "file_uploaded"
            );


        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            "FILE UPLOAD REQUEST ERROR:",
            error
        );


        if (
            isNetworkError(
                error
            )
        ) {

            showSavedNetworkMessage();

        } else {

            addMessage(
                "Business Center",
                "Your uploaded file and work have been saved. We could not continue the request right now. Please continue when the connection is available."
            );
        }
    }


    event.target.value = "";
}

/* ============================================================
   COMMON BUSINESS ACTION
============================================================ */

async function performBusinessAction(
    customerMessage,
    controllerMessage,
    eventName
) {

    if (
        requestInProgress
    ) {

        return;
    }


    requestInProgress =
        true;


    addMessage(
        "You",
        customerMessage
    );


    try {

        const response =
            await sendToAda(
                controllerMessage,
                eventName
            );


        addMessage(
            "Business Center",
            response
        );

    } catch (error) {

        console.error(
            eventName +
            " ERROR:",
            error
        );


        if (
            isNetworkError(
                error
            )
        ) {

            showSavedNetworkMessage();

        } else {

            addMessage(
                "Business Center",
                "Your work has been saved. We could not complete this step right now. Please continue when the connection is available."
            );
        }

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   CONTINUE PENDING WORK AFTER CONNECTION RETURNS
============================================================ */

async function resumePendingRequest() {

    if (
        !pendingRequest
    ) {

        hideConnectionStatus();

        return;
    }


    if (
        requestInProgress
    ) {

        return;
    }


    if (
        !navigator.onLine
    ) {

        showConnectionStatus(
            NETWORK_MESSAGE
        );

        return;
    }


    requestInProgress =
        true;


    showConnectionStatus(
        "Your connection is back. Continuing your saved work..."
    );


    try {

        const request =
            pendingRequest;


        const response =
            await requestFastAPI(
                request
            );


        clearPendingRequest();

        hideConnectionStatus();


        /*
           Only display the returned response.
           The original customer message was already saved.
        */

        addMessage(
            "Business Center",
            response.reply
        );

    } catch (error) {

        console.error(
            "PENDING REQUEST RESUME ERROR:",
            error
        );


        if (
            isNetworkError(
                error
            )
        ) {

            showConnectionStatus(
                NETWORK_MESSAGE
            );

        } else {

            clearPendingRequest();

            showConnectionStatus(
                ""
            );

            hideConnectionStatus();

            addMessage(
                "Business Center",
                "Your work is still saved. We could not complete that step right now. Please continue when the connection is available."
            );
        }

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   NETWORK RETURNS
============================================================ */

window.addEventListener(
    "online",
    function() {

        showConnectionStatus(
            "Your connection is back. Checking your saved work..."
        );


        /*
           Give the browser a moment to restore the connection
           before sending the saved request.
        */

        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            setTimeout(
                function() {

                    resumePendingRequest();

                },
                1200
            );
    }
);


/* ============================================================
   NETWORK GOES OFFLINE
============================================================ */

window.addEventListener(
    "offline",
    function() {

        if (
            pendingRequest
        ) {

            showConnectionStatus(
                NETWORK_MESSAGE
            );

        } else {

            showConnectionStatus(
                "There is a temporary network connection issue. Your work is being kept safely on this page."
            );
        }
    }
);


/* ============================================================
   PERIODIC CONNECTION CHECK
   Helps when the browser does not fire online reliably.
============================================================ */

setInterval(
    function() {

        if (
            pendingRequest &&
            navigator.onLine &&
            !requestInProgress
        ) {

            resumePendingRequest();
        }

    },
    15000
);


/* ============================================================
   SAVE BEFORE PAGE IS HIDDEN
============================================================ */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            saveConversation();

            if (
                pendingRequest
            ) {

                savePendingRequest(
                    pendingRequest
                );
            }
        }
    }
);


/* ============================================================
   START WORKSPACE
============================================================ */

loadSavedWork();

getSelectedService();

restoreConversationToScreen();


/*
   If a previous request was waiting for the network,
   do not create another automatic service-selection request.
*/

if (
    pendingRequest
) {

    intelligenceStarted =
        true;

    if (
        navigator.onLine
    ) {

        setTimeout(
            function() {

                resumePendingRequest();

            },
            1000
        );

    } else {

        showConnectionStatus(
            NETWORK_MESSAGE
        );
    }

} else {

    startAdaIntelligence();
}

</script>
