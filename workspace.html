<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Naija Pocket Business Center — Ada Workspace</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           HEADER
        ================================================== */

        .header {
            flex: 0 0 auto;
            width: 100%;
            background: #000;
            border-bottom: 1px solid #292929;
            padding: 12px 14px;
            text-align: center;
        }

        .brand {
            margin: 0;
            color: #d4af37;
            font-family: Montserrat, Arial, sans-serif;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
        }

        .service-title {
            margin-top: 5px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.25;
        }

        /* ==================================================
           CHAT AREA
        ================================================== */

        .conversation {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px;
            background: #050505;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            width: 100%;
            display: flex;
            margin-bottom: 12px;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.customer {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 92%;
            padding: 12px 14px;
            border-radius: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.ada .bubble {
            background: #181818;
            border: 1px solid #303030;
            color: #fff;
            border-top-left-radius: 4px;
        }

        .message.customer .bubble {
            background: #d4af37;
            color: #000;
            border-top-right-radius: 4px;
            font-weight: 500;
        }

        .typing {
            opacity: 0.7;
            font-style: italic;
        }

        /* ==================================================
           COMPOSER
        ================================================== */

        .composer {
            flex: 0 0 auto;
            width: 100%;
            background: #000;
            border-top: 1px solid #292929;
            padding: 9px;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 7px;
            width: 100%;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            min-height: 46px;
            max-height: 100px;
            resize: none;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 12px;
            outline: none;
            background: #171717;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
            font-size: 15px;
        }

        #messageInput::placeholder {
            color: #888;
        }

        .send-button {
            flex: 0 0 auto;
            min-width: 68px;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            background: #d4af37;
            color: #000;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* ==================================================
           ACTION BUTTONS
        ================================================== */

        .actions {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            margin-top: 7px;
        }

        .action-button {
            min-height: 38px;
            padding: 8px 5px;
            border: 1px solid #333;
            border-radius: 9px;
            background: #111;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .back-button {
            background: #8f1717;
            border-color: #b52626;
        }

        /* ==================================================
           HIDDEN FILE INPUT
        ================================================== */

        #fileInput {
            display: none;
        }

        /* ==================================================
           STATUS
        ================================================== */

        .status {
            min-height: 16px;
            margin-top: 5px;
            color: #888;
            text-align: center;
            font-size: 11px;
        }

        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 480px) {

            .brand {
                font-size: 18px;
            }

            .service-title {
                font-size: 14px;
            }

            .conversation {
                padding: 10px;
            }

            .bubble {
                max-width: 94%;
                font-size: 14px;
            }

            .actions {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .action-button {
                font-size: 11px;
                min-height: 36px;
            }

            .send-button {
                min-width: 62px;
            }
        }
    </style>
</head>

<body>

    <!-- ==================================================
         FIXED HEADER
    ================================================== -->

    <header class="header">
        <h1 class="brand">Naija Pocket Business Center</h1>
        <div id="serviceTitle" class="service-title">
            Ada — Business Center Assistant
        </div>
    </header>


    <!-- ==================================================
         ADA CONVERSATION
         
         IMPORTANT:
         No Ada welcome/reply is hardcoded here.
         Ada's first response comes from /api/chat.
    ================================================== -->

    <main
        id="conversation"
        class="conversation"
        aria-live="polite"
    ></main>


    <!-- ==================================================
         FIXED BOTTOM WORKSPACE
    ================================================== -->

    <section class="composer">

        <div class="input-row">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Type your message to Ada..."
                autocomplete="off"
            ></textarea>

            <button
                id="sendButton"
                class="send-button"
                type="button"
            >
                Send
            </button>

        </div>


        <!-- Hidden native file picker -->
        <input
            id="fileInput"
            type="file"
        >


        <div class="actions">

            <button
                id="uploadButton"
                class="action-button"
                type="button"
            >
                Upload
            </button>

            <button
                id="voiceButton"
                class="action-button"
                type="button"
            >
                Voice
            </button>

            <button
                id="reviewButton"
                class="action-button"
                type="button"
            >
                Review
            </button>

            <button
                id="approveButton"
                class="action-button"
                type="button"
            >
                Approve
            </button>

            <button
                id="paymentButton"
                class="action-button"
                type="button"
            >
                Payment
            </button>

            <button
                id="customerServiceButton"
                class="action-button"
                type="button"
            >
                Customer Service
            </button>

            <button
                id="newJobButton"
                class="action-button"
                type="button"
            >
                New Job
            </button>

            <button
                id="backButton"
                class="action-button back-button"
                type="button"
            >
                Back
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </section>


    <script>
        "use strict";


        /* ==================================================
           SESSION / SERVICE
        ================================================== */

        const params = new URLSearchParams(
            window.location.search
        );

        const selectedService =
            params.get("service") || "General Assistance";

        let customerId =
            params.get("customer_id");

        let jobId =
            params.get("job_id");

        let clientRequestId =
            params.get("client_request_id");


        /*
         * Create browser-side identifiers only when the
         * previous page did not provide them.
         *
         * These identifiers remain stable during this job.
         */

        if (!customerId) {

            customerId =
                localStorage.getItem(
                    "naija_pocket_customer_id"
                );

            if (!customerId) {

                customerId =
                    "customer-" +
                    crypto.randomUUID();

                localStorage.setItem(
                    "naija_pocket_customer_id",
                    customerId
                );
            }
        }


        if (!jobId) {

            jobId =
                sessionStorage.getItem(
                    "naija_pocket_job_id"
                );

            if (!jobId) {

                jobId =
                    "job-" +
                    crypto.randomUUID();

                sessionStorage.setItem(
                    "naija_pocket_job_id",
                    jobId
                );
            }
        }


        if (!clientRequestId) {

            clientRequestId =
                sessionStorage.getItem(
                    "naija_pocket_client_request_id"
                );

            if (!clientRequestId) {

                clientRequestId =
                    "client-" +
                    crypto.randomUUID();

                sessionStorage.setItem(
                    "naija_pocket_client_request_id",
                    clientRequestId
                );
            }
        }


        /* ==================================================
           DOM
        ================================================== */

        const conversation =
            document.getElementById(
                "conversation"
            );

        const serviceTitle =
            document.getElementById(
                "serviceTitle"
            );

        const messageInput =
            document.getElementById(
                "messageInput"
            );

        const sendButton =
            document.getElementById(
                "sendButton"
            );

        const uploadButton =
            document.getElementById(
                "uploadButton"
            );

        const voiceButton =
            document.getElementById(
                "voiceButton"
            );

        const reviewButton =
            document.getElementById(
                "reviewButton"
            );

        const approveButton =
            document.getElementById(
                "approveButton"
            );

        const paymentButton =
            document.getElementById(
                "paymentButton"
            );

        const customerServiceButton =
            document.getElementById(
                "customerServiceButton"
            );

        const newJobButton =
            document.getElementById(
                "newJobButton"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );

        const fileInput =
            document.getElementById(
                "fileInput"
            );

        const status =
            document.getElementById(
                "status"
            );


        serviceTitle.textContent =
            selectedService;


        /* ==================================================
           UI HELPERS
        ================================================== */

        function setStatus(text) {

            status.textContent =
                text || "";
        }


        function scrollConversation() {

            conversation.scrollTop =
                conversation.scrollHeight;
        }


        function addMessage(
            text,
            sender = "ada"
        ) {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "message " + sender;

            const bubble =
                document.createElement("div");

            bubble.className =
                "bubble";

            bubble.textContent =
                String(text || "");

            wrapper.appendChild(
                bubble
            );

            conversation.appendChild(
                wrapper
            );

            scrollConversation();

            return wrapper;
        }


        function addTypingMessage() {

            return addMessage(
                "Ada is preparing your response...",
                "ada"
            );
        }


        function removeMessage(element) {

            if (
                element &&
                element.parentNode
            ) {
                element.parentNode.removeChild(
                    element
                );
            }
        }


        /* ==================================================
           API REQUEST
        ================================================== */

        async function sendToAda(
            message,
            event = null,
            showCustomerMessage = true
        ) {

            const cleanMessage =
                String(message || "").trim();

            if (!cleanMessage) {
                return null;
            }


            if (showCustomerMessage) {

                addMessage(
                    cleanMessage,
                    "customer"
                );
            }


            const typing =
                addTypingMessage();


            setStatus(
                "Ada is working on your request..."
            );


            sendButton.disabled = true;


            try {

                const payload = {

                    message:
                        cleanMessage,

                    service:
                        selectedService,

                    event:
                        event,

                    customer_id:
                        customerId,

                    job_id:
                        jobId,

                    client_request_id:
                        clientRequestId,

                    activate_intelligence:
                        true
                };


                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                let result = null;


                try {

                    result =
                        await response.json();

                } catch (jsonError) {

                    result = null;
                }


                removeMessage(
                    typing
                );


                if (
                    !response.ok ||
                    !result ||
                    !result.success
                ) {

                    throw new Error(
                        "Ada request was not completed."
                    );
                }


                const reply =
                    result.reply ||
                    result.message;


                if (!reply) {

                    throw new Error(
                        "Ada returned no response."
                    );
                }


                addMessage(
                    reply,
                    "ada"
                );


                setStatus(
                    "Ada is ready."
                );


                return result;


            } catch (error) {

                removeMessage(
                    typing
                );


                /*
                 * Do not manufacture an Ada reply here.
                 * The actual intelligence response must come
                 * from the API.
                 */

                addMessage(
                    "Sorry, Ada could not complete that request right now. Please try again.",
                    "ada"
                );


                setStatus(
                    "Please try again."
                );


                console.error(
                    "Ada request failed:",
                    error
                );


                return null;


            } finally {

                sendButton.disabled =
                    false;

                messageInput.focus();
            }
        }


        /* ==================================================
           IMMEDIATE ADA ACTIVATION
           
           THIS IS THE IMPORTANT PART.
           
           There is NO hardcoded Ada welcome response.
           
           Opening a selected service immediately sends an
           instruction through FastAPI → AdaController →
           AdaAIEngine → intelligence provider.
        ================================================== */

        async function activateAdaForService() {

            const startMessage =
                "Begin working with me on the selected service. Introduce yourself naturally, explain how you will help me with this service and explain what I can use Upload, Voice, Message, Review, Approve, Payment and Customer Service for. Then ask me the single most important question you need to continue.";

            await sendToAda(
                startMessage,
                "new_job",
                false
            );
        }


        /* ==================================================
           SEND BUTTON
        ================================================== */

        async function handleSend() {

            const message =
                messageInput.value.trim();

            if (!message) {

                setStatus(
                    "Please enter a message."
                );

                messageInput.focus();

                return;
            }


            messageInput.value = "";

            messageInput.style.height =
                "46px";


            await sendToAda(
                message,
                null,
                true
            );
        }


        sendButton.addEventListener(
            "click",
            handleSend
        );


        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    handleSend();
                }
            }
        );


        messageInput.addEventListener(
            "input",
            function() {

                this.style.height =
                    "46px";

                this.style.height =
                    Math.min(
                        this.scrollHeight,
                        100
                    ) + "px";
            }
        );


        /* ==================================================
           UPLOAD
        ================================================== */

        uploadButton.addEventListener(
            "click",
            function() {

                fileInput.click();
            }
        );


        fileInput.addEventListener(
            "change",
            async function() {

                const file =
                    this.files &&
                    this.files[0];

                if (!file) {
                    return;
                }


                setStatus(
                    "Uploading your file..."
                );


                uploadButton.disabled =
                    true;


                try {

                    const formData =
                        new FormData();


                    formData.append(
                        "file",
                        file
                    );


                    formData.append(
                        "customer_id",
                        customerId
                    );


                    formData.append(
                        "job_id",
                        jobId
                    );


                    formData.append(
                        "service",
                        selectedService
                    );


                    const response =
                        await fetch(
                            "/upload",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    let result = null;


                    try {

                        result =
                            await response.json();

                    } catch (jsonError) {

                        result = null;
                    }


                    if (
                        !response.ok ||
                        !result ||
                        !result.success
                    ) {

                        throw new Error(
                            "Upload failed."
                        );
                    }


                    addMessage(
                        "File uploaded: " +
                        file.name,
                        "customer"
                    );


                    /*
                     * The upload itself is now recorded.
                     * Tell Ada about it through the same
                     * intelligence/session path.
                     */

                    await sendToAda(
                        "I have uploaded a file named \"" +
                        file.name +
                        "\" for my " +
                        selectedService +
                        " request. Please continue with the file and tell me the next thing you need.",
                        "file_uploaded",
                        false
                    );


                    setStatus(
                        "File received."
                    );


                } catch (error) {

                    console.error(
                        "Upload failed:",
                        error
                    );


                    addMessage(
                        "Sorry, the file could not be uploaded. Please try again.",
                        "ada"
                    );


                    setStatus(
                        "Upload failed."
                    );


                } finally {

                    uploadButton.disabled =
                        false;

                    fileInput.value =
                        "";
                }
            }
        );


        /* ==================================================
           VOICE
           
           Uses the existing FastAPI /voice route rather
           than creating another voice backend here.
        ================================================== */

        voiceButton.addEventListener(
            "click",
            function() {

                const voiceUrl =
                    "/voice" +
                    "?customer_id=" +
                    encodeURIComponent(
                        customerId
                    ) +
                    "&job_id=" +
                    encodeURIComponent(
                        jobId
                    ) +
                    "&service=" +
                    encodeURIComponent(
                        selectedService
                    );


                window.location.href =
                    voiceUrl;
            }
        );


        /* ==================================================
           REVIEW
        ================================================== */

        reviewButton.addEventListener(
            "click",
            async function() {

                await sendToAda(
                    "Please show me the current work for review and tell me what I should check before approving it.",
                    "review",
                    true
                );
            }
        );


        /* ==================================================
           APPROVE
        ================================================== */

        approveButton.addEventListener(
            "click",
            async function() {

                await sendToAda(
                    "I am ready to approve the current work. Please confirm what is being approved and tell me the next step.",
                    "approve",
                    true
                );
            }
        );


        /* ==================================================
           PAYMENT
        ================================================== */

        paymentButton.addEventListener(
            "click",
            async function() {

                await sendToAda(
                    "I want to proceed to payment for my current request. Please tell me the next step.",
                    "payment",
                    true
                );
            }
        );


        /* ==================================================
           CUSTOMER SERVICE
        ================================================== */

        customerServiceButton.addEventListener(
            "click",
            async function() {

                await sendToAda(
                    "I need Customer Service assistance with my current request. Please assist me.",
                    "customer_service",
                    true
                );
            }
        );


        /* ==================================================
           NEW JOB
        ================================================== */

        newJobButton.addEventListener(
            "click",
            async function() {

                const confirmed =
                    window.confirm(
                        "Start a new job? Your current Ada conversation will be replaced with a new job."
                    );


                if (!confirmed) {
                    return;
                }


                /*
                 * Create a completely new job identifier.
                 * The customer identity remains the same.
                 */

                jobId =
                    "job-" +
                    crypto.randomUUID();


                sessionStorage.setItem(
                    "naija_pocket_job_id",
                    jobId
                );


                conversation.innerHTML =
                    "";


                await sendToAda(
                    "Start a completely new job for the selected service. Begin by explaining how you will help me and ask me the single most important question needed to start.",
                    "new_job",
                    false
                );
            }
        );


        /* ==================================================
           BACK
        ================================================== */

        backButton.addEventListener(
            "click",
            function() {

                window.location.href =
                    "/conversation.html";
            }
        );


        /* ==================================================
           START WORKSPACE
           
           Ada intelligence is activated immediately.
        ================================================== */

        window.addEventListener(
            "DOMContentLoaded",
            function() {

                activateAdaForService();
            }
        );

    </script>

</body>
</html>
