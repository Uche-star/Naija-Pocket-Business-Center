<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding:
                max(12px, env(safe-area-inset-top))
                12px
                calc(20px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
        }

        .workspace {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 32px);
            min-height: calc(100dvh - 32px);
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            background: #171717;
            border-radius: 6px;
            padding: 14px 15px;
            margin-bottom: 10px;
            border-bottom: 2px solid #1E90FF;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.2;
        }

        .selected-service {
            margin-top: 10px;
            background: #0B0B0B;
            border: 1px solid #444444;
            border-radius: 5px;
            padding: 9px 10px;
            font-size: 12px;
            line-height: 1.35;
        }

        .selected-service-label {
            color: #AAAAAA;
            font-size: 10px;
            margin-bottom: 3px;
        }

        .selected-service-name {
            color: white;
            font-weight: bold;
        }

        .service-price {
            margin-top: 8px;
            color: #1E90FF;
            font-size: 13px;
            font-weight: bold;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat-area {
            flex: 1;
            background: #171717;
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            min-height: 280px;
            border: 1px solid #292929;
        }

        .message {
            width: 100%;
            margin-bottom: 15px;
            display: flex;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.you {
            justify-content: flex-end;
        }

        .bubble {
            display: inline-block;
            max-width: 92%;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.ada .bubble {
            background: #242424;
            color: white;
            border-bottom-left-radius: 2px;
        }

        .message.you .bubble {
            background: #063D2A;
            color: white;
            border-bottom-right-radius: 2px;
        }

        /* =====================================================
           UPLOAD STATUS
        ===================================================== */

        .upload-status {
            display: none;
            background: #222222;
            border-left: 3px solid #1E90FF;
            padding: 9px 10px;
            margin-top: 10px;
            font-size: 11px;
            line-height: 1.4;
            text-align: left;
        }

        .upload-status.show {
            display: block;
        }

        /* =====================================================
           CUSTOMER WORKFLOW BUTTONS
        ===================================================== */

        .actions {
            width: 100%;
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-top: 10px;
        }

        .action-button {
            width: 100%;
            min-height: 44px;
            border: none;
            border-radius: 5px;
            padding: 8px 6px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upload-button {
            background: white;
            color: black;
        }

        .voice-button,
        .review-button,
        .approve-button {
            background: #1E90FF;
            color: white;
        }

        .payment-button,
        .customer-service-button {
            background: #CC0000;
            color: white;
        }

        /* =====================================================
           MESSAGE INPUT
        ===================================================== */

        .input-area {
            width: 100%;
            margin-top: 10px;
            display: flex;
            gap: 6px;
            align-items: stretch;
        }

        .message-input {
            flex: 1;
            min-width: 0;
            min-height: 48px;
            resize: vertical;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            padding: 12px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.4;
            outline: none;
        }

        .message-input:focus {
            box-shadow: 0 0 0 2px #1E90FF;
        }

        .send-button {
            width: 82px;
            min-height: 48px;
            border: none;
            border-radius: 5px;
            background: #1E90FF;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-button:active {
            transform: scale(0.98);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =====================================================
           HIDDEN FILE INPUT
        ===================================================== */

        #fileInput {
            display: none;
        }

        /* =====================================================
           PRICING
        ===================================================== */

        .pricing-box {
            width: 100%;
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: #171717;
            border: 1px solid #1E90FF;
            border-radius: 6px;
            text-align: left;
        }

        .pricing-box.show {
            display: block;
        }

        .pricing-title {
            color: #1E90FF;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .pricing-text {
            color: white;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            text-align: center;
            color: #777777;
            font-size: 10px;
            line-height: 1.5;
            padding-top: 12px;
        }

        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {
            .page {
                padding-left: 8px;
                padding-right: 8px;
            }

            .header {
                padding: 12px;
            }

            .chat-area {
                padding: 11px;
            }

            .actions {
                gap: 4px;
            }

            .action-button {
                min-height: 40px;
                font-size: 9px;
            }

            .message-input {
                font-size: 12px;
            }

            .send-button {
                width: 72px;
                font-size: 10px;
            }
        }

        /* =====================================================
           LARGER SCREENS
        ===================================================== */

        @media (min-width: 600px) {
            .page {
                padding-left: 20px;
                padding-right: 20px;
            }

            .actions {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

<div class="page">

    <main class="workspace">

        <!-- =================================================
             HEADER
        ================================================== -->

        <section class="header">

            <div class="brand">
                NAIJA POCKET BUSINESS CENTER
            </div>

            <div class="selected-service">

                <div class="selected-service-label">
                    SELECTED SERVICE
                </div>

                <div
                    id="selectedService"
                    class="selected-service-name"
                >
                    Loading service...
                </div>

                <div
                    id="servicePrice"
                    class="service-price"
                ></div>

            </div>

        </section>

        <!-- =================================================
             ADA CONVERSATION
        ================================================== -->

        <section
            id="chatArea"
            class="chat-area"
        ></section>

        <!-- =================================================
             UPLOAD STATUS
        ================================================== -->

        <div
            id="uploadStatus"
            class="upload-status"
        ></div>

        <!-- =================================================
             CUSTOMER WORKFLOW BUTTONS
        ================================================== -->

        <section class="actions">

            <button
                type="button"
                class="action-button upload-button"
                onclick="openFilePicker()"
            >
                📎 Upload
            </button>

            <button
                type="button"
                class="action-button voice-button"
                onclick="openVoice()"
            >
                🎤 Voice
            </button>

            <button
                type="button"
                class="action-button review-button"
                onclick="reviewDocument()"
            >
                👀 Review
            </button>

            <button
                type="button"
                class="action-button approve-button"
                onclick="approveDocument()"
            >
                ✅ Approve
            </button>

            <button
                type="button"
                class="action-button payment-button"
                onclick="openPayment()"
            >
                💳 Payment &amp; Download
            </button>

            <button
                type="button"
                class="action-button customer-service-button"
                onclick="contactCustomerService()"
            >
                📞 Customer Service
            </button>

        </section>

        <!-- =================================================
             MESSAGE BOX
        ================================================== -->

        <section class="input-area">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Write your message here..."
                rows="2"
            ></textarea>

            <button
                type="button"
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
            >
                SEND
            </button>

        </section>

        <!-- =================================================
             FILE INPUT
        ================================================== -->

        <input
            type="file"
            id="fileInput"
            accept=".pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.webp"
            onchange="handleFileSelected(event)"
        >

        <!-- =================================================
             PRICING
        ================================================== -->

        <section
            id="pricingBox"
            class="pricing-box"
        >

            <div class="pricing-title">
                SERVICE PRICE
            </div>

            <div
                id="pricingText"
                class="pricing-text"
            ></div>

        </section>

        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">
            Naija Pocket Business Center<br>
            Your Business Center In Your Pocket
        </div>

    </main>

</div>

<script>

/* ============================================================
   WORKSPACE STATE
============================================================ */

let selectedService = "";
let intelligenceStarted = false;
let requestInProgress = false;


/* ============================================================
   GET SELECTED SERVICE
============================================================ */

function getSelectedService() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    selectedService =
        params.get("service") || "";

    if (!selectedService) {

        selectedService =
            localStorage.getItem(
                "selectedService"
            ) || "";
    }

    if (!selectedService) {

        selectedService =
            "Service not selected";
    }

    document.getElementById(
        "selectedService"
    ).innerText =
        selectedService;

    localStorage.setItem(
        "selectedService",
        selectedService
    );
}


/* ============================================================
   ADD MESSAGE
   No ADA / YOU labels are displayed.
============================================================ */

function addMessage(
    sender,
    message
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            sender === "You"
                ? "you"
                : "ada"
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.innerText =
        message;

    wrapper.appendChild(
        bubble
    );

    chatArea.appendChild(
        wrapper
    );

    chatArea.scrollTop =
        chatArea.scrollHeight;
}


/* ============================================================
   DISPLAY PRICE
============================================================ */

function displayPrice(price) {

    if (
        price === undefined ||
        price === null ||
        price === ""
    ) {
        return;
    }

    const servicePrice =
        document.getElementById(
            "servicePrice"
        );

    const pricingBox =
        document.getElementById(
            "pricingBox"
        );

    const pricingText =
        document.getElementById(
            "pricingText"
        );

    let formattedPrice =
        String(price);

    if (
        !formattedPrice.includes("₦")
    ) {

        formattedPrice =
            "₦" +
            formattedPrice;
    }

    servicePrice.innerText =
        "SERVICE PRICE: " +
        formattedPrice;

    pricingText.innerText =
        formattedPrice;

    pricingBox.classList.add(
        "show"
    );
}


/* ============================================================
   SEND MESSAGE TO ADA

   Browser
       ↓
   /api/chat
       ↓
   phone_bridge.py
       ↓
   AdaController
       ↓
   AdaAIEngine / Groq
============================================================ */

async function sendToAda(
    message,
    eventName = ""
) {

    const response =
        await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message:
                        message,

                    service:
                        selectedService,

                    event:
                        eventName,

                    activate_intelligence:
                        true

                })
            }
        );

    let result;

    try {

        result =
            await response.json();

    } catch (error) {

        throw new Error(
            "Ada returned an invalid server response."
        );
    }

    if (
        result &&
        result.price !== undefined
    ) {

        displayPrice(
            result.price
        );
    }

    if (
        response.ok &&
        result &&
        result.success
    ) {

        return (
            result.response ||
            "Alright 😊 I’m taking care of your request."
        );
    }

    throw new Error(
        (
            result &&
            result.error
        ) ||
        "Ada could not process the request."
    );
}


/* ============================================================
   START ADA INTELLIGENCE
============================================================ */

async function startAdaIntelligence() {

    if (intelligenceStarted) {
        return;
    }

    intelligenceStarted = true;

    if (
        !selectedService ||
        selectedService ===
        "Service not selected"
    ) {

        addMessage(
            "Ada",
            "Please return to the services and select the service you need. 😊"
        );

        return;
    }

    /*
       This is Ada's first visible
       communication to the customer.
    */

    addMessage(
        "Ada",
        "Hello 😊\n\n" +
        "Welcome to Naija Pocket Business Center\n\n" +
        "I am Ada, your Business Center assistant. As you can see, I am already taking care of your request."
    );

    try {

        const response =
            await sendToAda(

                "The customer has already selected the service shown on the page. Begin helping the customer with that service immediately. Do not ask which service they want. Communicate naturally and warmly. Start with the first useful question or instruction needed to handle the request. Explain the page buttons naturally and simply when appropriate: Upload is for sending a document or file when needed. Voice lets the customer speak instead of typing. Review lets the customer check the work when it is ready. Approve tells you the customer is satisfied with the work. Payment & Download is used when the work is ready for payment and delivery. Customer Service is for getting help. Do not describe these as technical system functions.",

                "service_selected"
            );

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            "Ada intelligence error:",
            error
        );

        addMessage(
            "Ada",
            "I’m ready to take care of your request, but I could not connect to the service right now. Please try again."
        );
    }
}


/* ============================================================
   SEND CUSTOMER MESSAGE
============================================================ */

async function sendMessage() {

    if (requestInProgress) {
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    requestInProgress = true;

    addMessage(
        "You",
        message
    );

    input.value = "";

    sendButton.disabled =
        true;

    sendButton.innerText =
        "WAIT...";

    const waitingMessage =
        document.createElement(
            "div"
        );

    waitingMessage.className =
        "message ada";

    const waitingBubble =
        document.createElement(
            "div"
        );

    waitingBubble.className =
        "bubble";

    waitingBubble.innerText =
        "One moment...";

    waitingMessage.appendChild(
        waitingBubble
    );

    document.getElementById(
        "chatArea"
    ).appendChild(
        waitingMessage
    );

    try {

        const response =
            await sendToAda(
                message,
                "customer_message"
            );

        waitingMessage.remove();

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            "Ada connection error:",
            error
        );

        waitingMessage.remove();

        addMessage(
            "Ada",
            "I could not connect to my Business Center service right now. Please try again."
        );

    } finally {

        requestInProgress =
            false;

        sendButton.disabled =
            false;

        sendButton.innerText =
            "SEND";
    }
}


/* ============================================================
   ENTER TO SEND
============================================================ */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* ============================================================
   UPLOAD
============================================================ */

function openFilePicker() {

    document
        .getElementById(
            "fileInput"
        )
        .click();
}


async function handleFileSelected(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const fileName =
        file.name;

    const status =
        document.getElementById(
            "uploadStatus"
        );

    status.classList.add(
        "show"
    );

    status.innerText =
        "File selected: " +
        fileName;

    addMessage(
        "You",
        "I have uploaded " +
        fileName
    );

    /*
       IMPORTANT:

       The selected document is acknowledged
       through /api/chat.

       We do NOT send normal customer documents
       to /upload because that endpoint was used
       by the phone/recording bridge and expects audio.
    */

    try {

        const response =
            await sendToAda(

                "The customer has uploaded a document or file named '" +
                fileName +
                "'. The customer is working on the selected service. Acknowledge the uploaded material naturally and tell the customer what you need next. Do not ask the customer to select the service again.",

                "file_uploaded"
            );

        status.innerText =
            "Your file has been received.";

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            "Upload workflow error:",
            error
        );

        status.innerText =
            "The file could not be processed.";

        addMessage(
            "Ada",
            "I received the file selection, but I could not continue the request right now. Please try again."
        );
    }

    /*
       Allow the same file to be selected again.
    */

    event.target.value = "";
}


/* ============================================================
   VOICE
============================================================ */

function openVoice() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const voiceUrl =
        params.get("voice");

    if (voiceUrl) {

        window.location.href =
            voiceUrl;

        return;
    }

    addMessage(
        "Ada",
        "You can use Voice when you would rather speak than type. The voice recording page will handle your recording."
    );
}


/* ============================================================
   REVIEW
============================================================ */

async function reviewDocument() {

    await performAdaAction(

        "I want to review my work.",

        "The customer wants to review the current work. Check the active service request and respond naturally. If the work is ready, tell the customer how to review it. If more information or work is still needed, explain that simply.",

        "review"
    );
}


/* ============================================================
   APPROVE
============================================================ */

async function approveDocument() {

    await performAdaAction(

        "I approve the work.",

        "The customer has approved the current work. Check the active service request and continue with the next appropriate step. Do not say payment has been completed unless the system confirms it.",

        "approve"
    );
}


/* ============================================================
   PAYMENT & DOWNLOAD
============================================================ */

async function openPayment() {

    await performAdaAction(

        "I want to continue with Payment & Download.",

        "The customer wants to continue with Payment & Download. Check the active service request and explain the next appropriate step for payment or delivery. Do not claim that payment has been completed unless it has actually been confirmed.",

        "payment_download"
    );
}


/* ============================================================
   CUSTOMER SERVICE
============================================================ */

async function contactCustomerService() {

    await performAdaAction(

        "I want help from Customer Service.",

        "The customer wants Customer Service assistance. Respond naturally and ask what help the customer needs.",

        "customer_service"
    );
}


/* ============================================================
   COMMON ADA BUTTON ACTION
============================================================ */

async function performAdaAction(
    customerMessage,
    controllerMessage,
    eventName
) {

    if (requestInProgress) {
        return;
    }

    requestInProgress = true;

    addMessage(
        "You",
        customerMessage
    );

    const waitingMessage =
        document.createElement(
            "div"
        );

    waitingMessage.className =
        "message ada";

    const waitingBubble =
        document.createElement(
            "div"
        );

    waitingBubble.className =
        "bubble";

    waitingBubble.innerText =
        "One moment...";

    waitingMessage.appendChild(
        waitingBubble
    );

    document.getElementById(
        "chatArea"
    ).appendChild(
        waitingMessage
    );

    try {

        const response =
            await sendToAda(
                controllerMessage,
                eventName
            );

        waitingMessage.remove();

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            eventName +
            " workflow error:",
            error
        );

        waitingMessage.remove();

        addMessage(
            "Ada",
            "I could not continue that part of your request right now. Please try again."
        );

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   START WORKSPACE
============================================================ */

getSelectedService();

startAdaIntelligence();

</script>

</body>
</html>
