<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Naija Pocket Business Center</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0B0B0B;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding:
                max(8px, env(safe-area-inset-top))
                8px
                max(8px, env(safe-area-inset-bottom))
                8px;

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .workspace {
            width: 100%;
            max-width: 700px;
            height: 100%;
            min-height: 0;
            margin: 0 auto;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =====================================================
           FIXED TOP — SERVICE INFORMATION
        ===================================================== */

        .header {
            flex: 0 0 auto;

            background: #171717;
            border-radius: 6px;
            padding: 10px 11px;
            margin-bottom: 6px;

            border-bottom: 2px solid #FFFFFF;
        }

        .brand {
            font-size: 17px;
            font-weight: bold;
        }

        .selected-service {
            margin-top: 7px;

            background: #0B0B0B;
            border: 1px solid #444444;
            border-radius: 5px;

            padding: 7px 9px;
        }

        .selected-service-label {
            color: #AAAAAA;
            font-size: 9px;
            margin-bottom: 2px;
        }

        .selected-service-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .service-price {
            margin-top: 6px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }


        /* =====================================================
           MIDDLE — ONLY THIS AREA SCROLLS
        ===================================================== */

        .chat-area {
            flex: 1 1 auto;

            min-height: 0;
            width: 100%;

            background: #171717;
            border-radius: 6px;

            padding: 12px;

            overflow-y: auto;
            overflow-x: hidden;

            border: 1px solid #292929;

            -webkit-overflow-scrolling: touch;
        }

        .message {
            width: 100%;
            margin-bottom: 13px;

            display: flex;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.you {
            justify-content: flex-end;
        }

        .bubble {
            display: inline-block;

            max-width: 92%;

            padding: 10px 12px;

            border-radius: 8px;

            font-size: 13px;
            line-height: 1.5;

            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .message.ada .bubble {
            background: #242424;
            color: white;

            border-bottom-left-radius: 2px;
        }

        .message.you .bubble {
            background: #111111;
            color: white;

            border: 1px solid #444444;

            border-bottom-right-radius: 2px;
        }


        /* =====================================================
           FIXED BOTTOM ACTION BUTTONS
        ===================================================== */

        .actions {
            flex: 0 0 auto;

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 5px;

            margin-top: 6px;
        }

        .action-button {
            width: 100%;
            min-width: 0;

            min-height: 40px;

            border: 1px solid #444444;
            border-radius: 5px;

            padding: 7px 5px;

            background: #000000;
            color: white;

            font-size: 10px;
            font-weight: bold;

            line-height: 1.15;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .action-button:hover {
            background: #171717;
        }

        .action-button:active {
            background: #242424;
            transform: scale(0.98);
        }

        .upload-button,
        .voice-button,
        .review-button,
        .approve-button,
        .payment-button,
        .customer-service-button {
            background: #000000;
            color: white;
        }


        /* =====================================================
           FIXED MESSAGE INPUT
        ===================================================== */

        .input-area {
            flex: 0 0 auto;

            width: 100%;

            margin-top: 6px;

            display: flex;
            gap: 5px;
        }

        .message-input {
            flex: 1 1 auto;
            min-width: 0;

            min-height: 44px;
            max-height: 90px;

            resize: none;

            background: white;
            color: black;

            border: none;
            border-radius: 5px;

            padding: 10px;

            font-size: 13px;

            outline: none;
        }

        .send-button {
            flex: 0 0 76px;

            min-height: 44px;

            border: 1px solid #444444;
            border-radius: 5px;

            background: #000000;
            color: white;

            font-size: 10px;
            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .send-button:hover {
            background: #171717;
        }

        .send-button:active {
            background: #242424;
            transform: scale(0.98);
        }

        .send-button:disabled {
            opacity: 0.5;
        }

        #fileInput {
            display: none;
        }


        /* =====================================================
           FIXED FOOTER
        ===================================================== */

        .footer {
            flex: 0 0 auto;

            text-align: center;

            color: #777777;

            font-size: 9px;
            line-height: 1.3;

            padding-top: 5px;
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .page {
                padding-left: 6px;
                padding-right: 6px;
            }

            .header {
                padding: 8px 9px;
            }

            .brand {
                font-size: 15px;
            }

            .selected-service {
                padding: 6px 8px;
            }

            .selected-service-name {
                font-size: 13px;
            }

            .chat-area {
                padding: 9px;
            }

            .bubble {
                font-size: 12px;
                padding: 9px 10px;
            }

            .actions {
                gap: 4px;
            }

            .action-button {
                min-height: 37px;
                font-size: 9px;
                padding: 5px 3px;
            }

            .message-input {
                min-height: 42px;
                font-size: 12px;
            }

            .send-button {
                flex-basis: 68px;
                min-height: 42px;
            }

            .footer {
                font-size: 8px;
            }
        }


        /* =====================================================
           LARGER PHONES / TABLETS
        ===================================================== */

        @media (min-width: 600px) {

            .page {
                padding-left: 16px;
                padding-right: 16px;
            }

            .actions {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 6px;
            }

            .action-button {
                min-height: 42px;
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <main class="workspace">

        <!-- =================================================
             FIXED TOP
        ================================================== -->

        <section class="header">

            <div class="brand">
                NAIJA POCKET BUSINESS CENTER
            </div>

            <div class="selected-service">

                <div class="selected-service-label">
                    SELECTED SERVICE
                </div>

                <div
                    id="selectedService"
                    class="selected-service-name"
                >
                    Loading service...
                </div>

                <div
                    id="servicePrice"
                    class="service-price"
                ></div>

            </div>

        </section>


        <!-- =================================================
             MIDDLE — ADA INTELLIGENCE / CUSTOMER CONVERSATION

             ONLY THIS AREA SCROLLS.
        ================================================== -->

        <section
            id="chatArea"
            class="chat-area"
        ></section>


        <!-- =================================================
             FIXED ACTION BUTTONS
        ================================================== -->

        <section class="actions">

            <button
                type="button"
                class="action-button upload-button"
                onclick="openFilePicker()"
            >
                📎 Upload
            </button>

            <button
                type="button"
                class="action-button voice-button"
                onclick="openVoice()"
            >
                🎤 Voice
            </button>

            <button
                type="button"
                class="action-button review-button"
                onclick="reviewDocument()"
            >
                🔍 Review
            </button>

            <button
                type="button"
                class="action-button approve-button"
                onclick="approveDocument()"
            >
                ✅ Approve
            </button>

            <button
                type="button"
                class="action-button payment-button"
                onclick="openPayment()"
            >
                💳 Payment &amp; Download
            </button>

            <button
                type="button"
                class="action-button customer-service-button"
                onclick="contactCustomerService()"
            >
                🆘 Customer Service
            </button>

        </section>


        <!-- =================================================
             FIXED MESSAGE INPUT
        ================================================== -->

        <section class="input-area">

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Write your message here..."
                rows="2"
            ></textarea>

            <button
                type="button"
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
            >
                SEND
            </button>

        </section>


        <input
            type="file"
            id="fileInput"
            accept=".pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.webp"
            onchange="handleFileSelected(event)"
        >


        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">
            Naija Pocket Business Center<br>
            Your Business Center In Your Pocket
        </div>

    </main>

</div>


<script>

let selectedService = "";
let intelligenceStarted = false;
let requestInProgress = false;


/* ============================================================
   GET SERVICE FROM SERVICE BOARD
============================================================ */

function getSelectedService() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    selectedService =
        params.get("service") || "";

    if (!selectedService) {

        selectedService =
            localStorage.getItem(
                "selectedService"
            ) || "";
    }

    if (!selectedService) {

        selectedService =
            "Service not selected";
    }

    document.getElementById(
        "selectedService"
    ).innerText =
        selectedService;

    localStorage.setItem(
        "selectedService",
        selectedService
    );
}


/* ============================================================
   DISPLAY MESSAGE
============================================================ */

function addMessage(
    sender,
    message
) {

    const chatArea =
        document.getElementById(
            "chatArea"
        );

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            sender === "You"
                ? "you"
                : "ada"
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.innerText =
        message;

    wrapper.appendChild(
        bubble
    );

    chatArea.appendChild(
        wrapper
    );

    chatArea.scrollTop =
        chatArea.scrollHeight;
}


/* ============================================================
   SEND TO ADA
   RENDER FASTAPI CONNECTION
============================================================ */

async function sendToAda(
    message,
    eventName
) {

    const response =
        await fetch(
            "https://naija-pocket-business-center.onrender.com/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message:
                        message,

                    service:
                        selectedService,

                    event:
                        eventName,

                    activate_intelligence:
                        true
                })
            }
        );

    let result;

    try {

        result =
            await response.json();

    } catch (error) {

        throw new Error(
            "Ada returned an invalid server response."
        );
    }


    /* ========================================================
       SERVICE PRICE
    ======================================================== */

    if (
        result &&
        result.price !== undefined
    ) {

        const price =
            String(
                result.price
            );

        document.getElementById(
            "servicePrice"
        ).innerText =
            price.includes("₦")
                ? "SERVICE PRICE: " + price
                : "SERVICE PRICE: ₦" + price;
    }


    /* ========================================================
       FASTAPI RETURNS "reply".
       ALSO ACCEPT response/message.
    ======================================================== */

    if (
        response.ok &&
        result &&
        result.success
    ) {

        return (
            result.reply ||
            result.response ||
            result.message ||
            "Ada is ready to help you."
        );
    }

    throw new Error(
        (
            result &&
            result.error
        ) ||
        "Ada could not process the request."
    );
}


/* ============================================================
   AUTOMATIC ADA ACTIVATION
============================================================ */

async function startAdaIntelligence() {

    if (intelligenceStarted) {
        return;
    }

    intelligenceStarted = true;

    if (
        !selectedService ||
        selectedService ===
        "Service not selected"
    ) {

        addMessage(
            "Ada",
            "Please return to the services and select the service you need."
        );

        return;
    }

    try {

        const response =
            await sendToAda(

                "The customer has selected the service '" +
                selectedService +
                "'. Ada should now take over the conversation immediately. Welcome the customer, acknowledge the selected service, and begin the normal conversation for this service. Do not ask which service the customer wants because the service has already been selected. Ask only the first useful question needed to begin the work.",

                "service_selected"
            );

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            "ADA ACTIVATION ERROR:",
            error
        );

        addMessage(
            "Ada",
            "I’m ready to help with your " +
            selectedService +
            " request, but I could not connect to Ada right now. Please try again."
        );
    }
}


/* ============================================================
   CUSTOMER MESSAGE
============================================================ */

async function sendMessage() {

    if (requestInProgress) {
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    requestInProgress = true;

    addMessage(
        "You",
        message
    );

    input.value = "";

    sendButton.disabled =
        true;

    sendButton.innerText =
        "WAIT...";

    try {

        const response =
            await sendToAda(
                message,
                "customer_message"
            );

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            "CUSTOMER MESSAGE ERROR:",
            error
        );

        addMessage(
            "Ada",
            "I could not connect to my Business Center service right now. Please try again."
        );

    } finally {

        requestInProgress =
            false;

        sendButton.disabled =
            false;

        sendButton.innerText =
            "SEND";
    }
}


/* ============================================================
   ENTER TO SEND
============================================================ */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


/* ============================================================
   UPLOAD
============================================================ */

function openFilePicker() {

    document
        .getElementById(
            "fileInput"
        )
        .click();
}


async function handleFileSelected(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    addMessage(
        "You",
        "I have uploaded " +
        file.name
    );

    try {

        const response =
            await sendToAda(

                "The customer has uploaded a file named '" +
                file.name +
                "'. Continue helping with the selected service.",

                "file_uploaded"
            );

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        addMessage(
            "Ada",
            "I could not continue with the uploaded file right now. Please try again."
        );
    }

    event.target.value = "";
}


/* ============================================================
   VOICE
============================================================ */

function openVoice() {

    addMessage(
        "Ada",
        "Voice input can be used when you would rather speak than type."
    );
}


/* ============================================================
   REVIEW
============================================================ */

async function reviewDocument() {

    await performAdaAction(

        "I want to review my work.",

        "The customer wants to review the current work. Continue the active service request and explain the next appropriate step.",

        "review"
    );
}


/* ============================================================
   APPROVE
============================================================ */

async function approveDocument() {

    await performAdaAction(

        "I approve the work.",

        "The customer has approved the current work. Continue with the next appropriate step. Do not claim payment has been completed.",

        "approve"
    );
}


/* ============================================================
   PAYMENT
============================================================ */

async function openPayment() {

    await performAdaAction(

        "I want to continue with Payment & Download.",

        "The customer wants to continue with Payment and Download. Explain the next appropriate payment or delivery step. Do not claim payment is completed unless confirmed.",

        "payment_download"
    );
}


/* ============================================================
   CUSTOMER SERVICE
============================================================ */

async function contactCustomerService() {

    await performAdaAction(

        "I want help from Customer Service.",

        "The customer wants Customer Service assistance. Ask what help the customer needs.",

        "customer_service"
    );
}


/* ============================================================
   COMMON ADA ACTION
============================================================ */

async function performAdaAction(
    customerMessage,
    controllerMessage,
    eventName
) {

    if (requestInProgress) {
        return;
    }

    requestInProgress = true;

    addMessage(
        "You",
        customerMessage
    );

    try {

        const response =
            await sendToAda(
                controllerMessage,
                eventName
            );

        addMessage(
            "Ada",
            response
        );

    } catch (error) {

        console.error(
            eventName +
            " ERROR:",
            error
        );

        addMessage(
            "Ada",
            "I could not continue that part of your request right now. Please try again."
        );

    } finally {

        requestInProgress =
            false;
    }
}


/* ============================================================
   START WORKSPACE
   SERVICE IS ALREADY SELECTED.
   ADA STARTS AUTOMATICALLY.
============================================================ */

getSelectedService();
startAdaIntelligence();

</script>

</body>
</html>
