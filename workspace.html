<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Ada — Naija Pocket Business Center</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ==================================================
           HEADER
        ================================================== */

        .top-header {
            flex: 0 0 auto;

            width: 100%;

            padding:
                calc(12px + env(safe-area-inset-top))
                16px
                12px
                16px;

            background: #000;

            border-bottom: 1px solid #222;

            text-align: center;
        }

        .brand {
            margin: 0;

            font-family:
                Montserrat,
                Arial,
                sans-serif;

            font-size: 22px;

            font-weight: 800;

            color: #d4af37;

            letter-spacing: .3px;
        }

        .ada-label {
            margin-top: 4px;

            font-size: 13px;

            color: #aaa;
        }

        .service-label {
            margin-top: 8px;

            padding: 8px 12px;

            border-radius: 8px;

            background: #181818;

            color: #fff;

            font-size: 14px;

            font-weight: 700;
        }

        /* ==================================================
           MAIN CONVERSATION AREA
        ================================================== */

        .conversation-area {
            flex: 1 1 auto;

            min-height: 0;

            width: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 14px;

            background: #000;

            -webkit-overflow-scrolling: touch;
        }

        .conversation-area::-webkit-scrollbar {
            width: 4px;
        }

        .conversation-area::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .message {
            width: 100%;

            display: flex;

            margin-bottom: 12px;
        }

        .message.ada {
            justify-content: flex-start;
        }

        .message.customer {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 88%;

            padding: 12px 14px;

            border-radius: 14px;

            font-size: 15px;

            line-height: 1.5;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .message.ada .bubble {
            background: #181818;

            color: #fff;

            border:
                1px solid
                #292929;

            border-bottom-left-radius: 4px;
        }

        .message.customer .bubble {
            background: #d4af37;

            color: #000;

            border-bottom-right-radius: 4px;

            font-weight: 600;
        }

        .typing {
            display: none;

            color: #999;

            font-size: 13px;

            margin:
                4px
                4px
                12px
                4px;
        }

        /* ==================================================
           UPLOAD / VOICE STATUS
        ================================================== */

        .attachment-status {
            display: none;

            margin: 0 0 10px 0;

            padding: 10px 12px;

            border-radius: 8px;

            background: #151515;

            border: 1px solid #292929;

            color: #ddd;

            font-size: 13px;

            overflow-wrap: anywhere;
        }

        .recording-status {
            display: none;

            margin: 0 0 10px 0;

            padding: 10px 12px;

            border-radius: 8px;

            background: #351515;

            border: 1px solid #6b2222;

            color: #fff;

            font-size: 13px;

            text-align: center;
        }

        /* ==================================================
           BOTTOM CONTROLS
        ================================================== */

        .bottom-area {
            flex: 0 0 auto;

            width: 100%;

            padding:
                10px
                10px
                calc(10px + env(safe-area-inset-bottom))
                10px;

            background: #000;

            border-top: 1px solid #222;
        }

        .action-row {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 7px;

            margin-bottom: 9px;
        }

        .action-button {
            min-height: 44px;

            padding: 8px 5px;

            border: 1px solid #333;

            border-radius: 8px;

            background: #111;

            color: #fff;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            touch-action: manipulation;
        }

        .action-button:active {
            transform: scale(.98);
        }

        .action-button:disabled {
            opacity: .45;

            cursor: not-allowed;
        }

        .message-row {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .message-input {
            flex: 1;

            min-width: 0;

            height: 46px;

            padding:
                0
                13px;

            border:
                1px solid
                #333;

            border-radius: 10px;

            outline: none;

            background: #151515;

            color: #fff;

            font-family: inherit;

            font-size: 15px;
        }

        .message-input::placeholder {
            color: #777;
        }

        .send-button {
            flex: 0 0 72px;

            height: 46px;

            border: none;

            border-radius: 10px;

            background: #d4af37;

            color: #000;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            touch-action: manipulation;
        }

        .send-button:disabled {
            opacity: .45;

            cursor: not-allowed;
        }

        /* ==================================================
           SMALL SCREENS
        ================================================== */

        @media (max-width: 420px) {

            .brand {
                font-size: 20px;
            }

            .bubble {
                max-width: 92%;

                font-size: 14px;
            }

            .action-row {
                gap: 5px;
            }

            .action-button {
                min-height: 42px;

                font-size: 11px;
            }

            .send-button {
                flex-basis: 64px;
            }
        }

    </style>
</head>


<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="top-header">

        <h1 class="brand">
            Naija Pocket Business Center
        </h1>

        <div class="ada-label">
            Ada — Business Center Assistant
        </div>

        <div
            id="serviceLabel"
            class="service-label"
        >
            Service not selected
        </div>

    </header>


    <!-- ==================================================
         CONVERSATION
    ================================================== -->

    <main
        id="conversationArea"
        class="conversation-area"
    >

        <div
            id="typingIndicator"
            class="typing"
        >
            Ada is working on it...
        </div>

    </main>


    <!-- ==================================================
         BOTTOM AREA
    ================================================== -->

    <section class="bottom-area">

        <div
            id="attachmentStatus"
            class="attachment-status"
        ></div>

        <div
            id="recordingStatus"
            class="recording-status"
        >
            Recording voice message...
        </div>


        <!-- ==================================================
             ACTION BUTTONS
        ================================================== -->

        <div class="action-row">

            <button
                id="uploadButton"
                class="action-button"
                type="button"
            >
                Upload
            </button>

            <button
                id="voiceButton"
                class="action-button"
                type="button"
            >
                Voice
            </button>

            <button
                id="reviewButton"
                class="action-button"
                type="button"
            >
                Review
            </button>

            <button
                id="approveButton"
                class="action-button"
                type="button"
            >
                Approve
            </button>

        </div>


        <div class="action-row">

            <button
                id="paymentButton"
                class="action-button"
                type="button"
            >
                Payment
            </button>

            <button
                id="customerServiceButton"
                class="action-button"
                type="button"
            >
                Customer Service
            </button>

            <button
                id="newJobButton"
                class="action-button"
                type="button"
            >
                New Job
            </button>

            <button
                id="backButton"
                class="action-button"
                type="button"
            >
                Back
            </button>

        </div>


        <!-- ==================================================
             MESSAGE INPUT
        ================================================== -->

        <div class="message-row">

            <input
                id="messageInput"
                class="message-input"
                type="text"
                autocomplete="off"
                placeholder="Type your message..."
            >

            <button
                id="sendButton"
                class="send-button"
                type="button"
            >
                Send
            </button>

        </div>

    </section>


    <!-- ==================================================
         HIDDEN FILE INPUT
    ================================================== -->

    <input
        id="fileInput"
        type="file"
        hidden
    >


<script>

"use strict";


/* ==========================================================
   API
========================================================== */

/*
    Workspace is served by the same FastAPI application.

    Therefore use relative API paths.

    This avoids hard-coding an old Render/Cloudflare/Flask
    address into the page.
*/

const API_CHAT = "/api/chat";
const API_UPLOAD = "/upload";


/* ==========================================================
   DOM
========================================================== */

const conversationArea =
    document.getElementById(
        "conversationArea"
    );

const typingIndicator =
    document.getElementById(
        "typingIndicator"
    );

const serviceLabel =
    document.getElementById(
        "serviceLabel"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const voiceButton =
    document.getElementById(
        "voiceButton"
    );

const reviewButton =
    document.getElementById(
        "reviewButton"
    );

const approveButton =
    document.getElementById(
        "approveButton"
    );

const paymentButton =
    document.getElementById(
        "paymentButton"
    );

const customerServiceButton =
    document.getElementById(
        "customerServiceButton"
    );

const newJobButton =
    document.getElementById(
        "newJobButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const attachmentStatus =
    document.getElementById(
        "attachmentStatus"
    );

const recordingStatus =
    document.getElementById(
        "recordingStatus"
    );


/* ==========================================================
   SERVICE
========================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let service =
    params.get("service");

if (!service) {

    service =
        localStorage.getItem(
            "selectedService"
        );
}

if (!service) {

    service =
        "Service not selected";
}

service =
    String(service).trim();

serviceLabel.textContent =
    service;


/* ==========================================================
   CUSTOMER / JOB IDENTIFIERS
========================================================== */

/*
    These identifiers remain in sessionStorage so that:

        conversation
             ↓
        workspace
             ↓
        upload
             ↓
        voice
             ↓
        chat

    all belong to the same customer/job session.
*/

function createId(prefix) {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return (
            prefix +
            "_" +
            crypto.randomUUID()
        );
    }

    return (
        prefix +
        "_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


let customerId =
    sessionStorage.getItem(
        "ada_customer_id"
    );

if (!customerId) {

    customerId =
        createId("customer");

    sessionStorage.setItem(
        "ada_customer_id",
        customerId
    );
}


let jobId =
    sessionStorage.getItem(
        "ada_job_id"
    );

if (!jobId) {

    jobId =
        createId("job");

    sessionStorage.setItem(
        "ada_job_id",
        jobId
    );
}


/* ==========================================================
   CLIENT REQUEST ID
========================================================== */

function createRequestId() {

    return createId(
        "request"
    );
}


/* ==========================================================
   DISPLAY MESSAGE
========================================================== */

function addMessage(
    text,
    sender
) {

    if (
        text === null ||
        text === undefined
    ) {

        return;
    }

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        (
            sender === "customer"
                ? "customer"
                : "ada"
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.textContent =
        String(text);

    message.appendChild(
        bubble
    );

    conversationArea.insertBefore(
        message,
        typingIndicator
    );

    scrollToBottom();
}


/* ==========================================================
   SCROLL
========================================================== */

function scrollToBottom() {

    requestAnimationFrame(
        function () {

            conversationArea.scrollTop =
                conversationArea.scrollHeight;

        }
    );
}


/* ==========================================================
   TYPING
========================================================== */

function showTyping() {

    typingIndicator.style.display =
        "block";

    scrollToBottom();
}


function hideTyping() {

    typingIndicator.style.display =
        "none";
}


/* ==========================================================
   BUTTON LOCK
========================================================== */

function setBusy(
    busy
) {

    sendButton.disabled =
        busy;

    uploadButton.disabled =
        busy;

    reviewButton.disabled =
        busy;

    approveButton.disabled =
        busy;

    paymentButton.disabled =
        busy;

    customerServiceButton.disabled =
        busy;

    newJobButton.disabled =
        busy;
}


/* ==========================================================
   CHAT
========================================================== */

async function sendToAda(
    message,
    eventName = null,
    displayCustomerMessage = true
) {

    message =
        String(message || "")
            .trim();

    if (!message) {

        return;
    }

    if (
        displayCustomerMessage
    ) {

        addMessage(
            message,
            "customer"
        );
    }

    showTyping();

    setBusy(true);

    try {

        const payload = {

            message:

                message,

            service:

                service,

            event:

                eventName,

            customer_id:

                customerId,

            job_id:

                jobId,

            client_request_id:

                createRequestId(),

            activate_intelligence:

                true

        };


        const response =
            await fetch(
                API_CHAT,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }
            );


        let result = null;

        try {

            result =
                await response.json();

        } catch {

            result = null;

        }


        if (
            !response.ok
        ) {

            throw new Error(
                "Chat request failed."
            );

        }


        const reply =
            result &&
            (
                result.reply ||
                result.response ||
                result.message
            );


        if (reply) {

            addMessage(
                reply,
                "ada"
            );

        } else {

            addMessage(
                "Sorry, Ada could not complete that step right now. Please try again.",
                "ada"
            );

        }


        if (
            result &&
            result.price !== undefined &&
            result.price !== null
        ) {

            addMessage(
                "Price: ₦" +
                result.price,
                "ada"
            );

        }

    } catch (error) {

        console.error(
            "ADA CHAT ERROR:",
            error
        );

        addMessage(
            "Sorry, we could not complete that step right now. Please try again in a moment.",
            "ada"
        );

    } finally {

        hideTyping();

        setBusy(false);

        messageInput.focus();

    }
}


/* ==========================================================
   SEND BUTTON
========================================================== */

async function sendCurrentMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {

        addMessage(
            "Please enter a message so Ada can continue helping you.",
            "ada"
        );

        return;
    }

    messageInput.value = "";

    await sendToAda(
        message,
        null,
        true
    );
}


sendButton.addEventListener(
    "click",
    sendCurrentMessage
);


messageInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendCurrentMessage();

        }

    }
);


/* ==========================================================
   REAL FILE UPLOAD
========================================================== */

uploadButton.addEventListener(
    "click",
    function () {

        fileInput.value = "";

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    async function () {

        const file =
            fileInput.files &&
            fileInput.files[0];

        if (!file) {

            return;
        }

        await uploadActualFile(
            file
        );

    }
);


async function uploadActualFile(
    file
) {

    attachmentStatus.style.display =
        "block";

    attachmentStatus.textContent =
        "Uploading " +
        file.name +
        "...";

    uploadButton.disabled =
        true;

    try {

        const formData =
            new FormData();

        /*
            IMPORTANT:

            This sends the actual file bytes.

            The field name "file" matches:

                file: UploadFile = File(...)

            in ada_api.py.
        */

        formData.append(
            "file",
            file,
            file.name
        );


        formData.append(
            "customer_id",
            customerId
        );


        formData.append(
            "job_id",
            jobId
        );


        formData.append(
            "service",
            service
        );


        const response =
            await fetch(
                API_UPLOAD,
                {

                    method:
                        "POST",

                    body:
                        formData

                }
            );


        let result = null;

        try {

            result =
                await response.json();

        } catch {

            result = null;

        }


        if (
            !response.ok ||
            !result ||
            result.success !== true
        ) {

            throw new Error(
                "Upload failed."
            );

        }


        const storedName =
            result.stored_filename ||
            file.name;


        attachmentStatus.textContent =
            "File received: " +
            file.name;


        addMessage(
            "I have received your file: " +
            file.name +
            ". Ada can now continue with your request.",
            "ada"
        );


        /*
            Tell Ada that a real file has been
            attached to the current job.

            The actual file was already sent to
            /upload above.
        */

        await sendToAda(

            "A file has been uploaded for this request. " +
            "The uploaded file is: " +
            file.name +
            ". Stored file reference: " +
            storedName +
            ". Please continue helping me with my request.",

            "file_uploaded",

            false

        );


    } catch (error) {

        console.error(
            "FILE UPLOAD ERROR:",
            error
        );

        attachmentStatus.textContent =
            "We could not receive that file. Please try again.";

        addMessage(
            "Sorry, we could not receive that file right now. Please try again.",
            "ada"
        );

    } finally {

        uploadButton.disabled =
            false;

    }
}


/* ==========================================================
   VOICE RECORDING
========================================================== */

let mediaRecorder =
    null;

let recordedChunks =
    [];

let recordingStream =
    null;

let isRecording =
    false;


/* ==========================================================
   VOICE BUTTON
========================================================== */

voiceButton.addEventListener(
    "click",
    async function () {

        if (isRecording) {

            stopVoiceRecording();

            return;

        }

        await startVoiceRecording();

    }
);


/* ==========================================================
   START VOICE
========================================================== */

async function startVoiceRecording() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        addMessage(
            "Voice recording is not available on this device.",
            "ada"
        );

        return;
    }


    try {

        recordingStream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        recordedChunks = [];


        let mimeType = "";


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            mimeType =
                "audio/webm";

        }


        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    recordingStream,
                    {
                        mimeType:
                            mimeType
                    }
                )
                : new MediaRecorder(
                    recordingStream
                );


        mediaRecorder.ondataavailable =
            function (event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function () {

                const finalType =
                    mimeType ||
                    "audio/webm";


                const audioBlob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                finalType
                        }
                    );


                stopRecordingStream();


                if (
                    audioBlob.size <= 0
                ) {

                    recordingStatus.style.display =
                        "none";

                    voiceButton.textContent =
                        "Voice";

                    isRecording =
                        false;

                    addMessage(
                        "No voice recording was captured. Please try again.",
                        "ada"
                    );

                    return;

                }


                await uploadVoiceRecording(
                    audioBlob
                );

            };


        mediaRecorder.start();


        isRecording =
            true;


        recordingStatus.style.display =
            "block";


        recordingStatus.textContent =
            "Recording voice message... Tap Voice again to stop.";


        voiceButton.textContent =
            "Stop Voice";


        uploadButton.disabled =
            true;


    } catch (error) {

        console.error(
            "VOICE START ERROR:",
            error
        );

        stopRecordingStream();


        recordingStatus.style.display =
            "none";


        voiceButton.textContent =
            "Voice";


        isRecording =
            false;


        addMessage(
            "Sorry, we could not start voice recording. Please allow microphone access and try again.",
            "ada"
        );

    }

}


/* ==========================================================
   STOP VOICE
========================================================== */

function stopVoiceRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    } else {

        stopRecordingStream();

        isRecording =
            false;

        recordingStatus.style.display =
            "none";

        voiceButton.textContent =
            "Voice";

        uploadButton.disabled =
            false;

    }

}


/* ==========================================================
   STOP MICROPHONE STREAM
========================================================== */

function stopRecordingStream() {

    if (
        recordingStream
    ) {

        recordingStream
            .getTracks()
            .forEach(
                function (track) {

                    track.stop();

                }
            );

    }

    recordingStream =
        null;

}


/* ==========================================================
   UPLOAD VOICE
========================================================== */

async function uploadVoiceRecording(
    audioBlob
) {

    recordingStatus.style.display =
        "block";

    recordingStatus.textContent =
        "Sending your voice message to Ada...";


    try {

        const filename =
            "voice_" +
            Date.now() +
            ".webm";


        const voiceFile =
            new File(
                [audioBlob],
                filename,
                {
                    type:
                        audioBlob.type ||
                        "audio/webm"
                }
            );


        /*
            Voice uses the same real /upload
            endpoint as ordinary files.

            FastAPI receives it as UploadFile.
        */

        await uploadActualVoiceFile(
            voiceFile
        );


    } catch (error) {

        console.error(
            "VOICE UPLOAD ERROR:",
            error
        );

        recordingStatus.textContent =
            "Sorry, we could not send the voice message.";

        addMessage(
            "Sorry, we could not send your voice message right now. Please try again.",
            "ada"
        );

    } finally {

        isRecording =
            false;

        mediaRecorder =
            null;

        voiceButton.textContent =
            "Voice";

        uploadButton.disabled =
            false;

        setTimeout(
            function () {

                recordingStatus.style.display =
                    "none";

            },
            1500
        );

    }

}


/* ==========================================================
   UPLOAD VOICE FILE
========================================================== */

async function uploadActualVoiceFile(
    voiceFile
) {

    const formData =
        new FormData();


    formData.append(
        "file",
        voiceFile,
        voiceFile.name
    );


    formData.append(
        "customer_id",
        customerId
    );


    formData.append(
        "job_id",
        jobId
    );


    formData.append(
        "service",
        service
    );


    const response =
        await fetch(
            API_UPLOAD,
            {

                method:
                    "POST",

                body:
                    formData

            }
        );


    let result = null;

    try {

        result =
            await response.json();

    } catch {

        result = null;

    }


    if (
        !response.ok ||
        !result ||
        result.success !== true
    ) {

        throw new Error(
            "Voice upload failed."
        );

    }


    recordingStatus.textContent =
        "Voice message received.";


    addMessage(
        "I have received your voice message. Ada can now continue with your request.",
        "ada"
    );


    /*
        Notify Ada through the normal
        intelligence route.

        This keeps the conversation in
        the same customer/job session.
    */

    await sendToAda(

        "A voice message has been uploaded for this request. " +
        "The voice recording is attached to the current job. " +
        "Please continue helping me with my request.",

        "voice_uploaded",

        false

    );

}

/* ==========================================================
   NEW JOB
========================================================== */

newJobButton.addEventListener(
    "click",
    async function () {

        const confirmed =
            window.confirm(
                "Start a new job?"
            );

        if (!confirmed) {

            return;

        }


        /*
            Keep the same customer.

            Replace only the job ID.

            This gives the customer a fresh
            AdaController session.
        */

        jobId =
            createId("job");


        sessionStorage.setItem(
            "ada_job_id",
            jobId
        );


        conversationArea.innerHTML =
            "";


        conversationArea.appendChild(
            typingIndicator
        );


        addMessage(
            "Starting a new request...",
            "customer"
        );


        await sendToAda(
            "I am starting a new job. Please begin a fresh request for me.",
            "new_job",
            false
        );

    }
);

/* ==========================================================
   START ADA SESSION
========================================================== */

async function startAdaSession() {

    /*
        This is deliberately done once.

        Selecting a service should immediately
        enter the Ada workflow.
    */

    await sendToAda(

        "I have selected the service: " +
        service +
        ". Please begin working with me on this request and tell me what you need from me.",

        "service_selected",

        false

    );

}

========================================================== */

            "ada"

        await startAdaSession();


        messageInput.focus();

);
